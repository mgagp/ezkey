# Major-upgrade platform register (v1)
#
# Traceable list of platforms / runtimes / base images whose support line (or
# semver major) must be decided deliberately. Not a library inventory.
#
# Field summary:
#   id            stable key
#   component     human label
#   owner         register steward (usually fred)
#   eol_slug      endoflife.date product id, or null for manual follow
#   current       SUPPORT LINE only (endoflife.date cycle, or semver major /
#                 major.minor line when not on EOL). Homogeneous: never a
#                 patch pin (use "4.1" not "4.1.1", "19" not "19.3.0").
#   sources       list of {file, expect}; expect is a LINE-LEVEL substring
#                 (grep -F). Do not pin patch digits — routine patches must
#                 not false-fail drift. expect defaults to current if omitted.
#   eol           support end date last recorded (or estimate noted in notes)
#   target        desired line per lane README target rule, OR follow:<id>
#   decision      keep | plan | follow:<id> | accept-risk
#   security      true when security-owner written opinion is mandatory
#   warn_months   optional; default 6 (react-native uses 3)
#   accept_until  required when decision is accept-risk AND security is true;
#                 at most 6 months after last_review
#   issue         dedicated GitHub issue number when planned, else null
#   last_review   YYYY-MM-DD of last human/register review
#   notes         free text; link Christophe opinion here when present
#
# Baseline: main @ f7c84f37 · EOL values from endoflife.date 2026-10-07
# (proposal annex B). Line-level expect pass: craft review Patrick 2026-10-08.

