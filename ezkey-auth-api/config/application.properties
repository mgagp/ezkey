# Ezkey Auth API - Default Configuration
spring.application.name=ezkey-auth-api
server.port=8080

# Database Configuration (shared with core)
spring.datasource.url=jdbc:postgresql://localhost:5432/ezkey_db
spring.datasource.username=ezkey_auth
spring.datasource.password=ezkey_auth
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# NOTE: spring.jpa.open-in-view is intentionally left at the Spring Boot default (true) until all
# admin/auth controller layers are refactored to initialize lazy associations inside @Transactional
# service boundaries. Setting it to false caused regressions in admin-api endpoints that map lazy
# collections (e.g., Integration.i18n) in the controller/mapper layer after the service returns.
# The shared-reference hazard on Integration.i18n is mitigated instead by:
#   1. EnrollmentController.resolveTenantId() using a scalar projection (findTenantIdByIntegrationId)
#      so no tracked Integration entity is loaded in the controller session.
#   2. All admin provisioning callers using findSystemIntegrationReadOnly() (@QueryHint readOnly).
# See IntegrationRepository for details.

# Jackson Datetime Configuration
# Serialize all OffsetDateTime to UTC with Z suffix for consistent API responses
# spring.jackson.serialization.write-dates-as-timestamps=false (disabled for Spring Boot 4)
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'

# Flyway Migration
spring.flyway.enabled=false

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Operation and tag order come from OpenApiPresentationCustomizer in the generated spec.
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.custom-site-title=Ezkey Auth API Documentation

# Logging Configuration
logging.level.org.ezkey=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.level.org.springframework.data.jpa.repository=DEBUG
logging.level.org.springframework.boot.autoconfigure.domain=DEBUG

server.tomcat.threads.max=2
server.tomcat.threads.min-spare=2

# Rate Limiting Configuration
# See application-docker.properties and application-windows.properties for profile-specific settings
# Respond endpoint: ezkey.rate-limit.respond.requests=1, ezkey.rate-limit.respond.window-minutes=5,
#   ezkey.rate-limit.respond.key-strategy=auth-attempt-id (per authAttemptId from request body)
ezkey.rate-limit.enabled=true

# Demo / lab (default off). When true, Pending responses for attempts with
# demo_mitm_signature_enabled may be tampered after signing (simulated MITM for presentations).
ezkey.demo.mitm-signature-enabled=false

# ==============================================
# Trusted Proxy (client IP for rate limit & audit)
# ==============================================
# When behind a reverse proxy (Caddy, Nginx, Cloudflare), client IP is taken from
# X-Forwarded-For / X-Real-IP / CF-Connecting-IP only if the direct connection is from
# an IP in this list. Prevents spoofing. Empty = use only remote address (no header trust).
# Env: EZKEY_TRUSTED_PROXIES_CIDRS (comma-separated CIDRs). See admin-api application.properties for details.
# ezkey.trusted-proxies[0]=10.0.0.0/8
# ezkey.trusted-proxies[1]=172.16.0.0/12
# ezkey.trusted-proxies[2]=192.168.0.0/16

# ==============================================
# Encryption Configuration (Tink)
# ==============================================
# IMPORTANT: Path configuration is profile-specific
#
# Profiles:
#   - docker (default): Uses /etc/ezkey/secrets/master.key from Docker volume
#   - windows: Uses C:\ProgramData\ezkey\secrets\master.key from Windows local
#
# To activate a profile:
#   - Set SPRING_PROFILES_ACTIVE=windows (Windows)
#   - Set SPRING_PROFILES_ACTIVE=docker (Docker)
#   - Or pass: java -jar app.jar --spring.profiles.active=windows
#
# Generate master key:
#   Linux/Mac: sudo ./scripts/generate-master-key.sh
#   Windows: .\scripts\generate-master-key.ps1
#
# Note: Same master key must be used across admin-api and auth-api

ezkey.encryption.enabled=true
ezkey.encryption.algorithm=AES256_GCM

# Default encryption paths (WILL BE OVERRIDDEN by active profile)
# Default to Docker paths (most common deployment)
# Profile 'docker': Uses /etc/ezkey/secrets/master.key (Docker volume)
# Profile 'windows': Overrides to C:\ProgramData\ezkey\secrets\master.key
ezkey.encryption.master-key-file=/etc/ezkey/secrets/master.key
ezkey.encryption.keyset-file=/etc/ezkey/keysets/keyset.json.encrypted

# Keyset Storage Mode (overridden by profiles)
ezkey.encryption.keyset.storage-mode=DATABASE

# Key rotation configuration (DISABLED in Auth API)
# Rotation jobs run ONLY in Admin API
ezkey.encryption.rotation.enabled=false
ezkey.encryption.reencryption.enabled=false

# ==============================================
# Audit Log Integrity (HMAC Signing)
# ==============================================
ezkey.audit.integrity.enabled=true
ezkey.audit.integrity.hmac-key-file=/etc/ezkey/secrets/audit-hmac.key
ezkey.audit.integrity.instance-id=${EZKEY_INSTANCE_ID:auth-api}

# Chain checkpoints run ONLY in Admin API
ezkey.audit.chain.enabled=false
