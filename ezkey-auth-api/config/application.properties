# Ezkey Auth API - Default Configuration
spring.application.name=ezkey-auth-api
server.port=8080

# Database Configuration (shared with core)
spring.datasource.url=jdbc:postgresql://localhost:5432/ezkey_db
spring.datasource.username=postgres
spring.datasource.password=ezkey
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson Datetime Configuration
# Serialize all OffsetDateTime to UTC with Z suffix for consistent API responses
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'

# Flyway Migration
spring.flyway.enabled=false

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.custom-site-title=Ezkey Auth API Documentation

# Logging Configuration
logging.level.org.ezkey=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.level.org.springframework.data.jpa.repository=DEBUG
logging.level.org.springframework.boot.autoconfigure.domain=DEBUG

# Development Tools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true 

server.tomcat.threads.max=2
server.tomcat.threads.min-spare=2

# Rate Limiting Configuration
ezkey.rate-limit.enabled=true

# Auth Pending - User-initiated polling (permissive for normal usage)
ezkey.rate-limit.pending.requests=10
ezkey.rate-limit.pending.window-minutes=1
ezkey.rate-limit.pending.key-strategy=enrollment-id

# Auth Verify - User responses (restrictive for security)
ezkey.rate-limit.verify.requests=5
ezkey.rate-limit.verify.window-minutes=5
ezkey.rate-limit.verify.key-strategy=client-ip

# Auth Bind - Enrollment binding (very restrictive for enumeration protection)
ezkey.rate-limit.bind.requests=3
ezkey.rate-limit.bind.window-minutes=5
ezkey.rate-limit.bind.key-strategy=client-ip

# ==============================================
# Encryption Configuration (Tink)
# ==============================================
# Enable/disable encryption at rest
# If disabled, data will be stored in plaintext (backward compatible mode)
# If enabled but master key missing, encryption will be disabled with warning
ezkey.encryption.enabled=true

# Master key file path (Base64-encoded 256-bit key)
# Generate master key: sudo ./scripts/generate-master-key.sh (Linux/Mac)
#                      .\scripts\generate-master-key.ps1 (Windows as Administrator)
# Note: Same master key must be used across admin-api and auth-api
##ezkey.encryption.master-key-file=/etc/ezkey/secrets/master.key

# Keyset file path (encrypted with master key)
##ezkey.encryption.keyset-file=/etc/ezkey/keysets/keyset.json.encrypted

# Encryption algorithm: AES256_GCM or CHACHA20_POLY1305
ezkey.encryption.algorithm=AES256_GCM

# ==============================================
# Encryption Keyset Storage Configuration
# ==============================================
# Storage mode: FILE (local only), DATABASE (distributed), HYBRID (both)
# For local development (single instance), FILE mode is recommended
# For Docker/cloud deployments, DATABASE mode is recommended
ezkey.encryption.keyset.storage-mode=FILE
ezkey.encryption.keyset.degraded-mode-enabled=false
ezkey.encryption.keyset.max-reload-retries=1

# Key rotation configuration (DISABLED in Auth API)
# Rotation jobs run ONLY in Admin API
ezkey.encryption.rotation.enabled=false
ezkey.encryption.reencryption.enabled=false

### ==============================================
# Windows dev paths (same as admin-api for shared keyset)
#ezkey.encryption.master-key-file=C:\\ProgramData\\ezkey\\secrets\\master.key
#ezkey.encryption.keyset-file=C:\\ProgramData\\ezkey\\keysets\\keyset.json.encrypted
ezkey.encryption.master-key-file=/c/ProgramData/ezkey/secrets/master.key
ezkey.encryption.keyset-file=/c/ProgramData/ezkey/keysets/keyset.json.encrypted
### ==============================================