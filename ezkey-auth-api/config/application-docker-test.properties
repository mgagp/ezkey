# Ezkey Auth API - Docker Test Mode Configuration
# This profile extends docker profile with permissive rate limiting for unrestricted testing
# Usage: SPRING_PROFILES_ACTIVE=docker,docker-test

# ==============================================
# Rate Limiting Configuration (Test Mode - Permissive)
# ==============================================
# Disable rate limiting entirely for unrestricted testing
# This allows tests to run in any order and frequency without rate limit constraints
ezkey.rate-limit.enabled=false

# Alternative: If you prefer to keep rate limiting enabled but with very high limits:
# ezkey.rate-limit.enabled=true
# ezkey.rate-limit.pending.requests=1000
# ezkey.rate-limit.pending.window-minutes=1
# ezkey.rate-limit.pending.key-strategy=enrollment-id
# ezkey.rate-limit.verify.requests=1000
# ezkey.rate-limit.verify.window-minutes=1
# ezkey.rate-limit.verify.key-strategy=client-ip
# ezkey.rate-limit.bind.requests=1000
# ezkey.rate-limit.bind.window-minutes=1
# ezkey.rate-limit.bind.key-strategy=client-ip

# ==============================================
# Encryption Configuration (Tink) - Test Mode
# ==============================================
# Encryption configuration for Docker test environment
# Master key is stored in persistent volume: ezkey-encryption-secrets
# Keyset is stored in database (ezkey_keyset_blob) for distributed synchronization
# Auth API loads keyset from database (synchronized by Admin API after rotation)
# Note: Key rotation and re-encryption jobs run ONLY in Admin API (not in Auth API)
ezkey.encryption.enabled=true
ezkey.encryption.master-key-file=/etc/ezkey/secrets/master.key
ezkey.encryption.keyset-file=/etc/ezkey/keysets/keyset.json.encrypted
ezkey.encryption.algorithm=AES256_GCM

# Keyset Storage Mode: DATABASE for distributed synchronization
ezkey.encryption.keyset.storage-mode=DATABASE
ezkey.encryption.keyset.degraded-mode-enabled=false
ezkey.encryption.keyset.max-reload-retries=1

# ==============================================
# Key Rotation Configuration (DISABLED in Auth API)
# ==============================================
# Rotation and re-encryption jobs run ONLY in Admin API
# Auth API does not have @EnableScheduling, so these jobs will not run even if enabled
# Disabled here for clarity and to avoid confusion
ezkey.encryption.rotation.enabled=false
ezkey.encryption.reencryption.enabled=false

# ==============================================
# Audit Integrity Configuration (Test Mode)
# ==============================================
ezkey.audit.integrity.enabled=true
ezkey.audit.integrity.hmac-key-file=/etc/ezkey/secrets/audit-hmac.key
ezkey.audit.integrity.instance-id=${EZKEY_INSTANCE_ID:test-auth-api}
ezkey.audit.chain.enabled=false

