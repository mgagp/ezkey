# Ezkey Auth API - Docker Configuration
spring.application.name=ezkey-auth-api
server.port=8080

# Database Configuration (will be overridden by environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ezkey-postgres:5432/ezkey_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ezkey}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migration (disabled for API, handled by migration service)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.custom-site-title=Ezkey Authentication API Documentation

# Authentication Attempt Configuration
ezkey.auth-attempt.ttl-seconds=${EZKEY_AUTH_ATTEMPT_TTL_SECONDS:120}

# Logging Configuration
logging.level.org.ezkey=${LOGGING_LEVEL_ORG_EZKEY:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:WARN}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE:WARN}
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}

# Development Tools (disabled in docker)
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Performance optimizations for Docker
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=5

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized