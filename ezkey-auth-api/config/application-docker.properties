# Ezkey Auth API - Docker Configuration
spring.application.name=ezkey-auth-api
server.port=8080

# Database Configuration (from environment variables in docker-compose.yml)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ezkey_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ezkey}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson Datetime Configuration
# spring.jackson.serialization.write-dates-as-timestamps=false (disabled for Spring Boot 4)
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'

# Flyway Migration
spring.flyway.enabled=false

# Actuator Configuration (for health checks)
management.server.port=8085
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.enabled=true
management.endpoint.health.show-details=never
management.health.defaults.enabled=false
management.health.db.enabled=false
management.health.diskspace.enabled=false
management.health.ping.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Operation and tag order come from OpenApiPresentationCustomizer in the generated spec.
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.custom-site-title=Ezkey Auth API Documentation

# Logging Configuration (Production-friendly)
logging.level.org.ezkey=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.data.jpa.repository=WARN
logging.level.org.springframework.boot.autoconfigure.domain=WARN

# Server Configuration
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# Rate Limiting Configuration
ezkey.rate-limit.enabled=true
ezkey.rate-limit.pending.requests=10
ezkey.rate-limit.pending.window-minutes=1
ezkey.rate-limit.pending.key-strategy=enrollment-id
ezkey.rate-limit.respond.requests=1
ezkey.rate-limit.respond.window-minutes=5
ezkey.rate-limit.respond.key-strategy=auth-attempt-id
ezkey.rate-limit.verify.requests=5
ezkey.rate-limit.verify.window-minutes=5
ezkey.rate-limit.verify.key-strategy=client-ip
ezkey.rate-limit.bind.requests=3
ezkey.rate-limit.bind.window-minutes=5
ezkey.rate-limit.bind.key-strategy=client-ip

# Public instance identity (GET /api/v1/public/instance-info; same contract as Admin API)
ezkey.qr.auth-base-url=${EZKEY_QR_AUTH_BASE_URL:}
ezkey.organization.name=Ezkey System
ezkey.organization.description=Ezkey MFA instance for your organization
ezkey.organization.about-url=${EZKEY_ORGANIZATION_ABOUT_URL:}

# Encryption Configuration (Tink) - Enabled for Docker
# Master key is stored in persistent volume: ezkey-encryption-secrets
# Keyset is stored in database (ezkey_keyset_blob) for distributed synchronization
# Auth API loads keyset from database (synchronized by Admin API after rotation)
# Note: Key rotation and re-encryption jobs run ONLY in Admin API (not in Auth API)
ezkey.encryption.enabled=true
# Fail-fast when Tink cannot initialize (SEC-002). Docker/EXP1 always mount master key.
ezkey.encryption.required=true
ezkey.encryption.master-key-file=/etc/ezkey/secrets/master.key
ezkey.encryption.keyset-file=/etc/ezkey/keysets/keyset.json.encrypted
ezkey.encryption.algorithm=AES256_GCM

# Keyset Storage Mode: DATABASE (source of truth)
# Auth API loads keyset from database, synchronized by Admin API
ezkey.encryption.keyset.storage-mode=DATABASE
ezkey.encryption.keyset.degraded-mode-enabled=false
ezkey.encryption.keyset.max-reload-retries=1

# Key Rotation Configuration (DISABLED in Auth API)
# Rotation and re-encryption jobs run ONLY in Admin API
# Auth API does not have @EnableScheduling, so these jobs will not run even if enabled
# Disabled here for clarity and to avoid confusion
ezkey.encryption.rotation.enabled=false
ezkey.encryption.reencryption.enabled=false

# Audit Integrity (HMAC signing for tamper-evidence)
ezkey.audit.integrity.enabled=true
# Fail-fast when HMAC signing cannot activate (SEC-008). Docker/EXP1 always mount HMAC key.
ezkey.audit.integrity.required=true
ezkey.audit.integrity.hmac-key-file=/etc/ezkey/secrets/audit-hmac.key
ezkey.audit.integrity.instance-id=${EZKEY_INSTANCE_ID:auth-api}
# Chain checkpoints run ONLY in Admin API (scheduler disabled here).
# ezkey.audit.chain.window-minutes MUST match Admin API — heartbeat supervision uses AuditChainProperties#getWindowMinutes().
ezkey.audit.chain.enabled=false
ezkey.audit.chain.window-minutes=5
