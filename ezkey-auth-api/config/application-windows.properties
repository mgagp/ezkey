# Ezkey Auth API - Windows Native Development Configuration
# This profile is used for local development on Windows (non-Docker)
#
# Usage: Add to VM options or application.properties:
#   spring.profiles.active=windows
# OR set environment variable:
#   SPRING_PROFILES_ACTIVE=windows
# OR pass as command-line argument:
#   java -jar app.jar --spring.profiles.active=windows

spring.application.name=ezkey-auth-api
server.port=8080

# Database Configuration (local PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/ezkey_db
spring.datasource.username=postgres
spring.datasource.password=ezkey
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson Datetime Configuration
# spring.jackson.serialization.write-dates-as-timestamps=false (disabled for Spring Boot 4)
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'

# Flyway Migration
spring.flyway.enabled=false

# Actuator Configuration (for health checks)
management.server.port=8085
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.custom-site-title=Ezkey Auth API Documentation

# Logging Configuration (Dev-friendly with more details)
logging.level.root=WARN
logging.level.org.ezkey=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.data.jpa.repository=DEBUG
logging.level.org.springframework.boot.autoconfigure.domain=DEBUG

# Development Tools - ENABLED for Windows dev
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Server Configuration
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=5

# Rate Limiting Configuration
# Note: Can be disabled for local testing by setting enabled=false
ezkey.rate-limit.enabled=true
ezkey.rate-limit.pending.requests=100
ezkey.rate-limit.pending.window-minutes=1
ezkey.rate-limit.pending.key-strategy=enrollment-id
ezkey.rate-limit.verify.requests=100
ezkey.rate-limit.verify.window-minutes=5
ezkey.rate-limit.verify.key-strategy=client-ip
ezkey.rate-limit.bind.requests=100
ezkey.rate-limit.bind.window-minutes=5
ezkey.rate-limit.bind.key-strategy=client-ip

# Encryption Configuration (Tink) - Enabled for Windows
# Master key and keyset stored in Windows ProgramData directory
# Run: .\scripts\generate-master-key.ps1 to create the master key
# Keyset is stored in file (local single-instance mode)
ezkey.encryption.enabled=true
ezkey.encryption.master-key-file=C:\ProgramData\ezkey\secrets\master.key
ezkey.encryption.keyset-file=C:\ProgramData\ezkey\keysets\keyset.json.encrypted
ezkey.encryption.algorithm=AES256_GCM

# Keyset Storage Mode: FILE (local single-instance)
# Windows dev uses FILE mode since it's typically single-instance
ezkey.encryption.keyset.storage-mode=FILE
ezkey.encryption.keyset.degraded-mode-enabled=true
ezkey.encryption.keyset.max-reload-retries=3

# Key Rotation Configuration (DISABLED in Auth API)
# Rotation jobs run ONLY in Admin API
ezkey.encryption.rotation.enabled=false
ezkey.encryption.reencryption.enabled=false
