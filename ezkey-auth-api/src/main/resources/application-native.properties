# Ezkey Auth API - Native Configuration
# Optimized for native image compilation with reduced logging and minimal resource usage

spring.application.name=ezkey-auth-api
server.port=8080

# AOT Processing
spring.aot.enabled=true

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/ezkey_db
spring.datasource.username=postgres
spring.datasource.password=ezkey
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration - Native Optimized
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson Datetime Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'

# Flyway Migration
spring.flyway.enabled=false

# OpenAPI/Swagger Configuration - Disabled for Production Native Build
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator Configuration - Enabled for Metrics and Monitoring
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=false
management.endpoints.web.base-path=/actuator

# Logging Configuration - Reduced for Native
logging.level.org.ezkey=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.data.jpa.repository=WARN
logging.level.org.springframework.boot.autoconfigure.domain=WARN

# Development Tools - Disabled for Native
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Tomcat Thread Pool - Minimal for Native
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# Rate Limiting Configuration
ezkey.rate-limit.enabled=true

# Auth Pending - User-initiated polling (permissive for normal usage)
ezkey.rate-limit.pending.requests=10
ezkey.rate-limit.pending.window-minutes=1
ezkey.rate-limit.pending.key-strategy=enrollment-id

# Auth Verify - User responses (restrictive for security)
ezkey.rate-limit.verify.requests=5
ezkey.rate-limit.verify.window-minutes=5
ezkey.rate-limit.verify.key-strategy=client-ip

# Auth Bind - Enrollment binding (very restrictive for enumeration protection)
ezkey.rate-limit.bind.requests=3
ezkey.rate-limit.bind.window-minutes=5
ezkey.rate-limit.bind.key-strategy=client-ip
