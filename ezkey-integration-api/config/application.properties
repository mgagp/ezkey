# Ezkey Integration API Configuration
spring.application.name=ezkey-integration-api
server.port=7080

# Virtual Threads (Java 25 / Spring Boot 4)
# Parks virtual threads during long-poll waits instead of blocking platform threads
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/ezkey_db
spring.datasource.username=postgres
spring.datasource.password=ezkey
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson Datetime Configuration
# spring.jackson.serialization.write-dates-as-timestamps=false (disabled for Spring Boot 4)
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'

# Flyway Migration
spring.flyway.enabled=false

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.custom-site-title=Ezkey Integration API Documentation

# Logging Configuration
logging.level.org.ezkey=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.data.jpa.repository=DEBUG
logging.level.org.springframework.boot.autoconfigure.domain=DEBUG

# Development Tools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ==============================================
# API Key Operations Rate Limiting
# ==============================================
# Rate limiting for API key operations (create auth attempt, wait auth attempt)
# Based on API key identification (integration ID) rather than IP addresses

ezkey.api-key.rate-limit.enabled=true
ezkey.api-key.rate-limit.create-auth-attempt.requests=100
ezkey.api-key.rate-limit.create-auth-attempt.window-minutes=1
ezkey.api-key.rate-limit.wait-auth-attempt.requests=200
ezkey.api-key.rate-limit.wait-auth-attempt.window-minutes=1

# ==============================================
# Trusted Proxy (client IP for audit)
# ==============================================
# When behind a reverse proxy (Caddy, Nginx, Cloudflare), client IP is taken from
# X-Forwarded-For / X-Real-IP / CF-Connecting-IP only if the direct connection is from
# an IP in this list. Prevents spoofing. Empty = use only remote address (no header trust).
# Env: EZKEY_TRUSTED_PROXIES_CIDRS (comma-separated CIDRs). See admin-api application.properties for details.
# ezkey.trusted-proxies[0]=10.0.0.0/8
# ezkey.trusted-proxies[1]=172.16.0.0/12
# ezkey.trusted-proxies[2]=192.168.0.0/16
