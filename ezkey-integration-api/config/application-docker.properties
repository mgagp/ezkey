# Ezkey Integration API - Docker Configuration
spring.application.name=ezkey-integration-api
server.port=7080

# Virtual Threads (Java 25 / Spring Boot 4)
# Parks virtual threads during long-poll waits instead of blocking platform threads
spring.threads.virtual.enabled=true

# Actuator Configuration (production-safe defaults for Docker)
management.server.port=7081
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Database Configuration (from environment variables in docker-compose.yml)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ezkey_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ezkey}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson Datetime Configuration
# spring.jackson.serialization.write-dates-as-timestamps=false (disabled for Spring Boot 4)
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'

# Flyway Migration
spring.flyway.enabled=false

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
# Path order comes from OpenApiPresentationCustomizer in the generated spec.
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.custom-site-title=Ezkey Integration API Documentation

# Logging Configuration (Production-friendly)
logging.level.org.ezkey=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.data.jpa.repository=WARN
logging.level.org.springframework.boot.autoconfigure.domain=WARN

# ==============================================
# API Key Operations Rate Limiting
# ==============================================
# Rate limiting for API key operations (create auth attempt, wait auth attempt)
# Based on API key identification (integration ID) rather than IP addresses

ezkey.api-key.rate-limit.enabled=true
ezkey.api-key.rate-limit.create-auth-attempt.requests=100
ezkey.api-key.rate-limit.create-auth-attempt.window-minutes=1
ezkey.api-key.rate-limit.wait-auth-attempt.requests=200
ezkey.api-key.rate-limit.wait-auth-attempt.window-minutes=1

# ==============================================
# Encryption Configuration (Tink) - Enabled for Docker
# ==============================================
# Master key is stored in persistent volume: encryption-secrets -> /etc/ezkey/secrets/master.key
# Keyset is stored in database (ezkey_keyset_blob) for distributed synchronization
# Integration API loads keyset from database (synchronized by Admin API after rotation)
# Note: Key rotation and re-encryption jobs run ONLY in Admin API (not in Integration API)
ezkey.encryption.enabled=true
# Fail-fast when Tink cannot initialize (SEC-002). Docker/EXP1 always mount master key.
ezkey.encryption.required=true
ezkey.encryption.master-key-file=/etc/ezkey/secrets/master.key
ezkey.encryption.keyset-file=/etc/ezkey/keysets/keyset.json.encrypted
ezkey.encryption.algorithm=AES256_GCM

# Keyset Storage Mode: DATABASE (source of truth)
# Integration API loads keyset from database, synchronized by Admin API
ezkey.encryption.keyset.storage-mode=DATABASE
ezkey.encryption.keyset.degraded-mode-enabled=false
ezkey.encryption.keyset.max-reload-retries=1

# Key Rotation Configuration (DISABLED in Integration API)
# Rotation and re-encryption jobs run ONLY in Admin API
ezkey.encryption.rotation.enabled=false
ezkey.encryption.reencryption.enabled=false

# Audit Integrity (HMAC signing for tamper-evidence)
ezkey.audit.integrity.enabled=true
# Fail-fast when HMAC signing cannot activate (SEC-008). Docker/EXP1 always mount HMAC key.
ezkey.audit.integrity.required=true
ezkey.audit.integrity.hmac-key-file=/etc/ezkey/secrets/audit-hmac.key
ezkey.audit.integrity.instance-id=${EZKEY_INSTANCE_ID:integration-api}
# Chain checkpoints run ONLY in Admin API (scheduler disabled here).
# ezkey.audit.chain.window-minutes MUST match Admin API — heartbeat supervision uses AuditChainProperties#getWindowMinutes().
ezkey.audit.chain.enabled=false
ezkey.audit.chain.window-minutes=5
