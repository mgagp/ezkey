# Ezkey Integration API - Docker Test Mode Configuration
# This profile extends docker profile with permissive API-key rate limiting for unrestricted testing.
# Peripheral heartbeat supervision keeps docker defaults — NOT relaxed here (fail-closed when checkpoints stall).
# Usage: SPRING_PROFILES_ACTIVE=docker,docker-test (e.g. via clean-start.sh)

# ==============================================
# Rate Limiting Configuration (Test Mode - Permissive)
# ==============================================
# Disable rate limiting so tests can run in any order and frequency without rate limit constraints

ezkey.api-key.rate-limit.enabled=false

# Match Admin API docker-test window sizing (chain scheduler remains disabled via docker profile inheritance).
ezkey.audit.chain.window-minutes=5

# docker-test relaxes API-key rate limits only — peripheral heartbeat supervision matches docker defaults
# (AuditChainHeartbeatProperties: enabled=true, required=true); POST /api/v1/auth-attempts fail-closes when checkpoints stall.
