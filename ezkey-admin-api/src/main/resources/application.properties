# Ezkey Admin API Configuration
spring.application.name=ezkey-admin-api
server.port=9080

# Database Configuration (shared with core)
spring.datasource.url=jdbc:h2:file:~/ezkey_db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (for development/testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# JPA Configuration
#spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway Migration
#spring.flyway.enabled=true
#spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=false

# OpenAPI/Swagger Configuration
#springdoc.api-docs.path=/api-docs
#springdoc.swagger-ui.path=/swagger-ui.html
#springdoc.swagger-ui.operationsSorter=method
#springdoc.swagger-ui.tagsSorter=alpha
#springdoc.swagger-ui.doc-expansion=none

# Logging Configuration
logging.level.org.ezkey=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.level.org.springframework.data.jpa.repository=DEBUG
logging.level.org.springframework.boot.autoconfigure.domain=DEBUG

# Development Tools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true 

server.tomcat.threads.max=2
server.tomcat.threads.min-spare=2

ezkey.simulation.mode=true
