# Audit Logging Configuration

# Days to retain audit logs (default: 90 for SOC2 compliance)
ezkey.audit.retention-days=90

# Enable/disable automated cleanup (default: true)
ezkey.audit.cleanup.enabled=true

# Cleanup schedule cron expression (default: daily at 2 AM)
ezkey.audit.cleanup.cron=0 0 2 * * ?
