# Ezkey Admin API - Native Configuration
# Optimized for native image compilation with reduced logging and minimal resource usage

spring.application.name=ezkey-admin-api
server.port=9080

# AOT Processing
spring.aot.enabled=true

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/ezkey_db
spring.datasource.username=postgres
spring.datasource.password=ezkey
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration - Native Optimized
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson Datetime Configuration
# # spring.jackson.serialization.write-dates-as-timestamps=false (disabled for Spring Boot 4)
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'

# Flyway Migration
spring.flyway.enabled=false

# OpenAPI/Swagger Configuration - Disabled for Production Native Build
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator Configuration - Health only by default
management.server.port=9081
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Logging Configuration - Reduced for Native
logging.level.org.ezkey=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.data.jpa.repository=WARN
logging.level.org.springframework.boot.autoconfigure.domain=WARN

# Tomcat Thread Pool - Minimal for Native
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# Admin API Rate Limiting Configuration
ezkey.admin.rate-limit.enabled=true
ezkey.admin.rate-limit.login.requests=5
ezkey.admin.rate-limit.login.window-minutes=1
ezkey.admin.rate-limit.login.key-strategy=client-ip
ezkey.admin.rate-limit.login.block-after-failures=10
ezkey.admin.rate-limit.login.block-duration-minutes=30

# Recovery Codes Configuration
ezkey.admin.recovery.codes-count=5
ezkey.admin.recovery.temp-token-duration-minutes=30
ezkey.admin.rate-limit.recovery.requests=3
ezkey.admin.rate-limit.recovery.window-minutes=15

# API Key Configuration
ezkey.admin.api-key.max-active-per-integration=5

# API Key Operations Rate Limiting
ezkey.api-key.rate-limit.enabled=true
ezkey.api-key.rate-limit.create-auth-attempt.requests=10
ezkey.api-key.rate-limit.create-auth-attempt.window-minutes=1
ezkey.api-key.rate-limit.wait-auth-attempt.requests=20
ezkey.api-key.rate-limit.wait-auth-attempt.window-minutes=1

# Admin Operations Rate Limiting
ezkey.admin-operations.rate-limit.enabled=true
ezkey.admin-operations.rate-limit.api-key-create.requests=5
ezkey.admin-operations.rate-limit.api-key-create.window-minutes=15
ezkey.admin-operations.rate-limit.api-key-revoke.requests=10
ezkey.admin-operations.rate-limit.api-key-revoke.window-minutes=15
ezkey.admin-operations.rate-limit.api-key-update.requests=20
ezkey.admin-operations.rate-limit.api-key-update.window-minutes=15
ezkey.admin-operations.rate-limit.enrollment-reset.requests=3
ezkey.admin-operations.rate-limit.enrollment-reset.window-minutes=30

# Organization Configuration
ezkey.organization.name=Ezkey System
ezkey.organization.description=Ezkey MFA instance for your organization

# Initial Global Admin Configuration
ezkey.admin.initial.username=john.doe.admin
ezkey.admin.initial.email=john.doe@example.com
ezkey.admin.initial.first-name=John
ezkey.admin.initial.last-name=Doe

# Token Cleanup & Rotation Configuration
ezkey.admin.token.cleanup.enabled=true
ezkey.admin.token.cleanup.schedule=0 0 * * * *
ezkey.admin.token.rotation-on-login=true
ezkey.admin.token.expiration-hours=2

# Admin MFA Bootstrap Configuration
ezkey.admin.mfa.bootstrap.enabled=true
ezkey.admin.mfa.mode=prod
ezkey.admin.mfa.bootstrap.auto-enrollment=true
ezkey.admin.mfa.bootstrap.credentials-output-mode=full

# Passwordless Authentication Configuration
ezkey.admin.auth.passwordless.enabled=true
ezkey.admin.auth.passwordless.mode=opt-in
ezkey.admin.auth.passwordless.wait-timeout=300
ezkey.admin.auth.passwordless.polling-interval=2
ezkey.admin.auth.challenge.mode=optional

# Audit Logging Configuration
ezkey.audit.archive.auto-seal.enabled=true
ezkey.audit.archive.external-archival-enabled=false
ezkey.audit.archive.retention-period=P90D
ezkey.audit.archive.seal-delay=P0D
ezkey.audit.archive.purge-delay=P30D
ezkey.audit.archive.purge.enabled=true
ezkey.audit.archive.purge.cron=0 0 2 * * ?

# Audit Integrity (disabled in native/test -- no HMAC key file)
ezkey.audit.integrity.enabled=false
ezkey.audit.chain.enabled=false
ezkey.audit.integrity.nightly.enabled=false

# Encryption Configuration (Tink)
ezkey.encryption.enabled=true
ezkey.encryption.algorithm=AES256_GCM
ezkey.encryption.rotation.enabled=true
ezkey.encryption.rotation.schedule=0 0 2 * * ?
ezkey.encryption.rotation.max-key-age-days=90
ezkey.encryption.rotation.backup-before-rotation=true
ezkey.encryption.keyset.storage-mode=FILE
ezkey.encryption.keyset.degraded-mode-enabled=false
ezkey.encryption.keyset.max-reload-retries=1
ezkey.encryption.reencryption.enabled=true
ezkey.encryption.reencryption.schedule=0 */10 * * * ?
ezkey.encryption.reencryption.batch-size=500
ezkey.encryption.reencryption.throttle-ms=10
ezkey.encryption.reencryption.max-batches-per-run=100
ezkey.encryption.reencryption.max-duration-minutes=180
ezkey.encryption.reencryption.auto-retry-failed=true
ezkey.encryption.reencryption.parallel-batch-workers=2
ezkey.encryption.reencryption.auth-attempt-shard-count=1
