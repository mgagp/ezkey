# Ezkey Admin API - Docker Configuration
spring.application.name=ezkey-admin-api
server.port=9080

# Actuator Configuration (production-safe defaults for Docker)
management.server.port=9081
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Database Configuration (from environment variables in docker-compose.yml)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ezkey_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ezkey}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson Datetime Configuration
# spring.jackson.serialization.write-dates-as-timestamps=false (disabled for Spring Boot 4)
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'

# Flyway Migration
spring.flyway.enabled=false

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.custom-site-title=Ezkey Admin API Documentation

# Logging Configuration (Production-friendly)
logging.level.org.ezkey=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.data.jpa.repository=WARN
logging.level.org.springframework.boot.autoconfigure.domain=WARN

# Development Tools - DISABLED for Docker (prevent restart loops)
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Server Configuration
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=10

# Admin API Rate Limiting Configuration
ezkey.admin.rate-limit.enabled=true
ezkey.admin.rate-limit.login.requests=5
ezkey.admin.rate-limit.login.window-minutes=1
ezkey.admin.rate-limit.login.key-strategy=client-ip
ezkey.admin.rate-limit.login.block-after-failures=10
ezkey.admin.rate-limit.login.block-duration-minutes=30

# Recovery Codes Configuration
ezkey.admin.recovery.codes-count=5
ezkey.admin.recovery.temp-token-duration-minutes=30
ezkey.admin.rate-limit.recovery.requests=3
ezkey.admin.rate-limit.recovery.window-minutes=15

# UNUSED: ezkey.admin.rate-limit.api-key.* is NOT implemented (no filter/service reads it).
# See API_KEY_RATE_LIMIT_NOTE.md. API key usage is rate-limited via ezkey.api-key.rate-limit.*
# and admin operations (create/revoke/update) via ezkey.admin-operations.rate-limit.*
# ezkey.admin.rate-limit.api-key.enabled=false
# ezkey.admin.rate-limit.api-key.requests=5
# ezkey.admin.rate-limit.api-key.window-minutes=1
# ezkey.admin.rate-limit.api-key.key-strategy=integration-key
ezkey.admin.api-key.max-active-per-integration=5

# API Key Operations Rate Limiting
ezkey.api-key.rate-limit.enabled=true
ezkey.api-key.rate-limit.create-auth-attempt.requests=10
ezkey.api-key.rate-limit.create-auth-attempt.window-minutes=1
ezkey.api-key.rate-limit.wait-auth-attempt.requests=20
ezkey.api-key.rate-limit.wait-auth-attempt.window-minutes=1

# Admin Operations Rate Limiting
ezkey.admin-operations.rate-limit.enabled=true
ezkey.admin-operations.rate-limit.api-key-create.requests=5
ezkey.admin-operations.rate-limit.api-key-create.window-minutes=15
ezkey.admin-operations.rate-limit.api-key-revoke.requests=10
ezkey.admin-operations.rate-limit.api-key-revoke.window-minutes=15
ezkey.admin-operations.rate-limit.api-key-update.requests=20
ezkey.admin-operations.rate-limit.api-key-update.window-minutes=15
ezkey.admin-operations.rate-limit.enrollment-reset.requests=3
ezkey.admin-operations.rate-limit.enrollment-reset.window-minutes=30

# Organization Configuration
ezkey.organization.name=Ezkey System
ezkey.organization.description=Ezkey MFA instance for your organization
ezkey.organization.about-url=${EZKEY_ORGANIZATION_ABOUT_URL:}

# Initial Global Admin Configuration (REQUIRED for SOC 2 Compliance)
# These properties MUST be set for the application to start
ezkey.admin.initial.username=${EZKEY_ADMIN_INITIAL_USERNAME:admin.docker}
ezkey.admin.initial.email=${EZKEY_ADMIN_INITIAL_EMAIL:admin@ezkey.local}
ezkey.admin.initial.first-name=${EZKEY_ADMIN_INITIAL_FIRST_NAME:Admin}
ezkey.admin.initial.last-name=${EZKEY_ADMIN_INITIAL_LAST_NAME:Docker}

# Token Cleanup & Rotation Configuration
ezkey.admin.token.cleanup.enabled=true
ezkey.admin.token.cleanup.schedule=0 0 * * * *
ezkey.admin.token.rotation-on-login=true
ezkey.admin.token.expiration-hours=2

# Admin MFA Bootstrap Configuration
ezkey.admin.mfa.bootstrap.enabled=true
ezkey.admin.mfa.mode=prod
ezkey.admin.mfa.bootstrap.auto-enrollment=true
# full = enrollment secrets + ASCII QR in logs + optional JSON export (clean-start default).
# recovery_primary = recovery codes + instructions only; skips enrollment secrets in logs and skips JSON export.
ezkey.admin.mfa.bootstrap.credentials-output-mode=${EZKEY_ADMIN_MFA_BOOTSTRAP_CREDENTIALS_OUTPUT_MODE:full}

# Bootstrap Credentials File Export (Docker-only)
# Exports enrollmentId/proofToken/challenge to file for Docker automation
# Recovery codes are NOT exported (logs only)
ezkey.admin.bootstrap.export.enabled=true
ezkey.admin.bootstrap.export.path=/var/lib/ezkey/bootstrap/bootstrap-credentials.json

# QR Code Configuration (Docker)
# Set this to the PUBLIC-FACING auth-api URL reachable from mobile devices.
# Do NOT use internal Docker network URLs (e.g., http://auth-api:8080).
# Maps to EZKEY_QR_AUTH_BASE_URL from docker-compose when set.
ezkey.qr.auth-base-url=${EZKEY_QR_AUTH_BASE_URL:}

# Passwordless Authentication Configuration
ezkey.admin.auth.passwordless.enabled=true
ezkey.admin.auth.passwordless.mode=opt-in
ezkey.admin.auth.passwordless.wait-timeout=300
ezkey.admin.auth.passwordless.polling-interval=2
ezkey.admin.auth.challenge.mode=optional

# Audit Logging Configuration
ezkey.audit.retention-days=90
ezkey.audit.cleanup.enabled=true
ezkey.audit.cleanup.cron=0 0 2 * * ?

# Audit Integrity (HMAC signing for tamper-evidence)
ezkey.audit.integrity.enabled=true
ezkey.audit.integrity.hmac-key-file=/etc/ezkey/secrets/audit-hmac.key
ezkey.audit.integrity.instance-id=${EZKEY_INSTANCE_ID:admin-api}
ezkey.audit.chain.enabled=true
ezkey.audit.chain.window-minutes=5
ezkey.audit.chain.lookback-minutes=60
ezkey.audit.chain.cron=0 */5 * * * ?

# Encryption Configuration (Tink) - Enabled for Docker
# Master key is stored in persistent volume: ezkey-encryption-secrets
# Keyset is stored in database (ezkey_keyset_blob) for distributed synchronization
# File-based keyset serves as local cache/backup
ezkey.encryption.enabled=true
ezkey.encryption.master-key-file=/etc/ezkey/secrets/master.key
ezkey.encryption.keyset-file=/etc/ezkey/keysets/keyset.json.encrypted
ezkey.encryption.algorithm=AES256_GCM

# Keyset Storage Mode: DATABASE (source of truth), FILE (local cache)
# DATABASE mode enables distributed synchronization across instances
ezkey.encryption.keyset.storage-mode=DATABASE
ezkey.encryption.keyset.degraded-mode-enabled=false

# Key Rotation Configuration
ezkey.encryption.rotation.enabled=true
ezkey.encryption.rotation.schedule=0 0 2 * * ?
ezkey.encryption.rotation.max-key-age-days=90
ezkey.encryption.rotation.backup-before-rotation=true
# Synchronization window before PENDING key becomes PRIMARY (seconds)
ezkey.encryption.rotation.sync-window-seconds=30
# Interval between checks for PENDING keys ready for promotion (seconds)
ezkey.encryption.rotation.promotion-check-interval-seconds=5
