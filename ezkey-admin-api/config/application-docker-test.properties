# Ezkey Admin API - Docker Test Mode Configuration
# This profile extends docker profile with permissive rate limiting for unrestricted testing
# Usage: SPRING_PROFILES_ACTIVE=docker,docker-test

# ==============================================
# Rate Limiting Configuration (Test Mode - Permissive)
# ==============================================
# Disable rate limiting entirely for unrestricted testing
# This allows tests to run in any order and frequency without rate limit constraints

# Admin API Rate Limiting
ezkey.admin.rate-limit.enabled=false

# API Key Rate Limiting
ezkey.admin.rate-limit.api-key.enabled=false

# API Key Operations Rate Limiting
ezkey.api-key.rate-limit.enabled=false

# Admin Operations Rate Limiting
ezkey.admin-operations.rate-limit.enabled=false

# Recovery Codes Rate Limiting (keep enabled for security, but with higher limits)
# ezkey.admin.rate-limit.recovery.requests=100
# ezkey.admin.rate-limit.recovery.window-minutes=15

# ==============================================
# Encryption Configuration (Tink) - Test Mode
# ==============================================
# Encryption configuration for Docker test environment
# Master key is stored in persistent volume: ezkey-encryption-secrets
# Keyset is stored in database (ezkey_keyset_blob) for distributed synchronization
ezkey.encryption.enabled=true
ezkey.encryption.master-key-file=/etc/ezkey/secrets/master.key
ezkey.encryption.keyset-file=/etc/ezkey/keysets/keyset.json.encrypted
ezkey.encryption.algorithm=AES256_GCM

# Keyset Storage Mode: DATABASE for distributed synchronization
ezkey.encryption.keyset.storage-mode=DATABASE
ezkey.encryption.keyset.degraded-mode-enabled=false
ezkey.encryption.keyset.max-reload-retries=1

# ==============================================
# Key Rotation Configuration (Test Mode - Frequent)
# ==============================================
# Rotation enabled with frequent schedule for testing
# Schedule: Every 5 minutes for rapid testing
# Max key age: 1 day for quick rotation testing
ezkey.encryption.rotation.enabled=true
# Schedule: Every 5 minutes
ezkey.encryption.rotation.schedule=0 */5 * * * ?
# Max key age: 1 day
ezkey.encryption.rotation.max-key-age-days=1
ezkey.encryption.rotation.backup-before-rotation=true
ezkey.encryption.rotation.backup-retention-days=7
ezkey.encryption.rotation.min-keys-in-keyset=2
ezkey.encryption.rotation.max-keys-in-keyset=5
ezkey.encryption.rotation.auto-disable-days=3
# Sync window for PENDING keys (shorter for testing)
ezkey.encryption.rotation.sync-window-seconds=10
# Promotion check interval (frequent for testing)
ezkey.encryption.rotation.promotion-check-interval-seconds=2

# ==============================================
# Re-encryption Configuration (Test Mode - Frequent)
# ==============================================
# Re-encryption enabled with frequent schedule and small batches for testing
# Schedule: Every 10 minutes after rotation for rapid testing
# Small batch size for faster completion in test environment
ezkey.encryption.reencryption.enabled=true
# Schedule: Every 10 minutes
ezkey.encryption.reencryption.schedule=0 */10 * * * ?
# Small batch size for faster completion
ezkey.encryption.reencryption.batch-size=500
ezkey.encryption.reencryption.throttle-ms=10
ezkey.encryption.reencryption.max-batches-per-run=100
ezkey.encryption.reencryption.max-duration-minutes=180
ezkey.encryption.reencryption.auto-retry-failed=true
ezkey.encryption.reencryption.parallel-batch-workers=2
ezkey.encryption.reencryption.auth-attempt-shard-count=1

# ==============================================
# Audit Integrity Configuration (Test Mode)
# ==============================================
# HMAC signing enabled for integration tests
# Key file is generated by test setup or mounted in Docker volume
ezkey.audit.integrity.enabled=true
ezkey.audit.integrity.hmac-key-file=/etc/ezkey/secrets/audit-hmac.key
ezkey.audit.integrity.instance-id=${EZKEY_INSTANCE_ID:test-admin-api}
ezkey.audit.chain.enabled=true
ezkey.audit.chain.window-minutes=1
ezkey.audit.chain.lookback-minutes=10
ezkey.audit.chain.cron=0 * * * * ?

# Alternative: If you prefer to keep rate limiting enabled but with very high limits:
