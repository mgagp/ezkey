# Ezkey Admin API Configuration
spring.application.name=ezkey-admin-api
server.port=9080

spring.datasource.url=jdbc:postgresql://localhost:5432/ezkey_db
spring.datasource.username=postgres
spring.datasource.password=ezkey
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson Datetime Configuration
# Serialize all OffsetDateTime to UTC with Z suffix for consistent API responses
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'

# Flyway Migration
spring.flyway.enabled=false

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.custom-site-title=Ezkey Admin API Documentation

# Logging Configuration
logging.level.org.ezkey=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.level.org.springframework.data.jpa.repository=DEBUG
logging.level.org.springframework.boot.autoconfigure.domain=DEBUG

# Development Tools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true 

server.tomcat.threads.max=300
server.tomcat.threads.min-spare=10

# Admin API Rate Limiting Configuration
# Protection against brute force attacks on login endpoint
ezkey.admin.rate-limit.enabled=true

# Login endpoint rate limiting
ezkey.admin.rate-limit.login.requests=5
ezkey.admin.rate-limit.login.window-minutes=1
ezkey.admin.rate-limit.login.key-strategy=client-ip

# IP blocking after repeated failures
ezkey.admin.rate-limit.login.block-after-failures=10
ezkey.admin.rate-limit.login.block-duration-minutes=30

# ==============================================
# Recovery Codes Configuration (Paranoia-Level)
# ==============================================
# Recovery codes for emergency access when device is lost
# Format: XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX (32 digits, 106-bit entropy)
# Security: 10^32 combinations = 3 × 10^18 years at 1M attempts/sec
ezkey.admin.recovery.codes-count=10
ezkey.admin.recovery.temp-token-duration-minutes=30

# Recovery code rate limiting (prevent brute force)
ezkey.admin.rate-limit.recovery.requests=3
ezkey.admin.rate-limit.recovery.window-minutes=15

# ==============================================
# API Key Rate Limiting Configuration
# ==============================================
# Rate limiting for machine-to-machine (M2M) API key authentication
# Higher limits than human login since M2M systems make more frequent requests
#
# ⚠️  IMPORTANT: This configuration is currently NOT IMPLEMENTED in the codebase.
# 
# The properties below are defined but NO filter/service uses them:
# - AdminRateLimitProperties has only LoginConfig (no ApiKeyConfig)
# - AdminRateLimitFilter only checks login endpoint
# - No filter applies rate limiting to API key authentication requests
#
# What IS rate limited:
# - API key operations (create-auth-attempt, wait-auth-attempt) via RateLimitService
#   → Uses ezkey.api-key.rate-limit.* (different prefix!)
# - Admin operations (API key creation) via AdminOperationsRateLimitService
#   → Uses ezkey.admin-operations.rate-limit.api-key-create.*
#
# Mode docker-test: This configuration is disabled in application-docker-test.properties
#   → Even if implemented, it would be disabled in test mode
#
# TODO: Implement ApiKeyAuthenticationRateLimitFilter if needed, or remove this configuration.

# API Key authentication rate limiting (DISABLED - not implemented)
ezkey.admin.rate-limit.api-key.enabled=false
ezkey.admin.rate-limit.api-key.requests=5
ezkey.admin.rate-limit.api-key.window-minutes=1
ezkey.admin.rate-limit.api-key.key-strategy=integration-key

# Maximum active API keys per integration (rotation support)
ezkey.admin.api-key.max-active-per-integration=5

# ==============================================
# API Key Operations Rate Limiting
# ==============================================
# Rate limiting for API key operations (create auth attempt, wait auth attempt)
# Based on API key identification rather than IP addresses

# API Key operations rate limiting
ezkey.api-key.rate-limit.enabled=true
ezkey.api-key.rate-limit.create-auth-attempt.requests=10
ezkey.api-key.rate-limit.create-auth-attempt.window-minutes=1
ezkey.api-key.rate-limit.wait-auth-attempt.requests=20
ezkey.api-key.rate-limit.wait-auth-attempt.window-minutes=1

# ==============================================
# Admin Operations Rate Limiting
# ==============================================
# Rate limiting for admin-authenticated operations (API key creation, enrollment reset)
# Based on admin identification for high-value operations

# Admin operations rate limiting
ezkey.admin-operations.rate-limit.enabled=true
ezkey.admin-operations.rate-limit.api-key-create.requests=5
ezkey.admin-operations.rate-limit.api-key-create.window-minutes=15
ezkey.admin-operations.rate-limit.enrollment-reset.requests=3
ezkey.admin-operations.rate-limit.enrollment-reset.window-minutes=30

# Organization Configuration
# Customizes the system tenant representing the organization hosting this Ezkey instance
ezkey.organization.name=Ezkey System
ezkey.organization.description=Default system tenant for global administrators

# ==============================================
# Initial Global Admin Configuration (SOC 2 Compliance)
# ==============================================
# Configuration for the initial global administrator
# REQUIRED for SOC 2 compliance: username must identify a specific individual (not generic)
# REQUIRED for SOC 2 compliance: email is required for audit trail (CC6.1, CC7.2)

# Initial global admin username (REQUIRED - must identify a specific individual)
# Examples: "john.doe", "jane.smith", "admin.john"
# INVALID: "admin", "administrator", "root" (generic identifiers)
ezkey.admin.initial.username=john.doe.admin

# Initial global admin email (REQUIRED for SOC 2 compliance)
# Must be a valid email address and unique
ezkey.admin.initial.email=john.doe@example.com

# Initial global admin first name (REQUIRED for SOC 2 compliance CC6.1, CC7.2)
# Used for audit trail and identification
ezkey.admin.initial.first-name=John

# Initial global admin last name (REQUIRED for SOC 2 compliance CC6.1, CC7.2)
# Used for audit trail and identification
ezkey.admin.initial.last-name=Doe

# ==============================================
# Token Cleanup & Rotation Configuration
# ==============================================

# Automatic cleanup of expired tokens
# Removes expired AND inactive tokens from database periodically
ezkey.admin.token.cleanup.enabled=true
ezkey.admin.token.cleanup.schedule=0 0 * * * *

# Token rotation on login
# Deactivates all existing active tokens when administrator logs in
# Ensures only one active token per administrator at any time
ezkey.admin.token.rotation-on-login=true

# ==============================================
# Password Policy Configuration
# ==============================================

# Password strength requirements enforced by PasswordValidator utility
# Minimum length: 12 characters
# Required character types: uppercase, lowercase, digit, special character
# Special characters allowed: !@#$%^&*()_+-=[]{}|;:,.<>?
# Maximum length: 128 characters (DoS protection)

# When password change is required, admin cannot login until password is changed
# Password change invalidates all existing tokens (forced rotation)

# ==============================================
# Admin MFA Bootstrap Configuration
# ==============================================

# Enable or disable admin MFA infrastructure bootstrap
# When enabled, automatically creates Integration Zero and Enrollment Zero at startup
# This implements the "Eat Your Own Dog Food" principle where Ezkey uses its own MFA
ezkey.admin.mfa.bootstrap.enabled=true

# MFA enforcement mode: dev (optional) or prod (required)
# dev: Administrators can choose whether to use MFA (suitable for development)
# prod: MFA is required for all administrators (recommended for production)
ezkey.admin.mfa.mode=prod

# Auto-create Enrollment Zero for admin global
# When enabled, automatically creates an enrollment for admin at startup
# Development: true (convenient for testing)
# Production: false (manual enrollment for security)
ezkey.admin.mfa.bootstrap.auto-enrollment=true

# ==============================================
# Passwordless Authentication Configuration
# ==============================================

# Enable passwordless authentication feature globally
# When enabled, administrators can authenticate using Ezkey cryptographic authentication
# without requiring passwords. This implements "Eat Your Own Dogfood" principle.
# Disabled: Passwordless not available (password-only authentication)
# Enabled: Passwordless available for admins with passwordless_enabled=true
ezkey.admin.auth.passwordless.enabled=true

# Passwordless enforcement mode: opt-in (default) or enforced
# opt-in: Administrators choose whether to enable passwordless (backward compatible)
# enforced: All admins must use passwordless (requires bound enrollment, breaking change)
ezkey.admin.auth.passwordless.mode=opt-in

# Wait timeout for passwordless authentication device response
# Maximum time in seconds to wait for device approval during passwordless login
# Recommended: 300 seconds (5 minutes) - gives user time to unlock device
ezkey.admin.auth.passwordless.wait-timeout=300

# Polling interval for device response check
# How often to check for device response during passwordless authentication
# Recommended: 2 seconds - balance between responsiveness and database load
ezkey.admin.auth.passwordless.polling-interval=2

# Challenge verification policy for passwordless authentication
# optional: Challenge code is optional (default)
# required: Challenge code is always required (enhanced security)
# disabled: Challenge code never used (faster but less secure)
ezkey.admin.auth.challenge.mode=optional

# ==============================================
# Audit Logging Configuration
# ==============================================

# Days to retain audit logs (default: 90 for SOC2 compliance)
ezkey.audit.retention-days=90

# Enable/disable automated cleanup (default: true)
ezkey.audit.cleanup.enabled=true

# Cleanup schedule cron expression (default: daily at 2 AM)
ezkey.audit.cleanup.cron=0 0 2 * * ?

# ==============================================
# Encryption Configuration (Tink)
# ==============================================
# Enable/disable encryption at rest
# If disabled, data will be stored in plaintext (backward compatible mode)
# If enabled but master key missing, encryption will be disabled with warning
ezkey.encryption.enabled=true

# Master key file path (Base64-encoded 256-bit key)
# Generate master key: sudo ./scripts/generate-master-key.sh (Linux/Mac)
#                      .\scripts\generate-master-key.ps1 (Windows as Administrator)
##ezkey.encryption.master-key-file=/etc/ezkey/secrets/master.key

# Keyset file path (encrypted with master key)
##ezkey.encryption.keyset-file=/etc/ezkey/keysets/keyset.json.encrypted

# Encryption algorithm: AES256_GCM or CHACHA20_POLY1305
ezkey.encryption.algorithm=AES256_GCM

# Key rotation configuration
ezkey.encryption.rotation.enabled=true
ezkey.encryption.rotation.schedule=0 0 2 * * ?
ezkey.encryption.rotation.max-key-age-days=90
ezkey.encryption.rotation.backup-before-rotation=true

### ==============================================
#ezkey.encryption.master-key-file=C:\\ProgramData\\ezkey\\secrets\\master.key
#ezkey.encryption.keyset-file=C:\\ProgramData\\ezkey\\keysets\\keyset.json.encrypted
ezkey.encryption.master-key-file=/c/ProgramData/ezkey/secrets/master.key
ezkey.encryption.keyset-file=/c/ProgramData/ezkey/keysets/keyset.json.encrypted
### ==============================================

# ==============================================
# Encryption Keyset Storage Configuration
# ==============================================
# Storage mode: FILE (local only), DATABASE (distributed), HYBRID (both)
# FILE: Simpler for local dev, single instance
# DATABASE: Required for distributed deployments (multiple instances)
# HYBRID: Database as source of truth, file as local cache
#
# For local development (single instance), FILE mode is recommended
# For Docker/cloud deployments, DATABASE mode is recommended
ezkey.encryption.keyset.storage-mode=FILE
ezkey.encryption.keyset.degraded-mode-enabled=false
ezkey.encryption.keyset.max-reload-retries=1

# ==============================================
# Encryption Key Rotation Configuration
# ==============================================

# Automatic key rotation
ezkey.encryption.rotation.enabled=true
ezkey.encryption.rotation.schedule=0 */5 * * * ?
ezkey.encryption.rotation.max-key-age-days=1
ezkey.encryption.rotation.backup-before-rotation=true
ezkey.encryption.rotation.backup-retention-days=7
ezkey.encryption.rotation.min-keys-in-keyset=2
ezkey.encryption.rotation.max-keys-in-keyset=5
ezkey.encryption.rotation.auto-disable-days=3
# Sync window before PENDING key becomes PRIMARY (seconds)
# For local dev with single instance, can be shorter
ezkey.encryption.rotation.sync-window-seconds=5
# Promotion check interval (seconds)
ezkey.encryption.rotation.promotion-check-interval-seconds=2

# Automatic re-encryption of existing data with new keys
ezkey.encryption.reencryption.enabled=true
ezkey.encryption.reencryption.schedule=0 */10 * * * ?
ezkey.encryption.reencryption.batch-size=10
ezkey.encryption.reencryption.throttle-ms=50
ezkey.encryption.reencryption.max-batches-per-run=5
ezkey.encryption.reencryption.max-duration-minutes=10
ezkey.encryption.reencryption.auto-retry-failed=true

