# Ezkey Admin API Configuration
spring.application.name=ezkey-admin-api
server.port=9080

spring.datasource.url=jdbc:postgresql://localhost:5432/ezkey_db
spring.datasource.username=postgres
spring.datasource.password=ezkey
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson Datetime Configuration
# Serialize all OffsetDateTime to UTC with Z suffix for consistent API responses
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'

# Flyway Migration
spring.flyway.enabled=false

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.custom-site-title=Ezkey Admin API Documentation

# Logging Configuration
logging.level.org.ezkey=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.level.org.springframework.data.jpa.repository=DEBUG
logging.level.org.springframework.boot.autoconfigure.domain=DEBUG

# Development Tools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true 

server.tomcat.threads.max=300
server.tomcat.threads.min-spare=10

# Admin API Rate Limiting Configuration
# Protection against brute force attacks on login endpoint
ezkey.admin.rate-limit.enabled=true

# Login endpoint rate limiting
ezkey.admin.rate-limit.login.requests=5
ezkey.admin.rate-limit.login.window-minutes=1
ezkey.admin.rate-limit.login.key-strategy=client-ip

# IP blocking after repeated failures
ezkey.admin.rate-limit.login.block-after-failures=10
ezkey.admin.rate-limit.login.block-duration-minutes=30

# ==============================================
# Recovery Codes Configuration (Paranoia-Level)
# ==============================================
# Recovery codes for emergency access when device is lost
# Format: XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX (32 digits, 106-bit entropy)
# Security: 10^32 combinations = 3 × 10^18 years at 1M attempts/sec
ezkey.admin.recovery.codes-count=10
ezkey.admin.recovery.temp-token-duration-minutes=30

# Recovery code rate limiting (prevent brute force)
ezkey.admin.rate-limit.recovery.requests=3
ezkey.admin.rate-limit.recovery.window-minutes=15

# Organization Configuration
# Customizes the system tenant representing the organization hosting this Ezkey instance
ezkey.organization.name=Ezkey System
ezkey.organization.description=Default system tenant for global administrators

# ==============================================
# Token Cleanup & Rotation Configuration
# ==============================================

# Automatic cleanup of expired tokens
# Removes expired AND inactive tokens from database periodically
ezkey.admin.token.cleanup.enabled=true
ezkey.admin.token.cleanup.schedule=0 0 * * * *

# Token rotation on login
# Deactivates all existing active tokens when administrator logs in
# Ensures only one active token per administrator at any time
ezkey.admin.token.rotation-on-login=true

# ==============================================
# Password Policy Configuration
# ==============================================

# Password strength requirements enforced by PasswordValidator utility
# Minimum length: 12 characters
# Required character types: uppercase, lowercase, digit, special character
# Special characters allowed: !@#$%^&*()_+-=[]{}|;:,.<>?
# Maximum length: 128 characters (DoS protection)

# When password change is required, admin cannot login until password is changed
# Password change invalidates all existing tokens (forced rotation)

# ==============================================
# Admin MFA Bootstrap Configuration
# ==============================================

# Enable or disable admin MFA infrastructure bootstrap
# When enabled, automatically creates Integration Zero and Enrollment Zero at startup
# This implements the "Eat Your Own Dog Food" principle where Ezkey uses its own MFA
ezkey.admin.mfa.bootstrap.enabled=true

# MFA enforcement mode: dev (optional) or prod (required)
# dev: Administrators can choose whether to use MFA (suitable for development)
# prod: MFA is required for all administrators (recommended for production)
ezkey.admin.mfa.mode=prod

# Auto-create Enrollment Zero for admin global
# When enabled, automatically creates an enrollment for admin at startup
# Development: true (convenient for testing)
# Production: false (manual enrollment for security)
ezkey.admin.mfa.bootstrap.auto-enrollment=true

# ==============================================
# Passwordless Authentication Configuration
# ==============================================

# Enable passwordless authentication feature globally
# When enabled, administrators can authenticate using Ezkey cryptographic authentication
# without requiring passwords. This implements "Eat Your Own Dogfood" principle.
# Disabled: Passwordless not available (password-only authentication)
# Enabled: Passwordless available for admins with passwordless_enabled=true
ezkey.admin.auth.passwordless.enabled=true

# Passwordless enforcement mode: opt-in (default) or enforced
# opt-in: Administrators choose whether to enable passwordless (backward compatible)
# enforced: All admins must use passwordless (requires bound enrollment, breaking change)
ezkey.admin.auth.passwordless.mode=opt-in

# Wait timeout for passwordless authentication device response
# Maximum time in seconds to wait for device approval during passwordless login
# Recommended: 300 seconds (5 minutes) - gives user time to unlock device
ezkey.admin.auth.passwordless.wait-timeout=300

# Polling interval for device response check
# How often to check for device response during passwordless authentication
# Recommended: 2 seconds - balance between responsiveness and database load
ezkey.admin.auth.passwordless.polling-interval=2

# Challenge verification policy for passwordless authentication
# optional: Challenge code is optional (default)
# required: Challenge code is always required (enhanced security)
# disabled: Challenge code never used (faster but less secure)
ezkey.admin.auth.challenge.mode=optional
