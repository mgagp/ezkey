# Ezkey Admin API - Windows Native Development Configuration
# This profile is used for local development on Windows (non-Docker)
#
# Usage: Add to VM options or application.properties:
#   spring.profiles.active=windows
# OR set environment variable:
#   SPRING_PROFILES_ACTIVE=windows
# OR pass as command-line argument:
#   java -jar app.jar --spring.profiles.active=windows

spring.application.name=ezkey-admin-api
server.port=9080

# Actuator Configuration (dev-friendly for Windows)
management.server.port=9081
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,metrics,threaddump,heapdump
management.endpoint.health.show-details=when-authorized

# Database Configuration (local PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/ezkey_db
spring.datasource.username=postgres
spring.datasource.password=ezkey
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson Datetime Configuration
# spring.jackson.serialization.write-dates-as-timestamps=false (disabled for Spring Boot 4)
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'

# Flyway Migration
spring.flyway.enabled=false

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.custom-site-title=Ezkey Admin API Documentation

# Logging Configuration (Dev-friendly with more details)
logging.level.root=WARN
logging.level.org.ezkey=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.data.jpa.repository=DEBUG
logging.level.org.springframework.boot.autoconfigure.domain=DEBUG

# Development Tools - ENABLED for Windows dev
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Server Configuration
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=5

# Admin API Rate Limiting Configuration
ezkey.admin.rate-limit.enabled=true
ezkey.admin.rate-limit.login.requests=50
ezkey.admin.rate-limit.login.window-minutes=1
ezkey.admin.rate-limit.login.key-strategy=client-ip
ezkey.admin.rate-limit.login.block-after-failures=20
ezkey.admin.rate-limit.login.block-duration-minutes=5

# Recovery Codes Configuration
ezkey.admin.recovery.codes-count=10
ezkey.admin.recovery.temp-token-duration-minutes=30
ezkey.admin.rate-limit.recovery.requests=50
ezkey.admin.rate-limit.recovery.window-minutes=15

# API Key Rate Limiting Configuration
ezkey.admin.rate-limit.api-key.enabled=true
ezkey.admin.rate-limit.api-key.requests=50
ezkey.admin.rate-limit.api-key.window-minutes=1
ezkey.admin.rate-limit.api-key.key-strategy=integration-key
ezkey.admin.api-key.max-active-per-integration=5

# API Key Operations Rate Limiting
ezkey.api-key.rate-limit.enabled=true
ezkey.api-key.rate-limit.create-auth-attempt.requests=50
ezkey.api-key.rate-limit.create-auth-attempt.window-minutes=1
ezkey.api-key.rate-limit.wait-auth-attempt.requests=50
ezkey.api-key.rate-limit.wait-auth-attempt.window-minutes=1

# Admin Operations Rate Limiting
ezkey.admin-operations.rate-limit.enabled=true
ezkey.admin-operations.rate-limit.api-key-create.requests=50
ezkey.admin-operations.rate-limit.api-key-create.window-minutes=15
ezkey.admin-operations.rate-limit.enrollment-reset.requests=50
ezkey.admin-operations.rate-limit.enrollment-reset.window-minutes=30

# Organization Configuration
ezkey.organization.name=Ezkey Local Dev
ezkey.organization.description=Local Ezkey MFA instance (Windows development)

# Initial Global Admin Configuration
ezkey.admin.initial.username=admin.windows
ezkey.admin.initial.email=admin@ezkey.local
ezkey.admin.initial.first-name=Admin
ezkey.admin.initial.last-name=Windows

# Token Cleanup & Rotation Configuration
ezkey.admin.token.cleanup.enabled=true
ezkey.admin.token.cleanup.schedule=0 0 * * * *
ezkey.admin.token.rotation-on-login=true
ezkey.admin.token.expiration-hours=2

# Admin MFA Bootstrap Configuration
ezkey.admin.mfa.bootstrap.enabled=true
ezkey.admin.mfa.mode=dev
ezkey.admin.mfa.bootstrap.auto-enrollment=true

# Bootstrap Credentials File Export (DISABLED for Windows dev)
# Windows dev typically doesn't need automated bootstrap export
ezkey.admin.bootstrap.export.enabled=false
ezkey.admin.bootstrap.export.path=C:\Temp\ezkey\bootstrap\bootstrap-credentials.json

# Passwordless Authentication Configuration
ezkey.admin.auth.passwordless.enabled=true
ezkey.admin.auth.passwordless.mode=opt-in
ezkey.admin.auth.passwordless.wait-timeout=300
ezkey.admin.auth.passwordless.polling-interval=2
ezkey.admin.auth.challenge.mode=optional

# Audit Logging Configuration
ezkey.audit.retention-days=7
ezkey.audit.cleanup.enabled=false
ezkey.audit.cleanup.cron=0 0 2 * * ?

# Audit Integrity (disabled in dev -- no HMAC key file)
ezkey.audit.integrity.enabled=false
ezkey.audit.chain.enabled=false

# Encryption Configuration (Tink) - Enabled for Windows
# Master key and keyset stored in Windows ProgramData directory
# Run: .\scripts\generate-master-key.ps1 to create the master key
# Keyset is stored in file (local single-instance mode)
ezkey.encryption.enabled=true
ezkey.encryption.master-key-file=C:\ProgramData\ezkey\secrets\master.key
ezkey.encryption.keyset-file=C:\ProgramData\ezkey\keysets\keyset.json.encrypted
ezkey.encryption.algorithm=AES256_GCM

# Keyset Storage Mode: FILE (local single-instance)
# Windows dev uses FILE mode since it's typically single-instance
ezkey.encryption.keyset.storage-mode=FILE
ezkey.encryption.keyset.degraded-mode-enabled=true

# Key Rotation Configuration
ezkey.encryption.rotation.enabled=false
ezkey.encryption.rotation.schedule=0 0 2 * * ?
ezkey.encryption.rotation.max-key-age-days=90
ezkey.encryption.rotation.backup-before-rotation=true
