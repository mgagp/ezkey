# Ezkey Admin API - Docker Dev Configuration
spring.application.name=ezkey-admin-api
server.port=9080

# Database Configuration (from environment variables in docker-compose.yml)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ezkey_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ezkey}
spring.datasource.driver-class-name=org.postgresql.Driver

# Actuator Configuration (DEV - richer diagnostics)
# Notes:
# - Intended for local Docker development only.
# - DO NOT expose these endpoints publicly in staging/prod.
management.server.port=9081
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,threaddump
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
