# =============================================================================
# Docker EVAL runtime profile (opt-in) — Admin API
# =============================================================================
# Activated when operators select product runtime profile "eval":
#   ./ezkey-tests/clean-start.sh --runtime=eval
#   EZKEY_RUNTIME_PROFILE=eval ./docker/start.sh
#   Lightsail .env: EZKEY_RUNTIME_PROFILE=eval and SPRING_PROFILES_ACTIVE=…,docker-eval
#
# Default clean-start / unset EZKEY_RUNTIME_PROFILE = integrity (this file NOT loaded).
#
# Claim boundary: MFA crypto stays on; audit-integrity *monitoring* is off by design.
# Do not document eval as tamper-evident even though HMAC audit write stays enabled.
#
# Hard coupling (★): checkpoints OFF ⇒ heartbeat OFF on Admin AND Auth AND Integration.
# =============================================================================

# --- OFF together (★ hard coupling) ---
ezkey.audit.chain.enabled=false
ezkey.audit.chain.heartbeat.enabled=false
ezkey.audit.chain.heartbeat.required=false
# Idle Admin evaluate ticker when heartbeat supervision is off
ezkey.audit.chain.heartbeat.admin-evaluate-scheduler-enabled=false

# --- Audit integrity monitoring / archive jobs OFF ---
ezkey.audit.integrity.nightly.enabled=false
ezkey.audit.archive.auto-seal.enabled=false
ezkey.audit.archive.purge.enabled=false

# --- Encryption lifecycle jobs OFF (encryption itself stays ON) ---
ezkey.encryption.rotation.enabled=false
ezkey.encryption.reencryption.enabled=false

# --- Housekeeping schedulers OFF ---
ezkey.enrollment.expired-cleanup.enabled=false
ezkey.admin.token.cleanup.enabled=false

# --- Explicitly ON (inherit docker defaults; listed for matrix clarity) ---
# ezkey.encryption.enabled=true / required=true — kept from docker
# ezkey.audit.integrity.enabled=true / required=true — HMAC write path stays
# ezkey.auth-attempt.expiry-scheduler.enabled=true — prefer ON for demo
# Admin MFA bootstrap / keyset writer-sync — unchanged
