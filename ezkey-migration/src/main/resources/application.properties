# Ezkey Migration Application Configuration
# This file contains configuration for the dedicated migration application

# Application Information
spring.application.name=ezkey-migration
spring.main.banner-mode=console
spring.main.web-application-type=none

# Database Configuration (can be overridden by environment variables or command line)
spring.datasource.url=jdbc:postgresql://localhost:5432/ezkey_db
spring.datasource.username=postgres
spring.datasource.password=ezkey
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration
# Flyway is enabled but auto-execution is disabled to allow CommandLineRunner to control operations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Initial baseline
# Disable automatic migration/validation - let FlywayCommandRunner handle it
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
# Prevent Flyway from running automatically at startup
# Note: baseline-on-migrate is set to true above (line 25) to handle existing schemas

# Logging Configuration
logging.level.org.ezkey=INFO
logging.level.org.springframework.boot.autoconfigure.flyway=INFO
logging.level.org.flywaydb=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Management and Monitoring (CLI only, no web endpoints)
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true