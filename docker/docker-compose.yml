# Project name for Docker Compose (appears as group name in Docker Desktop)
name: ezkey

# Enable BuildKit for Maven cache mount support
x-buildkit: &buildkit
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

services:
  postgres:
    image: postgres:17-alpine
    container_name: ezkey-postgres
    environment:
      POSTGRES_DB: ezkey_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ezkey
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ezkey-network
    restart: unless-stopped

  migration:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migration
    container_name: ezkey-migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ezkey
    networks:
      - ezkey-network
    restart: "no"

  admin-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: admin-api
    container_name: ezkey-admin-api
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ezkey
      EZKEY_ADMIN_INITIAL_USERNAME: admin.docker
      EZKEY_ADMIN_INITIAL_EMAIL: admin@ezkey.local
      EZKEY_ADMIN_INITIAL_FIRST_NAME: Admin
      EZKEY_ADMIN_INITIAL_LAST_NAME: Docker
    volumes:
      - encryption-secrets:/etc/ezkey
      - bootstrap-artifacts:/var/lib/ezkey/bootstrap
    ports:
      - "9080:9080"
    networks:
      - ezkey-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9081/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  auth-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: auth-api
    container_name: ezkey-auth-api
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ezkey
    volumes:
      - encryption-secrets:/etc/ezkey
    ports:
      - "8080:8080"
    networks:
      - ezkey-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  demo-device:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: demo-device
    container_name: ezkey-demo-device
    depends_on:
      auth-api:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      EZKEY_AUTH_API_URL: http://auth-api:8080
    volumes:
      - demo-device-data:/app/data
    ports:
      - "8083:8083"
    networks:
      - ezkey-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  crypto-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: crypto-api
    container_name: ezkey-crypto-api
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    ports:
      - "9090:9090"
    networks:
      - ezkey-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  bootstrap-init:
    build:
      context: ..
      dockerfile: docker/bootstrap-init/Dockerfile
    container_name: ezkey-bootstrap-init
    depends_on:
      admin-api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
      crypto-api:
        condition: service_healthy
      demo-device:
        condition: service_started
    environment:
      ADMIN_API_URL: http://admin-api:9080
      AUTH_API_URL: http://auth-api:8080
      CRYPTO_API_URL: http://crypto-api:9090
    volumes:
      - bootstrap-artifacts:/bootstrap
      - demo-device-data:/app/data
    networks:
      - ezkey-network
    restart: "no"

networks:
  ezkey-network:
    driver: bridge

volumes:
  postgres-data:
  demo-device-data:
  maven-cache:
  encryption-secrets:
  bootstrap-artifacts:

