# Project name for Docker Compose (appears as group name in Docker Desktop)
name: ezkey

# Enable BuildKit for Maven cache mount support
x-buildkit: &buildkit
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

# Log line timestamps in containers follow this zone (JVM, Postgres, shell). Default UTC.
# Override with IANA name in docker/.env, e.g. TZ=America/Toronto (see docker/README.md).
x-container-tz: &container-tz
  TZ: ${TZ:-UTC}

services:
  postgres:
    image: postgres:18-alpine
    container_name: ezkey-postgres
    environment:
      <<: *container-tz
      POSTGRES_DB: ezkey_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ezkey}
      PGDATA: /var/lib/postgresql/data
      # App/migrate role passwords (used by docker-entrypoint-initdb.d on empty volume)
      EZKEY_DB_MIGRATE_PASSWORD: ${EZKEY_DB_MIGRATE_PASSWORD:-ezkey_migrate}
      EZKEY_DB_ADMIN_PASSWORD: ${EZKEY_DB_ADMIN_PASSWORD:-ezkey_admin}
      EZKEY_DB_AUTH_PASSWORD: ${EZKEY_DB_AUTH_PASSWORD:-ezkey_auth}
      EZKEY_DB_INTEGRATION_PASSWORD: ${EZKEY_DB_INTEGRATION_PASSWORD:-ezkey_integration}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ezkey-network
    restart: unless-stopped

  migration:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migration
    container_name: ezkey-migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: ezkey_migrate
      SPRING_DATASOURCE_PASSWORD: ${EZKEY_DB_MIGRATE_PASSWORD:-ezkey_migrate}
    networks:
      - ezkey-network
    restart: "no"

  # Apply DML grants after Flyway (idempotent). See scripts/db/apply-grants.sql
  db-grants:
    image: postgres:18-alpine
    container_name: ezkey-db-grants
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      <<: *container-tz
      PGPASSWORD: ${POSTGRES_PASSWORD:-ezkey}
    volumes:
      - ../scripts/db:/scripts:ro
    entrypoint:
      [
        "psql",
        "-h",
        "postgres",
        "-U",
        "postgres",
        "-d",
        "ezkey_db",
        "-v",
        "ON_ERROR_STOP=1",
        "-f",
        "/scripts/apply-grants.sql",
      ]
    networks:
      - ezkey-network
    restart: "no"

  admin-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: admin-api
    container_name: ezkey-admin-api
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: ezkey_admin
      SPRING_DATASOURCE_PASSWORD: ${EZKEY_DB_ADMIN_PASSWORD:-ezkey_admin}
      EZKEY_ADMIN_INITIAL_USERNAME: admin.docker
      EZKEY_ADMIN_INITIAL_EMAIL: admin@ezkey.local
      EZKEY_ADMIN_INITIAL_FIRST_NAME: Admin
      EZKEY_ADMIN_INITIAL_LAST_NAME: Docker
      MANAGEMENT_SERVER_PORT: 9081
      EZKEY_DATABASE_PARTITION_SCHEDULER_CRON: "0 */20 * * * ?"
      # Public Auth API base URL for enrollment QR authUrl + GET /api/v1/public/instance-info.
      # Set when phones reach Auth API via tunnel or public hostname (not http://auth-api:8080).
      EZKEY_QR_AUTH_BASE_URL: ${EZKEY_QR_AUTH_BASE_URL:-}
      # Optional "About / learn more" link (maps to ezkey.organization.about-url).
      EZKEY_ORGANIZATION_ABOUT_URL: ${EZKEY_ORGANIZATION_ABOUT_URL:-}
      # full (default) = logs + bootstrap-credentials.json for clean-start. recovery_primary = recovery-only logs, no JSON export.
      EZKEY_ADMIN_MFA_BOOTSTRAP_CREDENTIALS_OUTPUT_MODE: ${EZKEY_ADMIN_MFA_BOOTSTRAP_CREDENTIALS_OUTPUT_MODE:-full}
    volumes:
      - encryption-secrets:/etc/ezkey
      - bootstrap-artifacts:/var/lib/ezkey/bootstrap
    ports:
      - "9080:9080"
      - "9081:9081"
    networks:
      - ezkey-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  auth-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: auth-api
    container_name: ezkey-auth-api
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully
      # Acceleration only (ADR-0012). In-process wait is the HA / Auth-first contract.
      # Forced repro: docker compose up --no-deps auth-api
      admin-api:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: ezkey_auth
      SPRING_DATASOURCE_PASSWORD: ${EZKEY_DB_AUTH_PASSWORD:-ezkey_auth}
      MANAGEMENT_SERVER_PORT: 8085
      # Demo MITM (simulated): global gate for Pending "sign then tamper" (see docs/DEMO_MITM_SIGNATURE.md).
      # Per-attempt opt-in is stored when creating an auth attempt (e.g. Admin UI demo checkbox).
      # Default true for this dev stack so ./ezkey-tests/clean-start.sh can demo without extra env.
      # Set EZKEY_DEMO_MITM_SIGNATURE_ENABLED=false for production-like runs.
      EZKEY_DEMO_MITM_SIGNATURE_ENABLED: ${EZKEY_DEMO_MITM_SIGNATURE_ENABLED:-true}
      # Same public metadata as admin-api for GET /api/v1/public/instance-info (mobile, operators).
      EZKEY_QR_AUTH_BASE_URL: ${EZKEY_QR_AUTH_BASE_URL:-}
      EZKEY_ORGANIZATION_ABOUT_URL: ${EZKEY_ORGANIZATION_ABOUT_URL:-}
      # Always a valid Duration. Empty host value would fail Spring bind.
      EZKEY_ENCRYPTION_KEYSET_BOOTSTRAP_WAIT: ${EZKEY_ENCRYPTION_KEYSET_BOOTSTRAP_WAIT:-PT90S}
    volumes:
      - encryption-secrets:/etc/ezkey
    ports:
      - "8080:8080"
      - "8085:8085"
    networks:
      - ezkey-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  integration-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: integration-api
    container_name: ezkey-integration-api
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully
      # Acceleration only (ADR-0012). In-process wait is the HA contract.
      admin-api:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: ezkey_integration
      SPRING_DATASOURCE_PASSWORD: ${EZKEY_DB_INTEGRATION_PASSWORD:-ezkey_integration}
      MANAGEMENT_SERVER_PORT: 7081
      EZKEY_ENCRYPTION_KEYSET_BOOTSTRAP_WAIT: ${EZKEY_ENCRYPTION_KEYSET_BOOTSTRAP_WAIT:-PT90S}
    volumes:
      - encryption-secrets:/etc/ezkey
    ports:
      - "7080:7080"
      - "7081:7081"
    networks:
      - ezkey-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  demo-device:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: demo-device
    container_name: ezkey-demo-device
    depends_on:
      auth-api:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      EZKEY_AUTH_API_URL: http://auth-api:8080
    volumes:
      - demo-device-data:/app/data
    ports:
      - "8083:8083"
    networks:
      - ezkey-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  crypto-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: crypto-api
    container_name: ezkey-crypto-api
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      admin-api:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    volumes:
      - encryption-secrets:/etc/ezkey
    ports:
      - "9090:9090"
    networks:
      - ezkey-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  demo-app-acme:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: demo-app-acme
    container_name: ezkey-demo-app-acme
    depends_on:
      integration-api:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      # External configuration location - must be set as environment variable to be loaded early enough
      # Spring Boot automatically searches in ./config/ relative to working directory (/app/config/)
      # But we explicitly set it to ensure it's loaded
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/app/config/,optional:file:./config/
      # Ezkey SDK base URL (same REST paths). Tenant API-key flows live on Integration API (7080), not Admin API (9080).
      EZKEY_ADMIN_API_URL: http://integration-api:7080
      # EZKEY_INTEGRATION_KEY and EZKEY_SECRET_KEY: Leave unset initially - configure via /app/config/application.properties after creating integration
      # Format: Authorization: Basic base64(integrationKey:secretKey)
    volumes:
      - demo-app-acme-data:/app/data
      - demo-app-acme-config:/app/config
    ports:
      - "8082:8082"
    networks:
      - ezkey-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  bootstrap-init:
    build:
      context: ..
      dockerfile: docker/bootstrap-init/Dockerfile
    container_name: ezkey-bootstrap-init
    depends_on:
      admin-api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
      crypto-api:
        condition: service_healthy
      demo-device:
        condition: service_started
    environment:
      <<: *container-tz
      ADMIN_API_URL: http://admin-api:9080
      AUTH_API_URL: http://auth-api:8080
      CRYPTO_API_URL: http://crypto-api:9090
      # Set false when using recovery_primary bootstrap (no bootstrap-credentials.json).
      EZKEY_BOOTSTRAP_INIT_ENABLED: ${EZKEY_BOOTSTRAP_INIT_ENABLED:-true}
    volumes:
      - bootstrap-artifacts:/bootstrap
      - demo-device-data:/app/data
      - demo-app-acme-data:/app/acme-data
    networks:
      - ezkey-network
    restart: "no"

networks:
  ezkey-network:
    driver: bridge

volumes:
  postgres-data:
  demo-device-data:
  demo-app-acme-data:
  demo-app-acme-config:
  encryption-secrets:
  bootstrap-artifacts:

