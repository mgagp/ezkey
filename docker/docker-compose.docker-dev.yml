# Local Docker diagnostics override.
#
# This file republishes management/Actuator ports to the host for local development only.
# Host bind is 127.0.0.1 (same as base compose). Do not use this override in staging or production.
#
# Usage:
#   # Linux/Mac
#   SPRING_PROFILES_ACTIVE=docker-dev docker compose -f docker/docker-compose.yml -f docker/docker-compose.docker-dev.yml up -d
#
#   # Windows PowerShell
#   $env:SPRING_PROFILES_ACTIVE="docker-dev"; docker compose -f docker\docker-compose.yml -f docker\docker-compose.docker-dev.yml up -d

services:
  admin-api:
    ports:
      - "127.0.0.1:9081:9081"
  auth-api:
    ports:
      - "127.0.0.1:8085:8085"
  integration-api:
    ports:
      - "127.0.0.1:7081:7081"
