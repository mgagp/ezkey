# HA Docker JavaMelody collector overlay (DEV / troubleshooting only).
#
# Same collector UI as the baseline overlay (http://localhost:8088). Each application
# aggregates both replicas via applications-ha.properties.
#
# Usage:
#   ./ezkey-tests/clean-start.sh --ha --with-java-melody
#   EZKEY_ENABLE_JAVA_MELODY=true ./docker/start-ha.sh

x-javamelody-env: &javamelody-env
  JAVAMELODY_ENABLED: "true"
  JAVAMELODY_MANAGEMENT_ENDPOINT_MONITORING_ENABLED: "true"
  JAVAMELODY_SPRING_MONITORING_ENABLED: "true"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,monitoring"
  MANAGEMENT_ENDPOINT_MONITORING_ACCESS: unrestricted
  JAVAMELODY_INIT_PARAMETERS_SYSTEM_ACTIONS_ENABLED: "false"
  JAVAMELODY_INIT_PARAMETERS_CSRF_PROTECTION_ENABLED: "true"
  JAVAMELODY_INIT_PARAMETERS_UPDATE_CHECK_DISABLED: "true"
  JAVAMELODY_INIT_PARAMETERS_LOG: "false"
  JAVAMELODY_INIT_PARAMETERS_HTTP_TRANSFORM_PATTERN: "[0-9a-fA-F]{8}-[0-9a-fA-F-]{27}|\\d+"
  JAVAMELODY_INIT_PARAMETERS_OBSOLETE_GRAPHS_DAYS: "30"
  JAVAMELODY_INIT_PARAMETERS_OBSOLETE_STATS_DAYS: "30"

services:
  admin-api-1:
    environment:
      <<: *javamelody-env
      JAVAMELODY_INIT_PARAMETERS_APPLICATION_NAME: admin-api
  admin-api-2:
    environment:
      <<: *javamelody-env
      JAVAMELODY_INIT_PARAMETERS_APPLICATION_NAME: admin-api

  auth-api-1:
    environment:
      <<: *javamelody-env
      JAVAMELODY_INIT_PARAMETERS_APPLICATION_NAME: auth-api
  auth-api-2:
    environment:
      <<: *javamelody-env
      JAVAMELODY_INIT_PARAMETERS_APPLICATION_NAME: auth-api

  integration-api-1:
    environment:
      <<: *javamelody-env
      JAVAMELODY_INIT_PARAMETERS_APPLICATION_NAME: integration-api
  integration-api-2:
    environment:
      <<: *javamelody-env
      JAVAMELODY_INIT_PARAMETERS_APPLICATION_NAME: integration-api

  javamelody-collector:
    build:
      context: ./javamelody
      dockerfile: Dockerfile
      args:
        JAVAMELODY_VERSION: "2.9.0"
    container_name: ezkey-javamelody-collector-ha
    depends_on:
      admin-api-1:
        condition: service_healthy
      admin-api-2:
        condition: service_healthy
      auth-api-1:
        condition: service_healthy
      auth-api-2:
        condition: service_healthy
      integration-api-1:
        condition: service_healthy
      integration-api-2:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./javamelody/applications-ha.properties:/opt/javamelody/applications.properties:ro
      - javamelody-data-ha:/tmp/javamelody
    ports:
      # Bind loopback only — collector is a local troubleshooting surface, not a LAN service.
      - "127.0.0.1:8088:8080"
    networks:
      - ezkey-network-ha
    restart: unless-stopped

volumes:
  javamelody-data-ha:
