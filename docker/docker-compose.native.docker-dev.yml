# Local Docker diagnostics override for native stack.
#
# Publishes management/Actuator ports to the host for local development only.
# Do not use this override in staging or production.
#
# Usage:
#   # Linux/Mac
#   SPRING_PROFILES_ACTIVE=docker-dev,native docker compose -f docker/docker-compose.native.yml -f docker/docker-compose.native.docker-dev.yml up -d
#
#   # Windows PowerShell
#   $env:SPRING_PROFILES_ACTIVE="docker-dev,native"; docker compose -f docker\docker-compose.native.yml -f docker\docker-compose.native.docker-dev.yml up -d

services:
  admin-api:
    ports:
      - "9081:9081"
  auth-api:
    ports:
      - "8085:8085"

