# Reference only — not mounted by default.
# Canonical injection for API JVMs is SPRING_APPLICATION_JSON in
# docker-compose*.javamelody.yml (hyphenated Parameter codes).
#
# Do NOT use plain JAVAMELODY_INIT_PARAMETERS_SYSTEM_ACTIONS_ENABLED env vars:
# Spring relaxed binding turns them into underscore map keys that JavaMelody
# silently ignores (#847 Christophe runtime proof).
#
# Equivalent property form (if ever mounted via SPRING_CONFIG_IMPORT):
# javamelody.init-parameters.system-actions-enabled=false
# javamelody.init-parameters.csrf-protection-enabled=true
# javamelody.init-parameters.update-check-disabled=true
# javamelody.init-parameters.log=false
# javamelody.init-parameters.http-transform-pattern=[0-9a-fA-F]{8}-[0-9a-fA-F-]{27}|\d+
# javamelody.init-parameters.obsolete-graphs-days=30
# javamelody.init-parameters.obsolete-stats-days=30
