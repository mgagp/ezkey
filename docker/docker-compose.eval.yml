# =============================================================================
# Optional compose marker for EVAL runtime profile (opt-in).
#
# Prefer activating via product key:
#   EZKEY_RUNTIME_PROFILE=eval
#   ./ezkey-tests/clean-start.sh --runtime=eval
#
# docker/start.sh appends Spring profile `docker-eval` when EZKEY_RUNTIME_PROFILE=eval.
# This overlay is optional documentation/visibility; it does not replace property files
# under application-docker-eval.properties.
#
# Claim boundary: MFA crypto on; audit-integrity monitoring off. Not tamper-evident.
# =============================================================================

services:
  admin-api:
    labels:
      ezkey.runtime.profile: eval
  auth-api:
    labels:
      ezkey.runtime.profile: eval
  integration-api:
    labels:
      ezkey.runtime.profile: eval
