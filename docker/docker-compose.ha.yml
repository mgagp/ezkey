# Project name for Docker Compose HA (appears as group name in Docker Desktop)
name: ezkey-ha

# Enable BuildKit for Maven cache mount support
x-buildkit: &buildkit
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

services:
  postgres:
    image: postgres:18-alpine
    container_name: ezkey-postgres-ha
    environment:
      POSTGRES_DB: ezkey_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ezkey
    volumes:
      - postgres-data-ha:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ezkey-network-ha
    restart: unless-stopped

  migration:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migration
    container_name: ezkey-migration-ha
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ezkey
    networks:
      - ezkey-network-ha
    restart: "no"

  # Admin API Instance 1
  admin-api-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: admin-api
    container_name: ezkey-admin-api-1
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ezkey
      EZKEY_ADMIN_INITIAL_USERNAME: admin.docker
      EZKEY_ADMIN_INITIAL_EMAIL: admin@ezkey.local
      EZKEY_ADMIN_INITIAL_FIRST_NAME: Admin
      EZKEY_ADMIN_INITIAL_LAST_NAME: Docker
      # Add instance identifier for logging
      EZKEY_INSTANCE_ID: admin-api-1
    volumes:
      - encryption-secrets-ha:/etc/ezkey
      - bootstrap-artifacts-ha:/var/lib/ezkey/bootstrap
    # Internal port only, not exposed to host (accessed via HAProxy)
    expose:
      - "9080"
    networks:
      - ezkey-network-ha
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 3

  # Admin API Instance 2
  admin-api-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: admin-api
    container_name: ezkey-admin-api-2
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ezkey
      EZKEY_ADMIN_INITIAL_USERNAME: admin.docker
      EZKEY_ADMIN_INITIAL_EMAIL: admin@ezkey.local
      EZKEY_ADMIN_INITIAL_FIRST_NAME: Admin
      EZKEY_ADMIN_INITIAL_LAST_NAME: Docker
      # Add instance identifier for logging
      EZKEY_INSTANCE_ID: admin-api-2
    volumes:
      - encryption-secrets-ha:/etc/ezkey
      - bootstrap-artifacts-ha:/var/lib/ezkey/bootstrap
    # Internal port only, not exposed to host (accessed via HAProxy)
    expose:
      - "9080"
    networks:
      - ezkey-network-ha
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 3

  # HAProxy for Admin API
  haproxy-admin:
    image: haproxy:2.9-alpine
    container_name: ezkey-haproxy-admin
    depends_on:
      admin-api-1:
        condition: service_healthy
      admin-api-2:
        condition: service_healthy
    volumes:
      - ./haproxy/haproxy-admin.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9080:9080"
      - "9081:9081"  # Stats page
    networks:
      - ezkey-network-ha
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Auth API Instance 1
  auth-api-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: auth-api
    container_name: ezkey-auth-api-1
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ezkey
      # Add instance identifier for logging
      EZKEY_INSTANCE_ID: auth-api-1
    volumes:
      - encryption-secrets-ha:/etc/ezkey
    # Internal port only, not exposed to host (accessed via HAProxy)
    expose:
      - "8080"
    networks:
      - ezkey-network-ha
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 3

  # Auth API Instance 2
  auth-api-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: auth-api
    container_name: ezkey-auth-api-2
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ezkey
      # Add instance identifier for logging
      EZKEY_INSTANCE_ID: auth-api-2
    volumes:
      - encryption-secrets-ha:/etc/ezkey
    # Internal port only, not exposed to host (accessed via HAProxy)
    expose:
      - "8080"
    networks:
      - ezkey-network-ha
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 3

  # HAProxy for Auth API
  haproxy-auth:
    image: haproxy:2.9-alpine
    container_name: ezkey-haproxy-auth
    depends_on:
      auth-api-1:
        condition: service_healthy
      auth-api-2:
        condition: service_healthy
    volumes:
      - ./haproxy/haproxy-auth.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:8080"
      - "8081:8081"  # Stats page
    networks:
      - ezkey-network-ha
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Crypto API
  crypto-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: crypto-api
    container_name: ezkey-crypto-api-ha
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    volumes:
      - encryption-secrets-ha:/etc/ezkey
    ports:
      - "9090:9090"
    networks:
      - ezkey-network-ha
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 3

  # Demo Device
  demo-device:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: demo-device
    container_name: ezkey-demo-device-ha
    depends_on:
      haproxy-auth:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      # Point to HAProxy for Auth API (internal network name)
      EZKEY_AUTH_API_URL: http://haproxy-auth:8080
    volumes:
      - demo-device-data-ha:/app/data
    ports:
      - "8083:8083"
    networks:
      - ezkey-network-ha
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 3

  # CLI Test Container
  cli-test:
    build:
      context: ..
      dockerfile: docker/cli-test/Dockerfile
    container_name: ezkey-cli-test-ha
    depends_on:
      haproxy-admin:
        condition: service_healthy
      haproxy-auth:
        condition: service_healthy
      crypto-api:
        condition: service_healthy
    environment:
      EZKEY_ADMIN_API_URL: http://haproxy-admin:9080
        EZKEY_ADMIN_HEALTH_URL: http://haproxy-admin:9081
      EZKEY_AUTH_API_URL: http://haproxy-auth:8080
      EZKEY_CRYPTO_API_URL: http://crypto-api:9090
    volumes:
      - cli-config:/root/.ezkey
      - cli-work:/work
      - cli-bash-history:/root
      - ../ezkey.json.docker-init:/tmp/ezkey.json.docker-init:ro
    working_dir: /work
    command: tail -f /dev/null
    stdin_open: true
    tty: true
    networks:
      - ezkey-network-ha
    restart: unless-stopped

  # Bootstrap Init (runs after all services are healthy)
  bootstrap-init:
    build:
      context: ..
      dockerfile: docker/bootstrap-init/Dockerfile
    container_name: ezkey-bootstrap-init-ha
    depends_on:
      haproxy-admin:
        condition: service_healthy
      haproxy-auth:
        condition: service_healthy
      crypto-api:
        condition: service_healthy
      demo-device:
        condition: service_started
    environment:
      ADMIN_API_URL: http://haproxy-admin:9080
      AUTH_API_URL: http://haproxy-auth:8080
      CRYPTO_API_URL: http://crypto-api:9090
    volumes:
      - bootstrap-artifacts-ha:/bootstrap
      - demo-device-data-ha:/app/data
    networks:
      - ezkey-network-ha
    restart: "no"

networks:
  ezkey-network-ha:
    driver: bridge

volumes:
  postgres-data-ha:
  encryption-secrets-ha:
  demo-device-data-ha:
  bootstrap-artifacts-ha:
  cli-config:
  cli-work:
