# Project name for Docker Compose HA (appears as group name in Docker Desktop)
name: ezkey-ha

# Enable BuildKit for Maven cache mount support
x-buildkit: &buildkit
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

# Log line timestamps in containers follow this zone (JVM, Postgres, shell). Default UTC.
# Override with IANA name in docker/.env, e.g. TZ=America/Toronto (see docker/README.md).
x-container-tz: &container-tz
  TZ: ${TZ:-UTC}

services:
  postgres:
    image: postgres:18-alpine
    container_name: ezkey-postgres-ha
    environment:
      <<: *container-tz
      POSTGRES_DB: ezkey_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ezkey}
      PGDATA: /var/lib/postgresql/data
      EZKEY_DB_MIGRATE_PASSWORD: ${EZKEY_DB_MIGRATE_PASSWORD:-ezkey_migrate}
      EZKEY_DB_ADMIN_PASSWORD: ${EZKEY_DB_ADMIN_PASSWORD:-ezkey_admin}
      EZKEY_DB_AUTH_PASSWORD: ${EZKEY_DB_AUTH_PASSWORD:-ezkey_auth}
      EZKEY_DB_INTEGRATION_PASSWORD: ${EZKEY_DB_INTEGRATION_PASSWORD:-ezkey_integration}
    volumes:
      - postgres-data-ha:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ezkey-network-ha
    restart: unless-stopped

  migration:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migration
    container_name: ezkey-migration-ha
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: ezkey_migrate
      SPRING_DATASOURCE_PASSWORD: ${EZKEY_DB_MIGRATE_PASSWORD:-ezkey_migrate}
    networks:
      - ezkey-network-ha
    restart: "no"

  db-grants:
    image: postgres:18-alpine
    container_name: ezkey-db-grants-ha
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      <<: *container-tz
      PGPASSWORD: ${POSTGRES_PASSWORD:-ezkey}
    volumes:
      - ../scripts/db:/scripts:ro
    entrypoint:
      [
        "psql",
        "-h",
        "postgres",
        "-U",
        "postgres",
        "-d",
        "ezkey_db",
        "-v",
        "ON_ERROR_STOP=1",
        "-f",
        "/scripts/apply-grants.sql",
      ]
    networks:
      - ezkey-network-ha
    restart: "no"

  # Admin API Instance 1
  admin-api-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: admin-api
    container_name: ezkey-admin-api-1
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: ezkey_admin
      SPRING_DATASOURCE_PASSWORD: ${EZKEY_DB_ADMIN_PASSWORD:-ezkey_admin}
      EZKEY_ADMIN_INITIAL_USERNAME: admin.docker
      EZKEY_ADMIN_INITIAL_EMAIL: admin@ezkey.local
      EZKEY_ADMIN_INITIAL_FIRST_NAME: Admin
      EZKEY_ADMIN_INITIAL_LAST_NAME: Docker
      MANAGEMENT_SERVER_PORT: 9081
      EZKEY_INSTANCE_ID: admin-api-1
      EZKEY_DATABASE_PARTITION_SCHEDULER_CRON: "0 */20 * * * ?"
      EZKEY_QR_AUTH_BASE_URL: ${EZKEY_QR_AUTH_BASE_URL:-}
      EZKEY_ORGANIZATION_ABOUT_URL: ${EZKEY_ORGANIZATION_ABOUT_URL:-}
      EZKEY_ADMIN_MFA_BOOTSTRAP_CREDENTIALS_OUTPUT_MODE: ${EZKEY_ADMIN_MFA_BOOTSTRAP_CREDENTIALS_OUTPUT_MODE:-full}
    volumes:
      - encryption-secrets-ha:/etc/ezkey
      - bootstrap-artifacts-ha:/var/lib/ezkey/bootstrap
    # Internal port only, not exposed to host (accessed via HAProxy)
    expose:
      - "9080"
      - "9081"
    networks:
      - ezkey-network-ha
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  # Admin API Instance 2
  admin-api-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: admin-api
    container_name: ezkey-admin-api-2
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: ezkey_admin
      SPRING_DATASOURCE_PASSWORD: ${EZKEY_DB_ADMIN_PASSWORD:-ezkey_admin}
      EZKEY_ADMIN_INITIAL_USERNAME: admin.docker
      EZKEY_ADMIN_INITIAL_EMAIL: admin@ezkey.local
      EZKEY_ADMIN_INITIAL_FIRST_NAME: Admin
      EZKEY_ADMIN_INITIAL_LAST_NAME: Docker
      MANAGEMENT_SERVER_PORT: 9081
      EZKEY_INSTANCE_ID: admin-api-2
      EZKEY_DATABASE_PARTITION_SCHEDULER_CRON: "0 */20 * * * ?"
      EZKEY_QR_AUTH_BASE_URL: ${EZKEY_QR_AUTH_BASE_URL:-}
      EZKEY_ORGANIZATION_ABOUT_URL: ${EZKEY_ORGANIZATION_ABOUT_URL:-}
      EZKEY_ADMIN_MFA_BOOTSTRAP_CREDENTIALS_OUTPUT_MODE: ${EZKEY_ADMIN_MFA_BOOTSTRAP_CREDENTIALS_OUTPUT_MODE:-full}
    volumes:
      - encryption-secrets-ha:/etc/ezkey
      - bootstrap-artifacts-ha:/var/lib/ezkey/bootstrap
    expose:
      - "9080"
      - "9081"
    networks:
      - ezkey-network-ha
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  # HAProxy for Admin API
  haproxy-admin:
    image: haproxy:2.9-alpine
    container_name: ezkey-haproxy-admin
    depends_on:
      admin-api-1:
        condition: service_healthy
      admin-api-2:
        condition: service_healthy
    volumes:
      - ./haproxy/haproxy-admin.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9080:9080"
      - "9081:9081"  # Stats page
    networks:
      - ezkey-network-ha
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Auth API Instance 1
  auth-api-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: auth-api
    container_name: ezkey-auth-api-1
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: ezkey_auth
      SPRING_DATASOURCE_PASSWORD: ${EZKEY_DB_AUTH_PASSWORD:-ezkey_auth}
      MANAGEMENT_SERVER_PORT: 8085
      EZKEY_INSTANCE_ID: auth-api-1
      EZKEY_DEMO_MITM_SIGNATURE_ENABLED: ${EZKEY_DEMO_MITM_SIGNATURE_ENABLED:-true}
      EZKEY_QR_AUTH_BASE_URL: ${EZKEY_QR_AUTH_BASE_URL:-}
      EZKEY_ORGANIZATION_ABOUT_URL: ${EZKEY_ORGANIZATION_ABOUT_URL:-}
    volumes:
      - encryption-secrets-ha:/etc/ezkey
    expose:
      - "8080"
      - "8085"
    networks:
      - ezkey-network-ha
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  # Auth API Instance 2
  auth-api-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: auth-api
    container_name: ezkey-auth-api-2
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: ezkey_auth
      SPRING_DATASOURCE_PASSWORD: ${EZKEY_DB_AUTH_PASSWORD:-ezkey_auth}
      MANAGEMENT_SERVER_PORT: 8085
      EZKEY_INSTANCE_ID: auth-api-2
      EZKEY_DEMO_MITM_SIGNATURE_ENABLED: ${EZKEY_DEMO_MITM_SIGNATURE_ENABLED:-true}
      EZKEY_QR_AUTH_BASE_URL: ${EZKEY_QR_AUTH_BASE_URL:-}
      EZKEY_ORGANIZATION_ABOUT_URL: ${EZKEY_ORGANIZATION_ABOUT_URL:-}
    volumes:
      - encryption-secrets-ha:/etc/ezkey
    expose:
      - "8080"
      - "8085"
    networks:
      - ezkey-network-ha
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  # HAProxy for Auth API
  haproxy-auth:
    image: haproxy:2.9-alpine
    container_name: ezkey-haproxy-auth
    depends_on:
      auth-api-1:
        condition: service_healthy
      auth-api-2:
        condition: service_healthy
    volumes:
      - ./haproxy/haproxy-auth.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:8080"
      - "8085:8085"  # Stats page
    networks:
      - ezkey-network-ha
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Integration API Instance 1
  integration-api-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: integration-api
    container_name: ezkey-integration-api-1
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully
      haproxy-admin:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: ezkey_integration
      SPRING_DATASOURCE_PASSWORD: ${EZKEY_DB_INTEGRATION_PASSWORD:-ezkey_integration}
      MANAGEMENT_SERVER_PORT: 7081
      EZKEY_INSTANCE_ID: integration-api-1
    volumes:
      - encryption-secrets-ha:/etc/ezkey
    expose:
      - "7080"
      - "7081"
    networks:
      - ezkey-network-ha
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  # Integration API Instance 2
  integration-api-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: integration-api
    container_name: ezkey-integration-api-2
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully
      haproxy-admin:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: ezkey_integration
      SPRING_DATASOURCE_PASSWORD: ${EZKEY_DB_INTEGRATION_PASSWORD:-ezkey_integration}
      MANAGEMENT_SERVER_PORT: 7081
      EZKEY_INSTANCE_ID: integration-api-2
    volumes:
      - encryption-secrets-ha:/etc/ezkey
    expose:
      - "7080"
      - "7081"
    networks:
      - ezkey-network-ha
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  # HAProxy for Integration API
  haproxy-integration:
    image: haproxy:2.9-alpine
    container_name: ezkey-haproxy-integration
    depends_on:
      integration-api-1:
        condition: service_healthy
      integration-api-2:
        condition: service_healthy
    volumes:
      - ./haproxy/haproxy-integration.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "7080:7080"
      - "7081:7081"  # Stats page
    networks:
      - ezkey-network-ha
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Crypto API
  crypto-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: crypto-api
    container_name: ezkey-crypto-api-ha
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      haproxy-admin:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    volumes:
      - encryption-secrets-ha:/etc/ezkey
    ports:
      - "9090:9090"
    networks:
      - ezkey-network-ha
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  # Demo Device
  demo-device:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: demo-device
    container_name: ezkey-demo-device-ha
    depends_on:
      haproxy-auth:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      # Point to HAProxy for Auth API (internal network name)
      EZKEY_AUTH_API_URL: http://haproxy-auth:8080
    volumes:
      - demo-device-data-ha:/app/data
    ports:
      - "8083:8083"
    networks:
      - ezkey-network-ha
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  # Demo App ACME (Integration API via HAProxy)
  demo-app-acme:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: demo-app-acme
    container_name: ezkey-demo-app-acme-ha
    depends_on:
      haproxy-integration:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/app/config/,optional:file:./config/
      # Tenant API-key flows live on Integration API (7080 via HAProxy).
      EZKEY_ADMIN_API_URL: http://haproxy-integration:7080
    volumes:
      - demo-app-acme-data-ha:/app/data
      - demo-app-acme-config-ha:/app/config
    ports:
      - "8082:8082"
    networks:
      - ezkey-network-ha
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  # CLI Test Container
  cli-test:
    build:
      context: ..
      dockerfile: docker/cli-test/Dockerfile
    container_name: ezkey-cli-test-ha
    depends_on:
      haproxy-admin:
        condition: service_healthy
      haproxy-auth:
        condition: service_healthy
      crypto-api:
        condition: service_healthy
    environment:
      <<: *container-tz
      EZKEY_ADMIN_API_URL: http://haproxy-admin:9080
      EZKEY_ADMIN_HEALTH_URL: http://haproxy-admin:9081
      EZKEY_AUTH_API_URL: http://haproxy-auth:8080
      EZKEY_CRYPTO_API_URL: http://crypto-api:9090
    volumes:
      - cli-config:/home/ezkey/.ezkey
      - cli-work:/work
      - cli-bash-history:/home/ezkey
      - ../ezkey.json.docker-init:/tmp/ezkey.json.docker-init:ro
    working_dir: /work
    command: tail -f /dev/null
    stdin_open: true
    tty: true
    networks:
      - ezkey-network-ha
    restart: unless-stopped

  # Bootstrap Init (runs after all services are healthy)
  bootstrap-init:
    build:
      context: ..
      dockerfile: docker/bootstrap-init/Dockerfile
    container_name: ezkey-bootstrap-init-ha
    depends_on:
      haproxy-admin:
        condition: service_healthy
      haproxy-auth:
        condition: service_healthy
      crypto-api:
        condition: service_healthy
      demo-device:
        condition: service_started
      demo-app-acme:
        condition: service_started
    environment:
      <<: *container-tz
      ADMIN_API_URL: http://haproxy-admin:9080
      AUTH_API_URL: http://haproxy-auth:8080
      CRYPTO_API_URL: http://crypto-api:9090
      EZKEY_BOOTSTRAP_INIT_ENABLED: ${EZKEY_BOOTSTRAP_INIT_ENABLED:-true}
    volumes:
      - bootstrap-artifacts-ha:/bootstrap
      - demo-device-data-ha:/app/data
      - demo-app-acme-data-ha:/app/acme-data
    networks:
      - ezkey-network-ha
    restart: "no"

networks:
  ezkey-network-ha:
    driver: bridge

volumes:
  postgres-data-ha:
  encryption-secrets-ha:
  demo-device-data-ha:
  demo-app-acme-data-ha:
  demo-app-acme-config-ha:
  bootstrap-artifacts-ha:
  cli-config:
  cli-work:
  cli-bash-history:
