# Project name for Docker Compose (appears as group name in Docker Desktop)
name: ezkey-native

# Enable BuildKit for Maven cache mount support
x-buildkit: &buildkit
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

# Log line timestamps in containers follow this zone (JVM, Postgres, shell). Default UTC.
x-container-tz: &container-tz
  TZ: ${TZ:-UTC}

services:
  postgres:
    image: postgres:18-alpine
    container_name: ezkey-postgres-native
    environment:
      <<: *container-tz
      POSTGRES_DB: ezkey_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ezkey
    volumes:
      - postgres-data-native:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ezkey-network
    restart: unless-stopped

  migration:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migration
    container_name: ezkey-migration-native
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ezkey
    networks:
      - ezkey-network
    restart: "no"

  admin-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: admin-api
    container_name: ezkey-admin-api
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ezkey
      EZKEY_ADMIN_INITIAL_USERNAME: admin.docker
      EZKEY_ADMIN_INITIAL_EMAIL: admin@ezkey.local
      EZKEY_ADMIN_INITIAL_FIRST_NAME: Admin
      EZKEY_ADMIN_INITIAL_LAST_NAME: Docker
      MANAGEMENT_SERVER_PORT: 9081
      EZKEY_DATABASE_PARTITION_SCHEDULER_CRON: "0 */20 * * * ?"
      EZKEY_QR_AUTH_BASE_URL: ${EZKEY_QR_AUTH_BASE_URL:-}
      EZKEY_ORGANIZATION_ABOUT_URL: ${EZKEY_ORGANIZATION_ABOUT_URL:-}
      EZKEY_ADMIN_MFA_BOOTSTRAP_CREDENTIALS_OUTPUT_MODE: ${EZKEY_ADMIN_MFA_BOOTSTRAP_CREDENTIALS_OUTPUT_MODE:-full}
    volumes:
      - encryption-secrets-native:/etc/ezkey
      - bootstrap-artifacts-native:/var/lib/ezkey/bootstrap
    ports:
      - "9080:9080"
      - "9081:9081"
    networks:
      - ezkey-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  auth-api:
    image: ezkey-auth-api-native:latest
    container_name: ezkey-auth-api-native
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-native}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ezkey
      MANAGEMENT_SERVER_PORT: 8085
      EZKEY_DEMO_MITM_SIGNATURE_ENABLED: ${EZKEY_DEMO_MITM_SIGNATURE_ENABLED:-true}
      EZKEY_QR_AUTH_BASE_URL: ${EZKEY_QR_AUTH_BASE_URL:-}
      EZKEY_ORGANIZATION_ABOUT_URL: ${EZKEY_ORGANIZATION_ABOUT_URL:-}
    volumes:
      - encryption-secrets-native:/etc/ezkey
    ports:
      - "8080:8080"
      - "8085:8085"
    networks:
      - ezkey-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  integration-api:
    image: ezkey-integration-api-native:latest
    container_name: ezkey-integration-api-native
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      admin-api:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-native}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ezkey_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ezkey
      MANAGEMENT_SERVER_PORT: 7081
    volumes:
      - encryption-secrets-native:/etc/ezkey
    ports:
      - "7080:7080"
      - "7081:7081"
    networks:
      - ezkey-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  demo-device:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: demo-device
    container_name: ezkey-demo-device-native
    depends_on:
      auth-api:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      EZKEY_AUTH_API_URL: http://auth-api:8080
    volumes:
      - demo-device-data-native:/app/data
    ports:
      - "8083:8083"
    networks:
      - ezkey-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  crypto-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: crypto-api
    container_name: ezkey-crypto-api-native
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      admin-api:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    volumes:
      - encryption-secrets-native:/etc/ezkey
    ports:
      - "9090:9090"
    networks:
      - ezkey-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  demo-app-acme:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: demo-app-acme
    container_name: ezkey-demo-app-acme-native
    depends_on:
      admin-api:
        condition: service_healthy
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/app/config/,optional:file:./config/
      EZKEY_ADMIN_API_URL: http://admin-api:9080
    volumes:
      - demo-app-acme-data-native:/app/data
      - demo-app-acme-config-native:/app/config
    ports:
      - "8082:8082"
    networks:
      - ezkey-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  cli-test:
    build:
      context: ..
      dockerfile: docker/cli-test/Dockerfile
    container_name: ezkey-cli-test-native
    depends_on:
      admin-api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
      crypto-api:
        condition: service_healthy
    environment:
      <<: *container-tz
      EZKEY_ADMIN_API_URL: http://admin-api:9080
      EZKEY_ADMIN_HEALTH_URL: http://admin-api:9081
      EZKEY_AUTH_API_URL: http://auth-api:8080
      EZKEY_CRYPTO_API_URL: http://crypto-api:9090
    volumes:
      - cli-config:/home/ezkey/.ezkey
      - cli-work:/work
      - cli-bash-history:/home/ezkey
      - ../ezkey.json.docker-init:/tmp/ezkey.json.docker-init:ro
    working_dir: /work
    command: tail -f /dev/null
    stdin_open: true
    tty: true
    networks:
      - ezkey-network
    restart: unless-stopped

  bootstrap-init:
    build:
      context: ..
      dockerfile: docker/bootstrap-init/Dockerfile
    container_name: ezkey-bootstrap-init-native
    depends_on:
      admin-api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
      crypto-api:
        condition: service_healthy
      demo-device:
        condition: service_started
    environment:
      <<: *container-tz
      ADMIN_API_URL: http://admin-api:9080
      AUTH_API_URL: http://auth-api:8080
      CRYPTO_API_URL: http://crypto-api:9090
      EZKEY_BOOTSTRAP_INIT_ENABLED: ${EZKEY_BOOTSTRAP_INIT_ENABLED:-true}
    volumes:
      - bootstrap-artifacts-native:/bootstrap
      - demo-device-data-native:/app/data
      - demo-app-acme-data-native:/app/acme-data
    networks:
      - ezkey-network
    restart: "no"

networks:
  ezkey-network:
    driver: bridge

volumes:
  postgres-data-native:
  demo-device-data-native:
  demo-app-acme-data-native:
  demo-app-acme-config-native:
  encryption-secrets-native:
  bootstrap-artifacts-native:
  cli-config:
  cli-work:
  cli-bash-history:
