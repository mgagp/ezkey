global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout check 3s

# Statistics page for monitoring
listen stats
    bind *:9081
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE

# Frontend for Admin API
frontend admin_frontend
    bind *:9080
    default_backend admin_backend
    option forwardfor

# Backend for Admin API instances
backend admin_backend
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    http-check expect string "UP"
    
    # Admin API Instance 1
    server admin-api-1 admin-api-1:9080 check inter 5s fall 2 rise 2
    
    # Admin API Instance 2
    server admin-api-2 admin-api-2:9080 check inter 5s fall 2 rise 2
