global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout check 3s

# Frontend for Admin API
frontend admin_frontend
    bind *:9080
    default_backend admin_backend
    option forwardfor

# Statistics page for monitoring (on separate port)
frontend stats
    bind *:9081
    stats enable
    stats uri /stats
    stats refresh 10s
    # Stats are read-only (no admin actions)
    # For production: add 'stats auth user:pass' and 'stats admin if TRUE' with proper ACL
    # Use a dummy backend (stats page doesn't need real backend)
    default_backend stats_backend

# Backend for Admin API instances
backend admin_backend
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    http-check expect string "UP"
    
    # Admin API Instance 1
    server admin-api-1 admin-api-1:9080 check port 9081 inter 5s fall 2 rise 2
    
    # Admin API Instance 2
    server admin-api-2 admin-api-2:9080 check port 9081 inter 5s fall 2 rise 2

# Dummy backend for stats (not used, but required by HAProxy)
backend stats_backend
    # This backend is never actually used - stats page handles all requests
    option httpchk GET /
    server dummy 127.0.0.1:1 check disabled
