global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    # Align with Admin/Integration HAProxy (device flows are usually short; keep headroom).
    timeout client 180s
    timeout server 180s
    timeout check 3s

# Frontend for Auth API
frontend auth_frontend
    bind *:8080
    default_backend auth_backend
    # Strip client-controlled IP headers and set XFF to the immediate peer only (#1140).
    # Apps walk XFF right-to-left against EZKEY_TRUSTED_PROXIES_CIDRS.
    http-request del-header CF-Connecting-IP
    http-request del-header X-Real-IP
    http-request set-header X-Forwarded-For %[src]

# Statistics page for monitoring (on separate port)
frontend stats
    bind *:8085
    stats enable
    stats uri /stats
    stats refresh 10s
    # Stats are read-only (no admin actions)
    # For production: add 'stats auth user:pass' and 'stats admin if TRUE' with proper ACL
    # Use a dummy backend (stats page doesn't need real backend)
    default_backend stats_backend

# Backend for Auth API instances
backend auth_backend
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    http-check expect string "UP"

    # Auth API Instance 1 (health on management port 8085)
    server auth-api-1 auth-api-1:8080 check port 8085 inter 5s fall 2 rise 2

    # Auth API Instance 2
    server auth-api-2 auth-api-2:8080 check port 8085 inter 5s fall 2 rise 2

# Dummy backend for stats (not used, but required by HAProxy)
backend stats_backend
    # This backend is never actually used - stats page handles all requests
    option httpchk GET /
    server dummy 127.0.0.1:1 check disabled
