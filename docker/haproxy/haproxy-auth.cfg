global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout check 3s

# Statistics page for monitoring
listen stats
    bind *:8081
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE

# Frontend for Auth API
frontend auth_frontend
    bind *:8080
    default_backend auth_backend
    option forwardfor

# Backend for Auth API instances
backend auth_backend
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    http-check expect string "UP"
    
    # Auth API Instance 1
    server auth-api-1 auth-api-1:8080 check inter 5s fall 2 rise 2
    
    # Auth API Instance 2
    server auth-api-2 auth-api-2:8080 check inter 5s fall 2 rise 2
