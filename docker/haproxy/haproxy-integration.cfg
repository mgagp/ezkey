global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    # Long enough for Integration API auth-attempt wait (long-poll).
    timeout client 180s
    timeout server 180s
    timeout check 3s

# Frontend for Integration API
frontend integration_frontend
    bind *:7080
    default_backend integration_backend
    option forwardfor

# Statistics page for monitoring (on separate port)
frontend stats
    bind *:7081
    stats enable
    stats uri /stats
    stats refresh 10s
    # Stats are read-only (no admin actions)
    # For production: add 'stats auth user:pass' and 'stats admin if TRUE' with proper ACL
    default_backend stats_backend

# Backend for Integration API instances
backend integration_backend
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    http-check expect string "UP"

    # Integration API Instance 1 (health on management port 7081)
    server integration-api-1 integration-api-1:7080 check port 7081 inter 5s fall 2 rise 2

    # Integration API Instance 2
    server integration-api-2 integration-api-2:7080 check port 7081 inter 5s fall 2 rise 2

# Dummy backend for stats (not used, but required by HAProxy)
backend stats_backend
    option httpchk GET /
    server dummy 127.0.0.1:1 check disabled
