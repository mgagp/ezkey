# Gate-only HA memory overlay. Applied when quality-gate.sh sets
# EZKEY_COMPOSE_EXTRA_FILES to this file. Does not change product compose defaults.
#
# Bounds each API JVM so ~8 replicas cannot claim uncapped heap (default HotSpot
# MaxRAMPercentage ≈ 25% of host) on a 15–16 Gi cloud VM.

# MaxRAMPercentage≈60 so heap OOM vs cgroup kill can be distinguished.
# NativeMemoryTracking=summary enables jcmd VM.native_memory when jcmd is in the image.
x-java-tool: &java-tool
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError -XX:NativeMemoryTracking=summary"

services:
  admin-api-1:
    mem_limit: 1100m
    mem_reservation: 256m
    environment:
      <<: *java-tool
  admin-api-2:
    mem_limit: 1100m
    mem_reservation: 256m
    environment:
      <<: *java-tool
  auth-api-1:
    mem_limit: 1100m
    mem_reservation: 256m
    environment:
      <<: *java-tool
  auth-api-2:
    mem_limit: 1100m
    mem_reservation: 256m
    environment:
      <<: *java-tool
  integration-api-1:
    mem_limit: 1100m
    mem_reservation: 256m
    environment:
      <<: *java-tool
  integration-api-2:
    mem_limit: 1100m
    mem_reservation: 256m
    environment:
      <<: *java-tool
  crypto-api:
    mem_limit: 768m
    mem_reservation: 192m
    environment:
      <<: *java-tool
  demo-device:
    mem_limit: 768m
    mem_reservation: 192m
    environment:
      <<: *java-tool
  demo-app-acme:
    mem_limit: 768m
    mem_reservation: 192m
    environment:
      <<: *java-tool
