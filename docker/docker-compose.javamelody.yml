# Local Docker JavaMelody collector overlay (DEV / troubleshooting only).
#
# Enables JavaMelody on Admin / Auth / Integration API management ports and runs the
# official collector WAR. Crypto API is intentionally excluded.
#
# Usage (prefer the flag):
#   ./ezkey-tests/clean-start.sh --with-java-melody
#   EZKEY_ENABLE_JAVA_MELODY=true ./docker/start.sh
#
# Collector UI: http://localhost:8088
# Per-API reports remain on management ports: 9081 / 8085 / 7081 /actuator/monitoring
#
# Init parameters: SPRING_APPLICATION_JSON with hyphenated Parameter codes.
# Shared locks: docker/javamelody/init-parameters.base.json (checked by
# scripts/ops/check-javamelody-spring-json.sh). This overlay *replaces* any
# SPRING_APPLICATION_JSON set elsewhere (Compose last-wins on that key).
# Plain JAVAMELODY_INIT_PARAMETERS_* env map keys are silently ignored by JavaMelody
# after Spring relaxed binding (#847 Christophe runtime proof).

x-javamelody-env: &javamelody-env
  JAVAMELODY_ENABLED: "true"
  JAVAMELODY_MANAGEMENT_ENDPOINT_MONITORING_ENABLED: "true"
  JAVAMELODY_SPRING_MONITORING_ENABLED: "true"
  # Match community posture: no metrics/threaddump/info on the management surface.
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,monitoring"
  MANAGEMENT_ENDPOINT_MONITORING_ACCESS: unrestricted

# Shared init-parameter JSON fragment (application-name filled per service).
# Keep as one JSON object so the Map binds with exact hyphenated keys.
x-jm-init-admin: &jm-init-admin
  SPRING_APPLICATION_JSON: >-
    {"javamelody":{"init-parameters":{"system-actions-enabled":"false","csrf-protection-enabled":"true","update-check-disabled":"true","log":"false","http-transform-pattern":"[0-9a-fA-F]{8}-[0-9a-fA-F-]{27}|\\d+","obsolete-graphs-days":"30","obsolete-stats-days":"30","application-name":"admin-api"}}}

x-jm-init-auth: &jm-init-auth
  SPRING_APPLICATION_JSON: >-
    {"javamelody":{"init-parameters":{"system-actions-enabled":"false","csrf-protection-enabled":"true","update-check-disabled":"true","log":"false","http-transform-pattern":"[0-9a-fA-F]{8}-[0-9a-fA-F-]{27}|\\d+","obsolete-graphs-days":"30","obsolete-stats-days":"30","application-name":"auth-api"}}}

x-jm-init-integration: &jm-init-integration
  SPRING_APPLICATION_JSON: >-
    {"javamelody":{"init-parameters":{"system-actions-enabled":"false","csrf-protection-enabled":"true","update-check-disabled":"true","log":"false","http-transform-pattern":"[0-9a-fA-F]{8}-[0-9a-fA-F-]{27}|\\d+","obsolete-graphs-days":"30","obsolete-stats-days":"30","application-name":"integration-api"}}}

services:
  admin-api:
    environment:
      <<: [*javamelody-env, *jm-init-admin]

  auth-api:
    environment:
      <<: [*javamelody-env, *jm-init-auth]

  integration-api:
    environment:
      <<: [*javamelody-env, *jm-init-integration]

  javamelody-collector:
    build:
      context: ./javamelody
      dockerfile: Dockerfile
      args:
        JAVAMELODY_VERSION: "2.9.0"
    container_name: ezkey-javamelody-collector
    depends_on:
      admin-api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
      integration-api:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./javamelody/applications.properties:/opt/javamelody/applications.properties:ro
      - javamelody-data:/tmp/javamelody
    ports:
      # Loopback only — same bind posture as HA / community (#846).
      - "127.0.0.1:8088:8080"
    networks:
      - ezkey-network
    restart: unless-stopped

volumes:
  javamelody-data:
