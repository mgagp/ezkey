# Local Docker diagnostics override for HA.
#
# Publishes per-instance management/Actuator ports to the host so you can inspect
# auth-api-1 vs auth-api-2 and admin-api-1 vs admin-api-2 independently.
#
# IMPORTANT:
# - Do not use this override in staging or production.
# - Avoid host port collisions with HAProxy stats ports (8081 and 9081).
#
# Usage:
#   # Windows PowerShell
#   $env:SPRING_PROFILES_ACTIVE="docker-dev"; docker compose -f docker\docker-compose.ha.yml -f docker\docker-compose.ha.docker-dev.yml up -d
#
#   # Linux/Mac
#   SPRING_PROFILES_ACTIVE=docker-dev docker compose -f docker/docker-compose.ha.yml -f docker/docker-compose.ha.docker-dev.yml up -d

services:
  auth-api-1:
    ports:
      - "18081:8081"
  auth-api-2:
    ports:
      - "28081:8081"

  admin-api-1:
    ports:
      - "19081:9081"
  admin-api-2:
    ports:
      - "29081:9081"

