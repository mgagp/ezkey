# Install the Android NDK pinned in ezkey_mobile/android/build.gradle (ndkVersion), from the
# Actions cache when warm, otherwise with sdkmanager and a bounded retry (#1403).
#
# Without it, Gradle downloads the NDK on every run; that download timed out or failed with
# "Error reading Zip content" often enough to cost manual re-runs.
#
# Run after android-actions/setup-android (needs ANDROID_HOME and sdkmanager on PATH).
# The cache is saved right after a successful install, so a later failure in the job still
# leaves it warm. Caches saved on main are readable by every PR; a PR's own save stays in it.
name: Android NDK (cached)
description: Restore or install the NDK version pinned in ezkey_mobile/android/build.gradle.

runs:
  using: composite
  steps:
    - name: Resolve NDK version and path
      id: ndk
      shell: bash
      run: |
        version="$(sed -n 's/^[[:space:]]*ndkVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' ezkey_mobile/android/build.gradle)"
        if [ -z "$version" ]; then
          echo "::error::ndkVersion not found in ezkey_mobile/android/build.gradle"
          exit 1
        fi
        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [ -z "$sdk" ]; then
          echo "::error::ANDROID_HOME is not set; run android-actions/setup-android first"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "dir=$sdk/ndk/$version" >> "$GITHUB_OUTPUT"

    - name: Restore NDK cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.ndk.outputs.dir }}
        key: ${{ runner.os }}-android-ndk-${{ steps.ndk.outputs.version }}

    - name: Install NDK with retry
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        NDK_VERSION: ${{ steps.ndk.outputs.version }}
        NDK_DIR: ${{ steps.ndk.outputs.dir }}
      run: |
        # Three attempts, each capped at 10 minutes so a stalled download cannot eat the job timeout.
        for attempt in 1 2 3; do
          echo "Installing ndk;${NDK_VERSION} (attempt ${attempt}/3)"
          if timeout 600 sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null \
            && grep -q "^Pkg.Revision *= *${NDK_VERSION}$" "${NDK_DIR}/source.properties" 2>/dev/null; then
            echo "NDK ${NDK_VERSION} installed in ${NDK_DIR}"
            exit 0
          fi
          echo "::warning::NDK install attempt ${attempt} failed; removing partial files"
          rm -rf "${NDK_DIR}"
          [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
        done
        echo "::error::NDK ${NDK_VERSION} install failed after 3 attempts"
        exit 1

    - name: Save NDK cache
      if: steps.restore.outputs.cache-hit != 'true'
      # A parallel job may have saved the same key first; that is not a failure.
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.ndk.outputs.dir }}
        key: ${{ steps.restore.outputs.cache-primary-key }}
