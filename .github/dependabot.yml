# Dependabot configuration for automated dependency update PRs.
# See also: product-docs/global/normative-posture.md (dependency hygiene as operational discipline).
# Cadence + cooldown policy: product-docs/global/hygiene/dependabot/README.md
# Curation skill: .cursor/skills/dependabot-curated/SKILL.md

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    # Supply-chain guard: wait after publish before opening version-update PRs.
    # Security updates are not delayed. Schema: default-days + semver-*-days (1–90).
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      maven-spotbugs:
        patterns:
          - "com.github.spotbugs:*"
          - "com.github.spotbugs.snom:*"
      maven-checkstyle:
        patterns:
          - "com.puppycrawl.tools:checkstyle"
          - "org.apache.maven.plugins:maven-checkstyle-plugin"
      maven-rewrite:
        patterns:
          - "org.openrewrite.maven:*"
          - "org.openrewrite:*"

  - package-ecosystem: "npm"
    directory: "/ezkey-admin-ui"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      admin-ui-eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
      admin-ui-typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"
      admin-ui-vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"

  - package-ecosystem: "npm"
    directory: "/ezkey-sdk/javascript"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  # Yarn 4 workspace (packageManager: yarn@4.x). Dependabot npm ecosystem updates
  # package.json + yarn.lock. Keep RN-core / vision-camera / Orval out of tooling batches —
  # see skill dependabot-curated § Mobile RN pulse. Do not group orval (solo PRs → Orval risk grid).
  # mobile-tooling excludes eslint / jest (ungrouped) — RN deps:monitor gates.
  - package-ecosystem: "npm"
    directory: "/ezkey_mobile"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # ESLint / Jest majors stay ungrouped (visible solo PRs). RN preset gates
      # (`yarn deps:monitor`) block ESLint 10 / Jest 30; do not batch them with
      # Babel/Prettier patches. See product-docs/.../hygiene/dependabot/README.md.
      mobile-tooling:
        patterns:
          - "prettier"
          - "prettier-*"
          - "husky"
          - "lint-staged"
          - "typescript"
          - "@babel/*"
      mobile-rn-core:
        patterns:
          - "react"
          - "react-native"
          - "react-test-renderer"
          - "@types/react"
          - "@types/react-test-renderer"
          - "@react-native/babel-preset"
          - "@react-native/eslint-config"
          - "@react-native/jest-preset"
          - "@react-native/metro-config"
          - "@react-native/typescript-config"
          - "@react-native-community/cli*"
      mobile-vision-camera:
        patterns:
          - "react-native-vision-camera"
          - "react-native-vision-camera-*"
          - "react-native-worklets"
          - "react-native-nitro-*"
      mobile-navigation:
        patterns:
          - "@react-navigation/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/ezkey-cli-python"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
