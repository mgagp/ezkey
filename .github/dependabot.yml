# Dependabot configuration for automated dependency update PRs.
# See also: product-docs/global/normative-posture.md (dependency hygiene as operational discipline).
# Cadence + cooldown policy: product-docs/global/hygiene/dependabot/README.md
# Curation skill: .cursor/skills/dependabot-curated/SKILL.md

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    # Supply-chain guard: wait after publish before opening version-update PRs.
    # Security updates are not delayed. Schema: default-days + semver-*-days (1–90).
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      maven-spotbugs:
        patterns:
          - "com.github.spotbugs:*"
          - "com.github.spotbugs.snom:*"
      maven-checkstyle:
        patterns:
          - "com.puppycrawl.tools:checkstyle"
          - "org.apache.maven.plugins:maven-checkstyle-plugin"
      maven-rewrite:
        patterns:
          - "org.openrewrite.maven:*"
          - "org.openrewrite:*"

  - package-ecosystem: "npm"
    directory: "/ezkey-admin-ui"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Keep @types/node on the same major as the runtime in root .nvmrc (Node 24 LTS).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      admin-ui-eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
      admin-ui-typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"
      admin-ui-vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"

  - package-ecosystem: "npm"
    directory: "/ezkey-sdk/javascript"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Keep @types/node on the same major as the runtime in root .nvmrc (Node 24 LTS).
    # SDK package engines (>=14) stay unchanged — types track the repo toolchain, not the publish floor.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Yarn 4 workspace (packageManager: yarn@4.x). Dependabot npm ecosystem updates
  # package.json + yarn.lock. Keep RN-core / vision-camera / Orval out of tooling batches —
  # see skill dependabot-curated § Mobile RN pulse. Do not group orval (solo PRs → Orval risk grid).
  # mobile-tooling excludes eslint / jest (ungrouped) — RN deps:monitor gates.
  - package-ecosystem: "npm"
    directory: "/ezkey_mobile"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # ESLint / Jest majors stay ungrouped (visible solo PRs). RN preset gates
      # (`yarn deps:monitor`) block ESLint 10 / Jest 30; do not batch them with
      # Babel/Prettier patches. See product-docs/.../hygiene/dependabot/README.md.
      mobile-tooling:
        patterns:
          - "prettier"
          - "prettier-*"
          - "husky"
          - "lint-staged"
          - "typescript"
          - "@babel/*"
      mobile-rn-core:
        patterns:
          - "react"
          - "react-native"
          - "react-test-renderer"
          - "@types/react"
          - "@types/react-test-renderer"
          - "@react-native/babel-preset"
          - "@react-native/eslint-config"
          - "@react-native/jest-preset"
          - "@react-native/metro-config"
          - "@react-native/typescript-config"
          - "@react-native-community/cli*"
      mobile-vision-camera:
        patterns:
          - "react-native-vision-camera"
          - "react-native-vision-camera-*"
          - "react-native-worklets"
          - "react-native-nitro-*"
      mobile-navigation:
        patterns:
          - "@react-navigation/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # github-actions supports default-days only (no semver-*-days in Dependabot schema).
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/ezkey-cli-python"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  # -------------------------------------------------------------------------
  # Wave 0.3 — close Dependabot coverage gaps (security hygiene, config only).
  # Weekly + minor/patch groups keep PR volume low for a solo maintainer.
  # docker / docker-compose / gradle: version bumps only — they do not emit
  # Dependabot CVE alerts. Container image CVE scanning is planned separately.
  # -------------------------------------------------------------------------

  # Methodology micro-site (adm-zip, express, marked, …). Was missing; a
  # Dependabot security update for this folder failed without a version-updates
  # entry. package-lock.json is gitignored, so alerts cover direct dependencies
  # only (transitives invisible); committing the lockfile would close that gap
  # (do not commit it in this PR).
  - package-ecosystem: "npm"
    directory: "/product-docs/site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      product-docs-site-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Android native deps (conscrypt-android, androidx.biometric, play app-update).
  # settings.gradle uses includeBuild("../node_modules/@react-native/gradle-plugin"),
  # so Dependabot Gradle resolution may be partial. Version updates only.
  # Known gap: native Android CVE alerts are not produced — the dependency graph
  # does not capture these Gradle deps (automatic Gradle submission declined for
  # the same includeBuild / node_modules coupling).
  # AGP / Kotlin / gradle-wrapper follow React Native upgrades, never Dependabot;
  # react-android, hermes, and autolinked modules are not visible to Dependabot.
  - package-ecosystem: "gradle"
    directory: "/ezkey_mobile/android"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "gradle-wrapper"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      android-gradle-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Dockerfile base images with parseable registry tags (alpine, node,
  # eclipse-temurin, playwright, …). Version bumps only — not CVE alerts.
  # Omitted: /ezkey-pam (FROM ${ROCKY_IMAGE} — ARG not parsed) and
  # /ezkey-auth-api (local ezkey-auth-api-native + busybox:latest floating tag).
  # Majors are a manual choice (Java/Node LTS, Postgres data, HAProxy LTS):
  # single-number tags (25-jre-alpine, 22-alpine, 18-alpine) only receive majors
  # (temurin→27 non-LTS, node→26 vs .nvmrc 24, postgres 19 breaks data, haproxy→3.x).
  - package-ecosystem: "docker"
    directories:
      - "/docker"
      - "/docker/bootstrap-init"
      - "/docker/javamelody"
      - "/ezkey-admin-ui/docker"
    schedule:
      interval: "weekly"
    # docker supports default-days only (no semver-*-days in Dependabot).
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Compose service images with registry tags (postgres, caddy, haproxy, …).
  # Version bumps only — not CVE alerts. Dependabot's pattern already covers
  # docker-compose.*.yml in each listed directory (e.g. docker-compose.ha.yml,
  # docker-compose.with-proxy.yml under /docker).
  # Omitted (build: only, local tags, or env override with no image:):
  # /ezkey-admin-ui, /ezkey-pam, /experimental-hybrid/local, /scripts/lab.
  # Majors are a manual choice (Java/Node LTS, Postgres data, HAProxy LTS).
  - package-ecosystem: "docker-compose"
    directories:
      - "/docker"
      - "/experimental-hybrid/lightsail"
    schedule:
      interval: "weekly"
    # docker-compose supports default-days only (no semver-*-days in Dependabot).
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      compose-images-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
