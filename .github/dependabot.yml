# Dependabot configuration for automated dependency update PRs.
# See also: docs/SOC2_QUICK_START.md (Day 1–2: GitHub Security Features).

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      maven-spotbugs:
        patterns:
          - "com.github.spotbugs:*"
          - "com.github.spotbugs.snom:*"
      maven-checkstyle:
        patterns:
          - "com.puppycrawl.tools:checkstyle"
          - "org.apache.maven.plugins:maven-checkstyle-plugin"
      maven-rewrite:
        patterns:
          - "org.openrewrite.maven:*"
          - "org.openrewrite:*"

  - package-ecosystem: "npm"
    directory: "/ezkey-admin-ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      admin-ui-eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
      admin-ui-typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"
      admin-ui-vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"

  - package-ecosystem: "npm"
    directory: "/ezkey-sdk/javascript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/ezkey-cli-python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
