# Dependabot configuration for automated dependency update PRs.
# See also: product-docs/global/normative-posture.md (dependency hygiene as operational discipline).

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      maven-spotbugs:
        patterns:
          - "com.github.spotbugs:*"
          - "com.github.spotbugs.snom:*"
      maven-checkstyle:
        patterns:
          - "com.puppycrawl.tools:checkstyle"
          - "org.apache.maven.plugins:maven-checkstyle-plugin"
      maven-rewrite:
        patterns:
          - "org.openrewrite.maven:*"
          - "org.openrewrite:*"

  - package-ecosystem: "npm"
    directory: "/ezkey-admin-ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      admin-ui-eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
      admin-ui-typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"
      admin-ui-vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"

  - package-ecosystem: "npm"
    directory: "/ezkey-sdk/javascript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # Yarn 4 workspace (packageManager: yarn@4.x). Dependabot npm ecosystem updates
  # package.json + yarn.lock. Keep RN-core / vision-camera / Orval out of tooling batches —
  # see skill dependabot-curated § Mobile RN pulse. Do not group orval (solo PRs → T4).
  - package-ecosystem: "npm"
    directory: "/ezkey_mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      mobile-tooling:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "prettier"
          - "prettier-*"
          - "eslint-config-prettier"
          - "husky"
          - "lint-staged"
          - "jest"
          - "@types/jest"
          - "typescript"
          - "@babel/*"
      mobile-rn-core:
        patterns:
          - "react"
          - "react-native"
          - "react-test-renderer"
          - "@types/react"
          - "@types/react-test-renderer"
          - "@react-native/babel-preset"
          - "@react-native/eslint-config"
          - "@react-native/jest-preset"
          - "@react-native/metro-config"
          - "@react-native/typescript-config"
          - "@react-native-community/cli*"
      mobile-vision-camera:
        patterns:
          - "react-native-vision-camera"
          - "react-native-vision-camera-*"
          - "react-native-worklets"
          - "react-native-nitro-*"
      mobile-navigation:
        patterns:
          - "@react-navigation/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/ezkey-cli-python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
