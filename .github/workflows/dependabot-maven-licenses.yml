# Regenerate root THIRD-PARTY.txt on Dependabot PRs that touch Maven POMs
# (Dependabot never regenerates it, so licenses-drift would go red and need a
# manual push). Decision: Marc 2026-11-02 (licenses drift stop).
#
# Token notes:
# - Dependabot-triggered `pull_request` runs get a read-only GITHUB_TOKEN unless the
#   workflow raises it via `permissions:` (allowed for Dependabot; no secrets exposed).
# - A push made with GITHUB_TOKEN does NOT retrigger `pull_request` workflows. We
#   therefore dispatch CI (`workflow_dispatch`, which GITHUB_TOKEN may trigger) on the
#   PR branch so the new head gets a `ci-gate` check run. The PR's checks tab shows the
#   dispatch run, not a pull_request run.
# - Only same-repo branches authored by dependabot[bot] are processed.
name: dependabot-maven-licenses

on:
  pull_request:
    branches: [main]
    paths:
      - "pom.xml"
      - "**/pom.xml"
      - "src/license/**"

permissions:
  contents: read

concurrency:
  group: dependabot-maven-licenses-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # Needed to dispatch ci.yml/codeql.yml because GITHUB_TOKEN pushes do not
      # retrigger pull_request CI.
      actions: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # generate-resources walks the multi-module reactor; child modules need
      # reactor jars installed. The licenses profile itself skips Checkstyle.
      - name: Install reactor (warm jars for generate-resources)
        run: mvn -B -ntp -Pno-checkstyle -DskipTests install

      - name: Regenerate THIRD-PARTY.txt
        run: mvn -B -ntp -Plicenses -DskipTests generate-resources

      - name: Commit and push if changed
        id: push
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- THIRD-PARTY.txt; then
            echo "THIRD-PARTY.txt already fresh."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THIRD-PARTY.txt
          git commit -m "chore(licenses): regenerate THIRD-PARTY.txt"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch CI on new head (GITHUB_TOKEN pushes do not retrigger pull_request)
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH}"
          gh workflow run codeql.yml --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH}" || \
            echo "::warning::codeql.yml has no workflow_dispatch; CodeQL check will be missing on the new head."
