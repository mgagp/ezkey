# ezkey_mobile: JS quality (yarn validate) + Android JVM unit tests (crypto).
#
# Triggers on PR/push when ezkey_mobile/ or this workflow changes.
# Uses Corepack so CI matches package.json "packageManager": "yarn@4.10.3"
# (setup-node must not use cache: yarn before Corepack — that invokes Yarn 1).
name: ezkey_mobile unit tests

on:
  push:
    branches: [main, master]
    paths:
      - 'ezkey_mobile/**'
      - '.github/workflows/ezkey-mobile-unit-tests.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'ezkey_mobile/**'
      - '.github/workflows/ezkey-mobile-unit-tests.yml'

concurrency:
  group: ezkey-mobile-unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  js-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.4'

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Cache Yarn (Berry)
        uses: actions/cache@v6
        with:
          path: |
            ezkey_mobile/.yarn/cache
          key: ${{ runner.os }}-ezkey-mobile-yarn-${{ hashFiles('ezkey_mobile/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-ezkey-mobile-yarn-

      - name: Install ezkey_mobile dependencies
        working-directory: ezkey_mobile
        run: yarn install --immutable

      - name: yarn validate
        working-directory: ezkey_mobile
        run: yarn validate:ci

  android-jvm-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.4'

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Cache Yarn (Berry)
        uses: actions/cache@v6
        with:
          path: |
            ezkey_mobile/.yarn/cache
          key: ${{ runner.os }}-ezkey-mobile-yarn-${{ hashFiles('ezkey_mobile/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-ezkey-mobile-yarn-

      - name: Install ezkey_mobile dependencies
        working-directory: ezkey_mobile
        run: yarn install --immutable

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Run Android unit tests
        working-directory: ezkey_mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ezkey-mobile-unit-test-report
          path: ezkey_mobile/android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
