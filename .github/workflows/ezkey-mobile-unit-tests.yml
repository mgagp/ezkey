# ezkey_mobile: JS quality (yarn validate) + Android JVM unit tests (crypto).
name: ezkey_mobile unit tests

on:
  push:
    branches: [main, master]
    paths:
      - 'ezkey_mobile/**'
      - '.github/workflows/ezkey-mobile-unit-tests.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'ezkey_mobile/**'
      - '.github/workflows/ezkey-mobile-unit-tests.yml'

defaults:
  run:
    shell: bash

jobs:
  js-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.4'
          cache: 'yarn'
          cache-dependency-path: ezkey_mobile/yarn.lock

      - name: Install ezkey_mobile dependencies
        run: |
          cd ezkey_mobile
          yarn install --immutable

      - name: yarn validate
        run: |
          cd ezkey_mobile
          yarn validate:ci

  android-jvm-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.4'
          cache: 'yarn'
          cache-dependency-path: ezkey_mobile/yarn.lock

      - name: Install ezkey_mobile dependencies
        run: |
          cd ezkey_mobile
          yarn install --immutable

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Run Android unit tests
        run: |
          cd ezkey_mobile/android
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ezkey-mobile-unit-test-report
          path: ezkey_mobile/android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
