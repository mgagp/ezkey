# Run ezkey_mobile Android unit tests (crypto: IntegrationKeyVerifier).
# Runs testDebugUnitTest so that Kotlin crypto parsing and verification are validated on every change.
name: ezkey_mobile unit tests

on:
  push:
    branches: [main, master]
    paths:
      - 'ezkey_mobile/android/**'
      - 'ezkey_mobile/app/**'
      - '.github/workflows/ezkey-mobile-unit-tests.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'ezkey_mobile/android/**'
      - 'ezkey_mobile/app/**'
      - '.github/workflows/ezkey-mobile-unit-tests.yml'

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: ezkey_mobile/yarn.lock

      - name: Install ezkey_mobile dependencies
        run: |
          cd ezkey_mobile
          yarn install --immutable

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Run Android unit tests
        run: |
          cd ezkey_mobile/android
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ezkey-mobile-unit-test-report
          path: ezkey_mobile/android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
