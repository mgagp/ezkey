# Advanced CodeQL setup for mgagp/ezkey.
#
# Repository CodeQL is Advanced (default setup disabled 2026-10-14 with #805).
# Query suite: security-extended via .github/codeql/codeql-config.yml (restores
# coverage the former default setup had). See docs/SECURITY_POSTURE.md
# § Code scanning policy.
#
# Decision: code-scanning triage 2026-10-13, approved by Marc 2026-10-13 19:40.
#
# c-cpp: build-mode manual compiles ezkey-pam so pam_ezkey.c is extracted into
# the CodeQL database (build-mode none does not reliably scan compiled C).
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly catch-up (UTC Sunday 05:17) — same spirit as GitHub's default template.
    - cron: "17 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.language == 'c-cpp' && 360 || 120 }}
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # init language id is java-kotlin; SARIF category must be /language:java (DB language)
          # or the PR CodeQL check can go NEUTRAL ("configuration /language:java-kotlin not found").
          - language: java-kotlin
            build-mode: none
            category: /language:java
          - language: javascript-typescript
            build-mode: none
            category: /language:javascript-typescript
          - language: python
            build-mode: none
            category: /language:python
          - language: c-cpp
            build-mode: manual
            category: /language:c-cpp
          - language: actions
            build-mode: none
            category: /language:actions

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build ezkey-pam (C/C++ database)
        if: matrix.language == 'c-cpp'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libpam0g-dev libcurl4-openssl-dev libcjson-dev
          make -C ezkey-pam clean all

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: ${{ matrix.category }}
        env:
          # Advanced setup does NOT auto-detect `.github/codeql/extensions/`.
          # `packs:` in codeql-config.yml only accepts registry `scope/name` refs,
          # not filesystem paths. Load the local model pack the same way
          # codeql-action loads its generated pr-diff-range pack:
          #   --additional-packs = search path (parent of the pack directory)
          #   --extension-packs  = pack name from qlpack.yml (`ezkey/java-models`)
          # EXTRA_OPTIONS are appended after the action's own run-queries flags,
          # so pr-diff-range (when present) and this pack both appear on the CLI.
          # Java-kotlin only — the pack targets codeql/java-all.
          CODEQL_ACTION_EXTRA_OPTIONS: >-
            ${{ matrix.language == 'java-kotlin' &&
            format('{{"database":{{"run-queries":["--additional-packs={0}/.github/codeql/extensions","--extension-packs=ezkey/java-models"]}}}}', github.workspace)
            || '' }}
