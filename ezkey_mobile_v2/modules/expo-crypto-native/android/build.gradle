apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.cryptonative'
version = '1.0.0'

android {
  compileSdkVersion 34

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 34
    versionCode 1
    versionName "1.0.0"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.0'
  
  // Expo modules dependencies from the parent project
  implementation project(':expo-modules-core')
}
