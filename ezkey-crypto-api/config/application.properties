# Ezkey Crypto API - Default Configuration
# Local lab / clean-start only (ADR-0016 §2.5.1). Not deployed on Lightsail / ezkey.online.
spring.application.name=ezkey-crypto-api
server.port=8081

# IDE / default: dedicated management port on loopback only (E5 / ADR-0015 PR B).
# Docker uses 9090/9091 — see application-docker.properties.
management.server.port=8087
management.server.address=127.0.0.1
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.access=read-only
management.endpoint.health.show-details=never
# Split health (ADR-0016 Q1): liveness stays UP for keypair/sign even when encryption is not ready.
# Docker healthcheck uses /actuator/health/liveness. Encryption detail: /actuator/health/encryption.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=ping,livenessState
management.endpoint.health.group.encryption.include=tinkEncryption
management.health.defaults.enabled=false
management.health.db.enabled=false
management.health.diskspace.enabled=false
management.health.ping.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Distinct servlet session cookie on localhost multi-port stacks (#799).
server.servlet.session.cookie.name=EZKEY_CRYPTO_API_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${EZKEY_SERVLET_SESSION_COOKIE_SECURE:false}

# Logging Configuration
# org.springframework.web stays INFO so MVC DEBUG body dumps cannot leak DTO secrets (#752)
logging.level.org.ezkey=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=WARN

logging.level.org.springframework.data.jpa.repository=DEBUG
logging.level.org.springframework.boot.autoconfigure.domain=DEBUG

server.tomcat.threads.max=2
server.tomcat.threads.min-spare=2

# Flyway Migration (never run migrations from crypto-api)
spring.flyway.enabled=false

# Read-only DataSource for ezkey_keyset_blob SELECT (role ezkey_crypto). IDE defaults for local Postgres.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ezkey_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ezkey_crypto}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ezkey_crypto}
spring.datasource.driver-class-name=org.postgresql.Driver

# Minimal JPA (ddl owned by Flyway / ezkey_migrate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==============================================
# Encryption Configuration (Tink)
# ==============================================
# IMPORTANT: Path configuration is profile-specific
#
# Profiles:
#   - docker (default): Uses /etc/ezkey/secrets/master.key from Docker volume
#   - windows: Uses C:\ProgramData\ezkey\secrets\master.key from Windows local
#
# To activate a profile:
#   - Set SPRING_PROFILES_ACTIVE=windows (Windows)
#   - Set SPRING_PROFILES_ACTIVE=docker (Docker)
#   - Or pass: java -jar app.jar --spring.profiles.active=windows
#
# Generate master key:
#   Linux/Mac: sudo ./scripts/generate-master-key.sh
#   Windows: .\scripts\generate-master-key.ps1
#
# Note: Same master key must be used across admin-api, auth-api, and crypto-api

ezkey.encryption.enabled=true
ezkey.encryption.required=true
ezkey.encryption.algorithm=AES256_GCM

# Default encryption paths (WILL BE OVERRIDDEN by active profile)
# Default to Docker paths (most common deployment)
# Profile 'docker': Uses /etc/ezkey/secrets/master.key (Docker volume)
# Profile 'windows': Overrides to C:\ProgramData\ezkey\secrets\master.key
ezkey.encryption.master-key-file=/etc/ezkey/secrets/master.key
ezkey.encryption.keyset-file=/etc/ezkey/keysets/keyset.json.encrypted

# Keyset Storage Mode: DATABASE blob (ADR-0016); writer=false; never required=false
ezkey.encryption.keyset.writer=false
ezkey.encryption.keyset.degraded-mode-enabled=false
ezkey.encryption.keyset.max-reload-retries=3

# Key rotation configuration (DISABLED in Crypto API)
# Rotation jobs run ONLY in Admin API
ezkey.encryption.rotation.enabled=false
ezkey.encryption.reencryption.enabled=false
