# Ezkey Crypto API - Docker Configuration
spring.application.name=ezkey-sim-api
server.port=9090

# Logging Configuration (Production-friendly)
logging.level.org.ezkey=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.data.jpa.repository=WARN
logging.level.org.springframework.boot.autoconfigure.domain=WARN

# Server Configuration
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# Flyway Migration
spring.flyway.enabled=false

# Actuator Configuration (for health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.access=read-only
management.endpoint.health.show-details=never
management.health.defaults.enabled=false
management.health.db.enabled=false
management.health.diskspace.enabled=false
management.health.ping.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Exclude DataSource AutoConfiguration (Crypto API doesn't need database)
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
