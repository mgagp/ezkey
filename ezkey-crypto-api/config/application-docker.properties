# Ezkey Crypto API - Docker Configuration (local clean-start lab only; not Lightsail)
spring.application.name=ezkey-sim-api
server.port=9090

# Logging Configuration (Production-friendly)
logging.level.org.ezkey=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.data.jpa.repository=WARN
logging.level.org.springframework.boot.autoconfigure.domain=WARN

# Server Configuration
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# Flyway Migration (never run migrations from crypto-api)
spring.flyway.enabled=false

# Read-only DataSource — role ezkey_crypto, SELECT on ezkey_keyset_blob only
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ezkey_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ezkey_crypto}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ezkey_crypto}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Actuator on dedicated management port (compose publishes 127.0.0.1:9091).
# Override IDE default (127.0.0.1) so host publish and peers can reach the port (#905).
management.server.port=9091
management.server.address=0.0.0.0
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.access=read-only
management.endpoint.health.show-details=never
# Split health (ADR-0016 Q1): docker healthcheck → /actuator/health/liveness
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=ping,livenessState
management.endpoint.health.group.encryption.include=tinkEncryption
management.health.defaults.enabled=false
management.health.db.enabled=false
management.health.diskspace.enabled=false
management.health.ping.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Encryption — DATABASE blob, non-writer, required (never required=false)
ezkey.encryption.enabled=true
ezkey.encryption.required=true
ezkey.encryption.master-key-file=/etc/ezkey/secrets/master.key
ezkey.encryption.keyset-file=/etc/ezkey/keysets/keyset.json.encrypted
ezkey.encryption.algorithm=AES256_GCM
ezkey.encryption.keyset.storage-mode=DATABASE
ezkey.encryption.keyset.writer=false
ezkey.encryption.keyset.degraded-mode-enabled=false
ezkey.encryption.keyset.max-reload-retries=3
ezkey.encryption.rotation.enabled=false
ezkey.encryption.reencryption.enabled=false
