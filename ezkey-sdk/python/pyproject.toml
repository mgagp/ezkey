[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ezkey-python-sdk"
version = "1.0.0"
description = "Python SDK for Ezkey Admin and Auth APIs"
authors = [
    {name = "Ezkey Contributors", email = "info@ezkey.org"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["ezkey", "mfa", "authentication", "sdk"]
dependencies = [
    "requests>=2.25.0",
    "cryptography>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/mgagp/ezkey"
Repository = "https://github.com/mgagp/ezkey.git"
"Bug Tracker" = "https://github.com/mgagp/ezkey/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ezkey_sdk*"]

[tool.setuptools.package-data]
ezkey_sdk = ["py.typed"]