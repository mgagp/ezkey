# Ezkey Auth API - Test Configuration
spring.application.name=ezkey-auth-api-test
server.port=8080

# Database Configuration (will be overridden by TestContainers)
spring.datasource.url=jdbc:postgresql://localhost:5432/ezkey_test
spring.datasource.username=ezkey_test
spring.datasource.password=ezkey_test
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson Datetime Configuration
# spring.jackson.serialization.write-dates-as-timestamps=false (disabled for Spring Boot 4)
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'

# Flyway Migration (disabled - migrations run separately)
spring.flyway.enabled=false

# Disable Swagger in tests
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Logging Configuration (reduced for tests)
logging.level.org.ezkey=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.data.jpa.repository=WARN
logging.level.org.springframework.boot.autoconfigure.domain=WARN

# Auth API Rate Limiting (disabled for tests)
ezkey.auth.ratelimit.enabled=false
