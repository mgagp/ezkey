# Gate C1 (#912) — test-only Auth API rate-limit thresholds.
# Must stay in sync with docker-compose.ha.gate-c1-test.yml environment.
# Never referenced by deploy compose / .env files.
#
# Intent: enable ONLY Auth API respond budgets for
# AuthenticationFlowSecurityTest.testInvalidThirdPartyRespondDoesNotExhaustOwnerRateLimit.
# AdminRateLimitFilter stays OFF (docker-test profile unchanged on admin-api).
# Non-respond Auth budgets are raised so a mistaken whole-suite apply would not
# flood pending/bind/verify with 429s; this overlay still only tightens respond.

ezkey.rate-limit.enabled=true

# Post-ownership per authAttemptId budget (#912 C1).
ezkey.rate-limit.respond.requests=1
ezkey.rate-limit.respond.window-minutes=5
ezkey.rate-limit.respond.key-strategy=auth-attempt-id

# Fail-IP ceiling (all respond requests). High enough that the C1 sequence
# (third-party invalids + owner approve + HA probe) does not trip IP 429;
# ownership isolation is asserted via the per-id budget above.
ezkey.rate-limit.respond.fail-ip-requests=50
ezkey.rate-limit.respond.fail-ip-window-minutes=1

# Non-respond surfaces — tighten nothing relative to needing the suite; keep high.
ezkey.rate-limit.pending.requests=10000
ezkey.rate-limit.pending.window-minutes=1
ezkey.rate-limit.pending.key-strategy=enrollment-id
ezkey.rate-limit.verify.requests=10000
ezkey.rate-limit.verify.window-minutes=5
ezkey.rate-limit.verify.key-strategy=client-ip
ezkey.rate-limit.bind.requests=10000
ezkey.rate-limit.bind.window-minutes=5
ezkey.rate-limit.bind.key-strategy=client-ip
ezkey.rate-limit.backstop.enabled=true
ezkey.rate-limit.backstop.verify.requests=10000
ezkey.rate-limit.backstop.verify.window-minutes=5
ezkey.rate-limit.backstop.bind.requests=10000
ezkey.rate-limit.backstop.bind.window-minutes=5

# HA quality-gate runs two auth-api replicas with in-memory buckets (#918).
# C1 429 proof may need one consume per replica after the first ownership debit.
ezkey.gate-c1.auth-api-replicas=2
