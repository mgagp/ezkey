server.port=8083
spring.thymeleaf.cache=false

# Distinct from Acme (and other localhost servlet apps): browsers scope cookies by host,
# not port — shared JSESSIONID wiped Acme CSRF after visiting :8083 (#799).
server.servlet.session.cookie.name=EZKEY_DEVICE_SESSION

# Ezkey Auth API base URL
ezkey.auth.api.url=http://localhost:8080


