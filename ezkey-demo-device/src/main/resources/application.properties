server.port=8083
spring.thymeleaf.cache=false

# IDE / default: dedicated management port on loopback only (E5 / ADR-0015 PR B).
management.server.port=8084
management.server.address=127.0.0.1
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.access=read-only
management.endpoint.health.show-details=never

# Distinct from Acme (and other localhost servlet apps): browsers scope cookies by host,
# not port — shared JSESSIONID wiped Acme CSRF after visiting :8083 (#799).
server.servlet.session.cookie.name=EZKEY_DEVICE_SESSION

# Ezkey Auth API base URL
ezkey.auth.api.url=http://localhost:8080

# Host allowlist for QR authUrl / bind overrides (empty = host of ezkey.auth.api.url + localhost + 127.0.0.1)
# ezkey.demo-device.allowed-auth-api-hosts=localhost,127.0.0.1,auth-api

# Session claim expiresAt bound after pending pull (default matches ezkey.core.auth-attempt.ttl-seconds).
# ezkey.demo-device.claimed-pending-attempt-ttl=120s


