<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle}">Ezkey Demo Device</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <style>
    body { padding-top: 3rem; }
    .container-narrow { max-width: 720px; }
  </style>
  <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
  <script th:src="@{/webjars/alpinejs/dist/cdn.min.js}"></script>
  <link rel="stylesheet" href="/css/simple.css" />
  <script>
    function captureUrlAndLaunch(){
      const urlInput = document.getElementById('enrollUrl');
      if(!urlInput.value){ alert('Please paste an enrollment URL'); return; }
      sessionStorage.setItem('enrollmentUrl', urlInput.value);
      window.location.href = '/phone';
    }
  </script>
</head>
<body>
<main class="container container-narrow">
  <h1 class="mb-4">Ezkey Demo Device</h1>
  <p class="text-muted">Paste an Enrollment URL, then launch the phone simulator.</p>

  <div class="mb-3">
    <label for="enrollUrl" class="form-label">Enrollment URL</label>
    <input type="text" id="enrollUrl" class="form-control" placeholder="ezkey://enroll/..."></input>
  </div>

  <button class="btn btn-primary" onclick="captureUrlAndLaunch()">Launch Phone Simulator</button>
</main>
</body>
</html>
