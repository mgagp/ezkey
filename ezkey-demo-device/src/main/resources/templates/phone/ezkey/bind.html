<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enrollment - Bind</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
</head>
<body class="p-3">
  <div class="container">
    <h3 class="mb-3">Enrollment: Bind</h3>
    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}">Error</div>

    <div th:if="${error == null}">
      <p class="text-muted">Enrollment ID: <strong th:text="${enrollmentId}">1</strong></p>
      <div class="card mb-3">
        <div class="card-body">
          <h6 class="card-title">Bind response</h6>
          <div><strong>Integration Public Key:</strong></div>
          <pre class="small" th:text="${integrationPublicKey}">...</pre>
          <div><strong>Enrollment Proof Token:</strong></div>
          <pre class="small" th:text="${enrollmentProofToken}">...</pre>
        </div>
      </div>

      <form th:action="@{/phone/ezkey/enrollment/verify}" method="post" class="mt-3">
        <input type="hidden" name="enrollmentId" th:value="${enrollmentId}" />
        <div class="mb-3">
          <label class="form-label">Enter Challenge Code</label>
          <input type="text" name="challenge" class="form-control" placeholder="123456" required />
          <div class="form-text">Find the challenge code in the ACME demo console.</div>
        </div>
        <button type="submit" class="btn btn-primary">Verify</button>
      </form>
    </div>

    <div class="mt-3">
      <a href="/phone" class="btn btn-outline-secondary">Back</a>
    </div>
  </div>
</body>
</html>
