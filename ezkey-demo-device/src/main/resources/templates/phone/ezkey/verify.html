<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enrollment - Verify</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
</head>
<body class="p-3">
  <div class="container">
    <h3 class="mb-3">Enrollment: Verify</h3>
    <div th:if="${verifyResponse == null}" class="alert alert-danger">Verification failed or no response.</div>
    <div th:if="${verifyResponse != null}" class="alert alert-success">Enrollment verified.</div>

    <div class="mt-3">
      <a th:href="@{/phone/ezkey}" class="btn btn-primary">Go to Ezkey App</a>
      <a th:href="@{/phone}" class="btn btn-outline-secondary">Back to Phone</a>
    </div>
  </div>
</body>
</html>
