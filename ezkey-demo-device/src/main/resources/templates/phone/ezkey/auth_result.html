<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle}">Authentication Result</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background:#f2f2f2; padding:1.5rem; }
    .app-shell { width: 380px; height: 780px; border-radius: 36px; background:#0a0a0a; color:#f5f5f7; position: relative; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,.35); }
    .status-bar { position:absolute; top: 12px; left:0; right:0; padding: 0 16px; display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:.9rem; }
    .content { position:absolute; top: 52px; left:0; right:0; bottom: 0; display:flex; flex-direction:column; }
    .header { padding: 20px 16px 8px 16px; }
    .title { margin:0; font-size: 1.25rem; }
    .integration-info { 
      display: flex; 
      align-items: center; 
      margin-bottom: 16px; 
      padding: 12px 14px; 
      border-radius: 14px; 
      background: rgba(255,255,255,.06); 
      border: 1px solid rgba(255,255,255,.08); 
    }
    .integration-logo { 
      width: 48px; 
      height: 48px; 
      border-radius: 8px; 
      margin-right: 12px; 
      background: rgba(255,255,255,.1); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.2rem; 
      color: #ccc; 
    }
    .integration-details { flex: 1; }
    .integration-name { font-weight: 600; margin-bottom: 4px; }
    .integration-description { font-size: 0.85rem; color: #ccc; line-height: 1.2; }
    .result-card { 
      padding: 20px; 
      margin: 16px; 
      border-radius: 14px; 
      background: rgba(255,255,255,.06); 
      border: 1px solid rgba(255,255,255,.08); 
      text-align: center;
    }
    .result-icon { 
      font-size: 3rem; 
      margin-bottom: 16px; 
    }
    .result-success { color: #28a745; }
    .result-error { color: #dc3545; }
    .result-title { 
      font-size: 1.2rem; 
      font-weight: 600; 
      margin-bottom: 8px; 
    }
    .result-message { 
      font-size: 0.9rem; 
      color: #ccc; 
      line-height: 1.4; 
    }
    .btn-primary { 
      width: 100%; 
      padding: 12px 14px; 
      border-radius: 14px; 
      background: #0d6efd; 
      color: #fff; 
      border: none; 
      font-size: 1rem; 
      cursor: pointer; 
      margin: 8px 16px;
    }
    .btn-primary:hover { background: #0b5ed7; }
    .side-exit { position: absolute; right: -14px; top: 40%; width: 8px; height: 120px; background:#333; border-radius: 4px; cursor: pointer; }
  </style>
  <script>
    function goBack(){ window.location.href = '/phone/ezkey'; }
  </script>
</head>
<body>
  <div class="app-shell">
    <div class="status-bar">
      <div>Ezkey</div>
      <div>9:41</div>
    </div>
    <div class="content">
      <div class="header">
        <h1 class="title">Authentication Result</h1>
      </div>
      
      <!-- Integration Information -->
      <div class="px-3">
        <div class="integration-info">
          <div class="integration-logo">
            <img th:if="${integrationLogo}" th:src="${integrationLogo}" alt="Integration Logo" style="width: 100%; height: 100%; object-fit: cover; border-radius: 6px;">
            <span th:unless="${integrationLogo}">🔐</span>
          </div>
          <div class="integration-details">
            <div class="integration-name" th:text="${integrationName ?: 'Enrollment #' + enrollmentId}">Integration Name</div>
            <div class="integration-description" th:text="${integrationDescription ?: 'Authentication completed'}">Integration description</div>
          </div>
        </div>
      </div>
      
      <!-- Result Card -->
      <div class="result-card">
        <div th:if="${success}" class="result-icon result-success">✅</div>
        <div th:if="${error}" class="result-icon result-error">❌</div>
        
        <div class="result-title" th:text="${success ? 'Authentication Successful' : 'Authentication Failed'}">Result</div>
        <div class="result-message" th:text="${message ?: (error ?: 'Authentication response submitted')}">Result message</div>
      </div>
      
      <!-- Action Button -->
      <div class="mt-auto">
        <button class="btn-primary" onclick="goBack()">Back to Enrollments</button>
      </div>
    </div>
    <div class="side-exit" onclick="goBack()" title="Back"></div>
  </div>
</body>
</html>
