<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle}">Authentication Result</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background:#f2f2f2; padding:1.5rem; }
    .app-shell { width: 380px; height: 780px; border-radius: 36px; background:#0a0a0a; color:#f5f5f7; position: relative; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,.35); }
    .status-bar { position:absolute; top: 12px; left:0; right:0; padding: 0 16px; display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:.9rem; }
    .content { position:absolute; top: 52px; left:0; right:0; bottom: 0; display:flex; flex-direction:column; }
    .header { padding: 20px 16px 8px 16px; }
    .title { margin:0; font-size: 1.25rem; }
    .integration-info {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
    }
    .integration-logo {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      margin-right: 12px;
      background: rgba(255,255,255,.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #ccc;
    }
    .integration-details { flex: 1; }
    .integration-name { font-weight: 600; margin-bottom: 4px; }
    .integration-description { font-size: 0.85rem; color: #ccc; line-height: 1.2; }
    .result-card {
      padding: 20px;
      margin: 16px;
      border-radius: 14px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      text-align: center;
    }
    .result-icon { font-size: 3rem; margin-bottom: 16px; }
    .result-success { color: #28a745; }
    .result-denied { color: #dc3545; }
    .result-failed { color: #fd7e14; }
    .result-expired { color: #6c757d; }
    .result-inactive { color: #adb5bd; }
    .result-unconfirmed { color: #6c757d; }
    .result-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
    .result-message { font-size: 0.9rem; color: #ccc; line-height: 1.4; }
    .btn-primary {
      width: calc(100% - 32px);
      padding: 12px 14px;
      border-radius: 14px;
      background: #0d6efd;
      color: #fff;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      margin: 8px 16px;
      display: block;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn-primary:hover { background: #0b5ed7; color: #fff; }
    .side-exit { position: absolute; right: -14px; top: 40%; width: 8px; height: 120px; background:#333; border-radius: 4px; cursor: pointer; display: block; text-decoration: none; color: inherit; }
  </style>
</head>
<body>
  <div class="app-shell" data-testid="demo-device-auth-result">
    <div class="status-bar">
      <div>Ezkey</div>
      <div>9:41</div>
    </div>
    <div class="content">
      <div class="header">
        <h1 class="title">Authentication Result</h1>
      </div>

      <div class="px-3">
        <div class="integration-info">
          <div class="integration-logo">
            <img th:if="${integrationLogo}" th:src="${integrationLogo}" alt="Integration Logo" style="width: 100%; height: 100%; object-fit: cover; border-radius: 6px;">
            <span th:unless="${integrationLogo}">🔐</span>
          </div>
          <div class="integration-details">
            <div class="integration-name" th:text="${enrollmentName ?: integrationName ?: 'Enrollment #' + enrollmentId}">Enrollment Name</div>
            <div class="integration-description" th:text="${integrationDescription ?: 'Authentication completed'}">Integration description</div>
          </div>
        </div>
      </div>

      <div class="result-card" data-testid="demo-device-result-card" aria-live="polite" aria-atomic="true">
        <div th:if="${success}" data-testid="demo-device-result-success" class="result-icon result-success">✅</div>
        <div th:if="${denied}" data-testid="demo-device-result-denied" class="result-icon result-denied">❌</div>
        <div th:if="${failed}" data-testid="demo-device-result-failed" class="result-icon result-failed">⚠️</div>
        <div th:if="${expired}" data-testid="demo-device-result-expired" class="result-icon result-expired">⏰</div>
        <div th:if="${inactive}" data-testid="demo-device-result-inactive" class="result-icon result-inactive">○</div>
        <div th:if="${unconfirmed}" data-testid="demo-device-result-unconfirmed" class="result-icon result-unconfirmed">?</div>

        <div class="result-title"
             th:text="${success ? 'Authentication Successful' :
                        denied ? 'Authentication Denied' :
                        expired ? 'Authentication Expired' :
                        inactive ? 'Request no longer active' :
                        unconfirmed ? 'Confirmation not verified' :
                        failed ? 'Authentication Failed' :
                        'Authentication Result'}">
          Result
        </div>

        <div class="result-message"
             th:text="${message ?:
                        denied ? 'Authentication was denied by user' :
                        expired ? 'This request expired. Ask for a new sign-in.' :
                        inactive ? 'This request is no longer active.' :
                        unconfirmed ? 'Response sent, confirmation not verified; check the connection on the app side.' :
                        failed ? 'Authentication failed due to technical error' :
                        'Authentication response submitted'}">
          Result message
        </div>
      </div>

      <div class="mt-auto">
        <a class="btn-primary" th:href="@{/phone/ezkey}" data-testid="demo-device-back-to-enrollments">Back to Enrollments</a>
      </div>
    </div>
    <a href="/phone/ezkey"
       class="side-exit"
       title="Exit to enrollments list"
       aria-label="Exit to enrollments list"
       data-testid="demo-device-auth-back"></a>
  </div>
</body>
</html>
