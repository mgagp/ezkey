<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle}">Ezkey App</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background:#f2f2f2; padding:1.5rem; }
    .app-shell { width: 380px; height: 780px; border-radius: 36px; background:#0a0a0a; color:#f5f5f7; position: relative; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,.35); }
    .status-bar { position:absolute; top: 12px; left:0; right:0; padding: 0 16px; display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:.9rem; }
    .content { position:absolute; top: 52px; left:0; right:0; bottom: 0; display:flex; flex-direction:column; }
    .header { padding: 16px; }
    .title { margin:0; font-size: 1.25rem; }
    .new-enrollment-btn { 
      display: block; 
      width: 100%; 
      padding: 12px 14px; 
      margin: 8px; 
      border-radius: 14px; 
      background: #0d6efd; 
      color: #fff; 
      text-decoration: none; 
      text-align: center;
      border: none;
      font-size: 0.9rem;
    }
    .new-enrollment-btn:hover { 
      background: #0b5ed7; 
      color: #fff; 
      text-decoration: none; 
    }
    .list { flex:1; overflow-y:auto; padding: 0 8px 12px 8px; }
    .item { display:block; text-decoration:none; color:#fff; padding: 12px 14px; margin: 8px; border-radius: 14px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
    .item:hover { background: rgba(255,255,255,.12); }
    .empty { margin: 24px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.06); color:#ddd; }
    .side-exit { position: absolute; right: -14px; top: 40%; width: 8px; height: 120px; background:#333; border-radius: 4px; cursor: pointer; }
  </style>
  <script>
    function exitToSetup(){ window.location.href = '/'; }
  </script>
</head>
<body>
  <div class="app-shell">
    <div class="status-bar">
      <div>Ezkey</div>
      <div>9:41</div>
    </div>
    <div class="content">
      <div class="header">
        <h1 class="title">My Enrollments</h1>
        <div class="text-muted" style="font-size:.85rem; opacity:.8;">Tap an enrollment to start authentication</div>
      </div>
      <a href="/phone/ezkey/enrollment/new" class="new-enrollment-btn">+ New Enrollment</a>
      <div class="list" th:if="${#lists.isEmpty(enrollments)}">
        <div class="empty">No enrollments stored yet.</div>
      </div>
      <div class="list" th:if="${!#lists.isEmpty(enrollments)}">
        <a class="item" th:each="e : ${enrollments}" th:href="@{'/phone/ezkey/enrollments/' + ${e.enrollmentId} + '/auth'}">
          <div style="display: flex; align-items: center;">
            <img th:if="${e.integrationLogo}" th:src="${e.integrationLogo}" alt="Integration Logo" 
                 style="width: 32px; height: 32px; border-radius: 6px; margin-right: 12px;">
            <div style="flex: 1;">
              <div style="font-weight: 600; margin-bottom: 4px;">
                <span th:if="${e.integrationName}" th:text="${e.integrationName}">Integration Name</span>
                <span th:unless="${e.integrationName}">#<span th:text="${e.enrollmentId}">1</span></span>
              </div>
              <div th:if="${e.integrationDescription}" style="font-size: 0.8rem; color: #ccc; line-height: 1.2;" 
                   th:text="${e.integrationDescription}">Integration description</div>
              <div th:unless="${e.integrationDescription}" style="font-size: 0.8rem; color: #888;">
                Enrollment #<span th:text="${e.enrollmentId}">1</span>
              </div>
            </div>
          </div>
        </a>
      </div>
    </div>
    <div class="side-exit" onclick="exitToSetup()" title="Exit"></div>
  </div>
</body>
</html>
