# Device Demo Application - Docker Configuration
server.port=8083

# Application metadata
spring.application.name=ezkey-demo-device
info.app.name=Ezkey Device Demo Application
info.app.description=Demo device application for testing Ezkey authentication flows
info.app.version=1.0.0

# Thymeleaf configuration
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Ezkey integration configuration
ezkey.auth.api.url=${EZKEY_AUTH_API_URL:http://ezkey-auth-api:8080}

# Logging configuration
logging.level.org.ezkey.demodevice=${LOGGING_LEVEL_ORG_EZKEY:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:WARN}
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Development configuration (disabled in docker)
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Jackson configuration
spring.jackson.deserialization.ADJUST_DATES_TO_CONTEXT_TIME_ZONE=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSSSS

# Performance optimizations for Docker
server.tomcat.threads.max=5
server.tomcat.threads.min-spare=2

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized