# Ezkey Demo Device - Docker Configuration
server.port=8083
spring.thymeleaf.cache=true

# Actuator on dedicated management port (compose publishes 127.0.0.1:8084).
# Override IDE default (127.0.0.1) so host publish and healthchecks can reach the port (#905).
management.server.port=8084
management.server.address=0.0.0.0
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.access=read-only
management.endpoint.health.show-details=never
management.health.defaults.enabled=false
management.health.db.enabled=false
management.health.diskspace.enabled=false
management.health.ping.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Ezkey Auth API base URL (from environment variable in docker-compose.yml)
ezkey.auth.api.url=${EZKEY_AUTH_API_URL:http://auth-api:8080}

# Optional explicit allowlist (comma-separated hostnames). Empty → Auth API host + localhost + 127.0.0.1
# ezkey.demo-device.allowed-auth-api-hosts=${EZKEY_DEMO_DEVICE_ALLOWED_AUTH_API_HOSTS:}

