# Testcontainers Configuration for Ezkey Project
# Modern configuration for Docker Desktop 4.52+ on Windows

# Force the use of the standard Docker Engine pipe
# This often resolves connection issues where Testcontainers tries to use the wrong pipe (like docker_cli)
docker.host=npipe:////./pipe/docker_engine

# Performance optimizations
checks.disable=true

# Logging configuration
log.level=INFO

# Docker client strategy
# Since we are forcing the host, we can let it auto-detect or force Npipe
# docker.client.strategy=org.testcontainers.dockerclient.NpipeSocketClientProviderStrategy

# Container reuse (optional)
# testcontainers.reuse.enable=true

