build:
  maxIssues: 9999

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true

style:
  MagicNumber:
    active: false

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - Composable

complexity:
  LongMethod:
    active: true
    threshold: 120
