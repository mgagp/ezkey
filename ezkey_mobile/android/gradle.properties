# Project-wide Gradle settings.
#
# JDK posture (Ezkey Mobile): project standard is **JDK 17**. RN/AGP also accept 21, but
# migrating the project to JDK 21 is a separate, later decision — do not introduce daemon
# JVM criteria or Foojay/toolchain auto-download that pin 21. CI uses actions/setup-java 17;
# local builds use scripts/resolve-android-jdk.sh (prefer JDK 17 installs).
#
# If you see "Unsupported class file major version 69" or
# "Error resolving plugin [id: 'com.facebook.react.settings']", JAVA_HOME is likely JDK 25:
#   use ./scripts/resolve-android-jdk.sh / yarn android:jdk17
#   Windows fallback: C:\Tools\jdk17 or Android Studio JBR
#   macOS: export JAVA_HOME=$(/usr/libexec/java_home -v 17)

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
# RN 0.83 release lint can exhaust metaspace on Windows; allocate more headroom.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# Never auto-download a JDK at build time (Foojay / toolchain provisioning). Builds must use
# the JDK already on JAVA_HOME (CI setup-java 17 or resolve-android-jdk.sh locally).
org.gradle.java.installations.auto-download=false

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# Restricted to 64-bit only for Android 16 16KB page size compatibility (Pixel 7 Pro, etc.)
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=arm64-v8a,x86_64

# Standalone debug APK (no Metro, no dev menu): keep false. Set true only when you want
# `yarn start` + fast refresh with a debug build (then use adb reverse for physical devices).
ezkey.useMetroInDebug=false

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
# RN 0.82+ always enables New Architecture; keep this flag for third-party Gradle scripts
# (e.g. react-native-nitro-modules) that still gate codegen on `newArchEnabled`.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

VisionCamera_enableFrameProcessors=true
VisionCamera_enableCodeScanner=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
