apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: project(":react-native-config").projectDir.getPath() + "/dotenv.gradle"

import groovy.json.JsonSlurper

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   Empty list = debug APK includes the bundle (standalone, no Metro required).
    debuggableVariants = []

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 * Enabled by default for release: shrinks the APK/AAB, removes unused classes, and applies the
 * shipped consumer ProGuard rules from React Native, Hermes, and other dependencies. App-specific
 * exceptions live in `proguard-rules.pro`.
 */
def enableProguardInReleaseBuilds = true

/**
 * Reads the release signing credentials from Gradle properties (which also pick up
 * `ORG_GRADLE_PROJECT_*` environment variables, useful for CI). Returns null when any required
 * property is missing so we can fall back to debug signing locally with a loud warning instead of
 * failing every assembleDebug. Source the keystore from outside the repo (e.g. ~/.gradle).
 *
 * Required properties:
 *   EZKEY_UPLOAD_STORE_FILE      Absolute path to the upload keystore (.keystore / .jks)
 *   EZKEY_UPLOAD_STORE_PASSWORD  Keystore password
 *   EZKEY_UPLOAD_KEY_ALIAS       Key alias inside the keystore
 *   EZKEY_UPLOAD_KEY_PASSWORD    Key password
 */
def releaseSigningProps = {
    def storeFilePath = project.findProperty('EZKEY_UPLOAD_STORE_FILE')
    def storePassword = project.findProperty('EZKEY_UPLOAD_STORE_PASSWORD')
    def keyAlias = project.findProperty('EZKEY_UPLOAD_KEY_ALIAS')
    def keyPassword = project.findProperty('EZKEY_UPLOAD_KEY_PASSWORD')
    if (!storeFilePath || !storePassword || !keyAlias || !keyPassword) {
        return null
    }
    def storeFile = file(storeFilePath)
    if (!storeFile.exists()) {
        logger.warn("Ezkey: EZKEY_UPLOAD_STORE_FILE points to ${storeFilePath} but the file does not exist; falling back to debug signing for release builds.")
        return null
    }
    return [
        storeFile: storeFile,
        storePassword: storePassword,
        keyAlias: keyAlias,
        keyPassword: keyPassword,
    ]
}.call()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

def packageJson = new JsonSlurper().parse(file("$rootDir/../package.json"))
def appVersionName = packageJson.version

/** When false, debug builds behave like offline installs: JS from APK assets only (no Metro). */
def ezkeyUseMetroInDebug =
        (project.findProperty("ezkey.useMetroInDebug") ?: "false").toString().toBoolean()

android {
    ndkVersion = rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig = true
    }

    namespace = "org.ezkey.mobile"
    defaultConfig {
        applicationId "org.ezkey.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Strictly increasing Play upload integer. Confirm against Play Console App bundle
        // explorer before each official upload; bump when the Console already has this value.
        // Workspace default 2 assumes the experimental listing used versionCode 1.
        versionCode 2
        versionName appVersionName
        def buildTimeUtc = new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", java.util.Locale.US)
        buildTimeUtc.setTimeZone(java.util.TimeZone.getTimeZone("UTC"))
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${buildTimeUtc.format(new Date())}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }
    packagingOptions {
        jniLibs {
            excludes += ['lib/armeabi/*', 'lib/armeabi-v7a/*', 'lib/x86/*', 'lib/mips/*']
            pickFirsts += ['lib/arm64-v8a/libc++_shared.so', 'lib/x86_64/libc++_shared.so']
        }
        resources {
            excludes += ['lib/armeabi/*', 'lib/armeabi-v7a/*', 'lib/x86/*', 'lib/mips/*']
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigningProps != null) {
            release {
                storeFile releaseSigningProps.storeFile
                storePassword releaseSigningProps.storePassword
                keyAlias releaseSigningProps.keyAlias
                keyPassword releaseSigningProps.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
            buildConfigField "boolean", "USE_DEVELOPER_SUPPORT", String.valueOf(ezkeyUseMetroInDebug)
        }
        release {
            // Release builds use the upload signing key when EZKEY_UPLOAD_* properties are set
            // (Google Play App Signing then re-signs with its managed key). When credentials are
            // absent we fall back to the debug keystore with a loud warning so that local debug
            // workflows keep working but the resulting AAB cannot be uploaded to the Play Console.
            if (releaseSigningProps != null) {
                signingConfig = signingConfigs.release
            } else {
                logger.warn("Ezkey: release signing credentials not provided (set EZKEY_UPLOAD_* gradle properties); falling back to debug keystore. The resulting artifact CANNOT be uploaded to the Play Console.")
                signingConfig = signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources = enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Release builds never load the Metro dev server.
            buildConfigField "boolean", "USE_DEVELOPER_SUPPORT", "false"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // Backports the Android 12+ splash screen API to older devices for a consistent first launch.
    implementation "androidx.core:core-splashscreen:1.2.0"
    implementation "androidx.biometric:biometric:1.1.0"
    // Official Play In-App Updates (flexible / soft prompt). Not an RN wrapper.
    implementation "com.google.android.play:app-update:2.1.0"

    // Ed25519 integration signing verification on older API levels (JCA parity with Auth API JDK path).
    implementation 'org.conscrypt:conscrypt-android:2.5.3'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Unit tests for crypto (IntegrationKeyVerifier) — JVM only, no device
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

    // Instrumentation tests for Android Keystore paths (emulator OK; StrongBox is manual)
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test:rules:1.6.1")
}

// Use JUnit 5 for unit tests
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

