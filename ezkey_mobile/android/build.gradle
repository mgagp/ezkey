buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 31
        compileSdkVersion = 36
        targetSdkVersion = 36
        // NDK r28+ defaults LOAD segments to 16 KB. GNU_RELRO still needs common-page-size
        // raised via android/cmake/ezkey-16kb-page-size.cmake (#659).
        // See https://developer.android.com/guide/practices/page-sizes
        ndkVersion = "28.1.13356709"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:9.2.1')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

// 16 KB GNU_RELRO: include add_link_options for max-page-size + common-page-size=16384
// into every Android CMake project (#659). Prefer CMAKE_PROJECT_INCLUDE over
// CMAKE_*_LINKER_FLAGS_INIT — NDK toolchain can overwrite INIT flags.
def ezkey16KbCmakeInclude =
        "-DCMAKE_PROJECT_INCLUDE=${rootDir}/cmake/ezkey-16kb-page-size.cmake"

def injectEzkey16KbCmakeArgs = { Project subproject ->
    def androidExt = subproject.extensions.findByName("android")
    if (androidExt == null) {
        return
    }
    try {
        def cmakeArgs = androidExt.defaultConfig.externalNativeBuild.cmake.arguments
        if (cmakeArgs.none { it.startsWith("-DCMAKE_PROJECT_INCLUDE=") }) {
            cmakeArgs.add(ezkey16KbCmakeInclude)
        }
    } catch (Exception ignored) {
        // No CMake externalNativeBuild on this module.
    }
}

// Async Storage 3.x publishes shared-storage AAR via package-local Maven (not on Maven Central).
// Also inject 16 KB linker flags into every Android module CMake build.
subprojects { subproject ->
    subproject.repositories {
        maven {
            url = uri("${rootDir}/../node_modules/@react-native-async-storage/async-storage/android/local_repo")
        }
    }
    // Some RN/AGP paths evaluate a subproject before this root block runs; calling
    // afterEvaluate on an already-evaluated project fails hard ("already evaluated").
    if (subproject.state.executed) {
        injectEzkey16KbCmakeArgs(subproject)
    } else {
        subproject.afterEvaluate {
            injectEzkey16KbCmakeArgs(subproject)
        }
    }
}
