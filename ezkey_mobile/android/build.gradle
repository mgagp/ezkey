buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 31
        compileSdkVersion = 36
        targetSdkVersion = 36
        // NDK r28+ defaults to 16 KB ELF / GNU_RELRO padding (Play + Pixel page-size dialog).
        // See https://developer.android.com/guide/practices/page-sizes and #659.
        ndkVersion = "28.1.13356709"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:9.2.1')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Async Storage 3.x publishes shared-storage AAR via package-local Maven (not on Maven Central).
subprojects {
    repositories {
        maven {
            url = uri("${rootDir}/../node_modules/@react-native-async-storage/async-storage/android/local_repo")
        }
    }
}
