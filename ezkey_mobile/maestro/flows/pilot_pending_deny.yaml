appId: org.ezkey.mobile
---
## Pilot: Home → Enrollment detail → Check pending → Deny (no 2-digit challenge).
## Prerequisites: device enrolled; a pending auth attempt queued with challengeRequested=false.
## launchApp uses stopApp: true so each run cold-starts on Home.
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "ezkey.e2e.home.root"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "ezkey\\.e2e\\.home\\.enrollment\\.(?:i[0-9a-f]{16}_e)?${ENROLLMENT_ID}"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "ezkey\\.e2e\\.home\\.enrollment\\.(?:i[0-9a-f]{16}_e)?${ENROLLMENT_ID}"
    direction: DOWN
    timeout: 20000
    speed: 60
    visibilityPercentage: 10
- tapOn:
    id: "ezkey\\.e2e\\.home\\.enrollment\\.(?:i[0-9a-f]{16}_e)?${ENROLLMENT_ID}"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "ezkey.e2e.enrollmentDetail.checkPending"
    timeout: 45000
- tapOn:
    id: "ezkey.e2e.enrollmentDetail.checkPending"
- extendedWaitUntil:
    visible:
      id: "ezkey.e2e.pendingAuth.deny"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "ezkey.e2e.pendingAuth.deny"
    point: "50%,50%"
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "ezkey.e2e.enrollmentDetail.checkPending"
    timeout: 90000
