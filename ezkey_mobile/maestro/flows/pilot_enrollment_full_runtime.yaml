appId: org.ezkey.mobile
---
## Full enrollment E2E flow: bind via runtime bypass + verify challenge + confirm enrolled.
## Variables required:
##   ENROLLMENT_ID          - numeric enrollment ID (Home card ids, not the seed)
##   ENROLLMENT_PROOF_TOKEN - proof token string
##   ENROLLMENT_AUTH_URL    - auth server base URL
##   ENROLLMENT_CHALLENGE   - 6-digit challenge code shown in admin console
##
## Example (PowerShell):
##   Set-Location C:\w\e\ezkey_mobile
##   maestro test maestro/flows/pilot_enrollment_full_runtime.yaml `
##     -e ENROLLMENT_ID=4 `
##     -e ENROLLMENT_PROOF_TOKEN=TOKEN `
##     -e ENROLLMENT_AUTH_URL=https://xxx.ngrok-free.dev `
##     -e ENROLLMENT_CHALLENGE=123456
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "ezkey.e2e.home.root"
    timeout: 30000
- tapOn:
    id: "ezkey.e2e.home.fabAddEnrollment"
- extendedWaitUntil:
    visible:
      id: "ezkey.e2e.enrollmentWizard.controlledBypassSeed"
    timeout: 60000
- tapOn:
    id: "ezkey.e2e.enrollmentWizard.controlledBypassSeedInput"
    point: "50%,50%"
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 1500
## Same JSON as the enrollment QR (#1301 removed the legacy id|token|url seed).
- inputText: '{"enrollmentProofToken":"${ENROLLMENT_PROOF_TOKEN}","authUrl":"${ENROLLMENT_AUTH_URL}"}'
- waitForAnimationToEnd:
    timeout: 1500
# hideKeyboard fails on iOS (Maestro): Android keeps it, iOS taps a neutral header area (#1175).
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%,8%"
- tapOn:
    id: "ezkey.e2e.enrollmentWizard.controlledBypassSeed"
    point: "50%,50%"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "ezkey.e2e.enrollmentWizard.verifyStep"
    timeout: 60000
- tapOn:
    id: "ezkey.e2e.enrollmentWizard.challengeInput"
    point: "50%,50%"
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 1500
- inputText: "${ENROLLMENT_CHALLENGE}"
- waitForAnimationToEnd:
    timeout: 1500
# hideKeyboard fails on iOS (Maestro): Android keeps it, iOS taps a neutral header area (#1175).
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%,8%"
- tapOn:
    id: "ezkey.e2e.enrollmentWizard.verifyStep"
    point: 50%, 10%
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "ezkey.e2e.enrollmentWizard.verifyStep"
    timeout: 10000
- tapOn:
    id: "ezkey.e2e.enrollmentWizard.primaryAction"
    point: "50%,50%"
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible:
      id: "ezkey.e2e.enrollmentWizard.verifyStep"
    timeout: 60000
- extendedWaitUntil:
        visible:
            id: "ezkey.e2e.home.root"
        timeout: 60000