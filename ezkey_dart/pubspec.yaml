name: ezkey_dart
description: >-
  Experimental pure-Dart device-side SDK for the Ezkey protocol (enrollment, auth-attempt
  approval, request signing and response verification), plus lab CLIs for end-to-end tests.
version: 0.3.0
publish_to: none

executables:
  ezkey_dart: ezkey_dart
  ezkey_e2e: ezkey_e2e

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  args: ^2.7.0
  cryptography: ^2.9.0
  http: ^1.6.0
  pointycastle: ^4.0.0
  unorm_dart: ^0.3.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
