spring.application.name=ezkey-connector-smtp
server.port=${EZKEY_CONNECTOR_SMTP_PORT:8091}
spring.main.banner-mode=off
# Spring Boot's mail health check would contact the provider; the contract's health never does.
management.health.mail.enabled=false
ezkey.connector.smtp.token=${EZKEY_CONNECTOR_SMTP_TOKEN:}
ezkey.connector.smtp.next-token=${EZKEY_CONNECTOR_SMTP_NEXT_TOKEN:}
ezkey.connector.smtp.host=${EZKEY_CONNECTOR_SMTP_HOST:}
ezkey.connector.smtp.smtp-port=${EZKEY_CONNECTOR_SMTP_SMTP_PORT:587}
ezkey.connector.smtp.username=${EZKEY_CONNECTOR_SMTP_USERNAME:}
ezkey.connector.smtp.password=${EZKEY_CONNECTOR_SMTP_PASSWORD:}
ezkey.connector.smtp.from-address=${EZKEY_CONNECTOR_SMTP_FROM_ADDRESS:}
ezkey.connector.smtp.from-name=${EZKEY_CONNECTOR_SMTP_FROM_NAME:Ezkey}
ezkey.connector.smtp.security=${EZKEY_CONNECTOR_SMTP_SECURITY:starttls}
ezkey.connector.smtp.plain-private-network=${EZKEY_CONNECTOR_SMTP_PLAIN_PRIVATE_NETWORK:false}
ezkey.connector.smtp.provider-timeout-seconds=${EZKEY_CONNECTOR_SMTP_PROVIDER_TIMEOUT_SECONDS:15}
ezkey.connector.smtp.daily-cap=${EZKEY_CONNECTOR_SMTP_DAILY_CAP:100}
