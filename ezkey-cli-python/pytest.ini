[pytest]
# pytest configuration for Ezkey CLI integration tests

# Test discovery
testpaths = tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Markers
markers =
    integration: Integration tests against real Docker stack
    slow: Tests that take a long time to run
    opportunistic: Tests that use opportunistic DB/log verification

# Coverage (optional)
# [tool.coverage.run]
# source = ezkey_cli
# omit = 
#     */tests/*
#     */test_*

