name: ezkey-admin-ui

services:
  admin-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-test}
        VITE_GIT_SHA: ${VITE_GIT_SHA:-unknown}
    container_name: ezkey-admin-ui
    ports:
      - "${ADMIN_UI_PORT:-3090}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
