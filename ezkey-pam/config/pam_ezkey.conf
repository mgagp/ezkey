#
# pam_ezkey.conf - Configuration for Ezkey PAM module
#
# This file contains reference configuration for the Ezkey PAM authentication module.
# Note: credentials (integration key, secret key) are passed via environment variables,
# not via this file. See EZKEY_M2M_API_URL, EZKEY_INTEGRATION_KEY, EZKEY_SECRET_KEY.
#

# Ezkey Integration API endpoint (legacy key name m2m_api_url; not parsed yet)
# Override with EZKEY_M2M_API_URL (legacy env name)
m2m_api_url=http://localhost:7080

# Timeout settings (in seconds)
wait_timeout=30
api_timeout=10

# Debug settings
# Set to 1 to enable verbose logging in /var/log/secure
debug=1
