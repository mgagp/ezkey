#
# pam_ezkey.conf - Runtime configuration for the Ezkey PAM module
#
# The module reads this file at authentication time. Docker entrypoint may
# rewrite it from environment variables. Do not commit real API secrets.
#
# Keys:
#   integration_api_url   Integration API base URL (required; no compiled default)
#   integration_key       API integration key (ezkey_ikey_...)
#   secret_key            API secret key (ezkey_skey_...)
#   wait_timeout          Seconds to wait for approval (15–90; clamped; further
#                         shrunk at runtime to fit EZKEY_AUTH_BUDGET_SECS 105
#                         under sshd LoginGraceTime 120 — see STATUS). Sent as
#                         create ttlSeconds; /wait?timeout= uses the same
#                         effective value after applied-TTL align.
#   wait_polling          Wait poll interval in seconds (query param; default 2)
#   api_timeout           HTTP timeout for the create call (default 10; max 10)
#   challenge_requested   true/false — default true (#995): ask Integration API
#                         for a 2-digit challenge on create (safer SSH default).
#                         Set false to opt out of connector-requested challenge;
#                         enrollment authAttemptChallengeRequired still forces a
#                         code on the server regardless of this flag.
#   lab_http              true/false — allow http:// URL (Docker lab only; default false)
#   context_title         Short title shown on the device
#   context_message       Longer message shown on the device
#   debug                 true/false — extra filelog /var/log/ezkey-pam/debug.{out,err}
#                         (off by default outside the Docker lab; #818)
#
# File must be root:root mode 0600 or 0400. Missing URL/keys → PAM_AUTHINFO_UNAVAIL.
# Outside lab: use https:// and leave lab_http=false (fail-closed).
# Docker demos: entrypoint writes this file from compose ENV (module does not
# read ENV itself) and sets lab_http=true.
#

integration_api_url=
integration_key=
secret_key=
wait_timeout=90
wait_polling=2
api_timeout=10
challenge_requested=true
lab_http=false
context_title=SSH login
context_message=
debug=false
