#
# pam_ezkey.conf - Runtime configuration for the Ezkey PAM module
#
# The module reads this file at authentication time. Docker entrypoint may
# rewrite it from environment variables. Do not commit real API secrets.
#
# Keys:
#   integration_api_url   Integration API base URL (no trailing slash)
#   integration_key       API integration key (ezkey_ikey_...)
#   secret_key            API secret key (ezkey_skey_...)
#   wait_timeout          Seconds to wait for Demo Device / mobile approval (1-300)
#   wait_polling          Wait polling interval in seconds
#   api_timeout           HTTP timeout for the create call
#   challenge_requested   true/false — SSH demo uses false (no extra PIN)
#   context_title         Short title shown on the device
#   context_message       Longer message shown on the device
#   debug                 true/false — extra syslog
#

integration_api_url=http://localhost:7080
integration_key=
secret_key=
wait_timeout=90
wait_polling=2
api_timeout=10
challenge_requested=false
context_title=SSH login
context_message=
debug=true
