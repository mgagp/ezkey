#
# pam_ezkey.conf - Configuration for Ezkey PAM module
#
# This file contains configuration parameters for the Ezkey PAM authentication module
# Edit these values according to your Ezkey deployment
#

# Ezkey API endpoints
# Adjust these URLs to match your Ezkey server deployment
admin_api_url=http://localhost:9080
auth_api_url=http://localhost:8080

# Timeout settings (in seconds)
wait_timeout=30
api_timeout=10
retry_count=3

# Debug settings
# Set to 1 to enable verbose logging in /var/log/secure
debug=1

# Mock settings (for testing only)
# Set mock_success=0 to simulate authentication failures
# Set mock_delay to control simulated response time
mock_success=1
mock_delay=5

# Integration settings
# Default integration name for SSH authentication
default_integration=SSH Server Authentication

# Fallback behavior
# What to do if Ezkey service is unavailable
# Options: allow, deny, skip
fallback_action=deny

# User exclusions
# Comma-separated list of users to exclude from Ezkey authentication
# These users will bypass MFA (use with caution!)
excluded_users=root

# Logging
# Facility for syslog messages
log_facility=authpriv
log_level=info
