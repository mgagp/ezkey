# ==================================================
# docker-compose.yml
# ==================================================
# Usage:
#   EZKEY_INTEGRATION_KEY=<key> EZKEY_SECRET_KEY=<secret> docker-compose up --build
# Or set the variables in a .env file in this directory.
# The ezkey-network must already exist (created by the main stack: cd docker && ./manage.sh start)

services:
  ezkey-pam-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ezkey-pam-test
    hostname: ezkey-test
    ports:
      - "2222:22"    # SSH accessible sur localhost:2222
    volumes:
      - ./logs:/var/log/container    # Logs accessibles depuis l'host
      - ./workspace:/home/testuser/workspace    # Workspace partagé
    environment:
      - EZKEY_M2M_API_URL=http://integration-api:7080
      - EZKEY_INTEGRATION_KEY=${EZKEY_INTEGRATION_KEY:-}
      - EZKEY_SECRET_KEY=${EZKEY_SECRET_KEY:-}
    networks:
      - ezkey-network
    restart: unless-stopped
    tty: true
    stdin_open: true

networks:
  ezkey-network:
    external: true
