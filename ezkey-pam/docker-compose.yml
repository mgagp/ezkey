# Ezkey PAM SSH demo
#
# Usage (from this directory, after the main stack is up):
#   ./scripts/up.sh
#
# The ezkey Docker network is created by the main stack
# (`cd ezkey-tests && ./clean-start.sh`). Compose project name is `ezkey`,
# so the bridge is typically `ezkey_ezkey-network`.

services:
  pam-builder:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: ezkey-pam-builder:local
    profiles: ["build"]

  pam-builder-al2023:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder-al2023
    image: ezkey-pam-builder-al2023:local
    profiles: ["al2023", "build"]

  ezkey-pam-ssh:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ezkey-pam-ssh:local
    container_name: ezkey-pam-ssh
    hostname: ezkey-pam-ssh
    ports:
      - "${EZKEY_PAM_SSH_PORT:-2222}:22"
    environment:
      EZKEY_INTEGRATION_API_URL: ${EZKEY_INTEGRATION_API_URL:-http://integration-api:7080}
      EZKEY_INTEGRATION_KEY: ${EZKEY_INTEGRATION_KEY:-}
      EZKEY_SECRET_KEY: ${EZKEY_SECRET_KEY:-}
      EZKEY_WAIT_TIMEOUT: ${EZKEY_WAIT_TIMEOUT:-90}
      EZKEY_WAIT_POLLING: ${EZKEY_WAIT_POLLING:-2}
      EZKEY_SSH_USER: ${EZKEY_SSH_USER:-testuser}
      EZKEY_CONTEXT_TITLE: ${EZKEY_CONTEXT_TITLE:-SSH login}
      EZKEY_CONTEXT_MESSAGE: ${EZKEY_CONTEXT_MESSAGE:-}
      EZKEY_DEBUG: ${EZKEY_DEBUG:-true}
    networks:
      - ezkey-network
    restart: unless-stopped

  ezkey-pam-ssh-al2023:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-al2023
    image: ezkey-pam-ssh-al2023:local
    container_name: ezkey-pam-ssh-al2023
    hostname: ezkey-pam-ssh-al2023
    profiles: ["al2023"]
    ports:
      - "${EZKEY_PAM_SSH_PORT_AL2023:-2223}:22"
    environment:
      EZKEY_INTEGRATION_API_URL: ${EZKEY_INTEGRATION_API_URL:-http://integration-api:7080}
      EZKEY_INTEGRATION_KEY: ${EZKEY_INTEGRATION_KEY:-}
      EZKEY_SECRET_KEY: ${EZKEY_SECRET_KEY:-}
      EZKEY_WAIT_TIMEOUT: ${EZKEY_WAIT_TIMEOUT:-90}
      EZKEY_WAIT_POLLING: ${EZKEY_WAIT_POLLING:-2}
      EZKEY_SSH_USER: ${EZKEY_SSH_USER:-testuser}
      EZKEY_CONTEXT_TITLE: ${EZKEY_CONTEXT_TITLE:-SSH login}
      EZKEY_CONTEXT_MESSAGE: ${EZKEY_CONTEXT_MESSAGE:-}
      EZKEY_DEBUG: ${EZKEY_DEBUG:-true}
    networks:
      - ezkey-network
    restart: unless-stopped

networks:
  ezkey-network:
    external: true
    name: ${EZKEY_DOCKER_NETWORK:-ezkey_ezkey-network}
