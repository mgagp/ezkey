# Community / EXP1 Lightsail — opt-in JavaMelody collector overlay (#846).
#
# Applies Christophe locks: management-port monitoring only, collector bound to
# loopback, hardened init parameters, no public /monitoring or /actuator (Caddy).
# Memory limits for the APIs live in docker-compose.yml (#749). This overlay adds
# the collector at 256m (~3648m total with #749 after auth-api 768m) — prefer a host
# 1 GiB swapfile (documented in docs/lightsail/community-host.md; do not auto-create).
# Note: memswap_limit = mem_limit, so host swap does not extend container cgroups.
#
# Init parameters: SPRING_APPLICATION_JSON with hyphenated Parameter codes (see
# docker/javamelody/init-parameters.base.json + check-javamelody-spring-json.sh).
# This overlay *replaces* any SPRING_APPLICATION_JSON set elsewhere. Do not use
# plain JAVAMELODY_INIT_PARAMETERS_* map env vars — Spring relaxed binding drops
# hyphens and JavaMelody ignores them.
#
# Enable (on the VM, from experimental-hybrid/lightsail/):
#   docker compose -f docker-compose.yml -f docker-compose.javamelody.yml up -d
#
# Or: ./clean-start.sh --with-java-melody (destructive full reset path)
#
# Rollback JM only (#749 memory limits in the base compose stay):
#   docker compose -f docker-compose.yml up -d --remove-orphans
# Then optionally: docker volume rm ezkey-experimental-lightsail_javamelody-data
#
# Collector UI (SSH tunnel only): http://127.0.0.1:8088
# Per-API reports: management ports 9081 / 8085 / 7081 /actuator/monitoring (Docker net)

x-javamelody-env: &javamelody-env
  JAVAMELODY_ENABLED: "true"
  JAVAMELODY_MANAGEMENT_ENDPOINT_MONITORING_ENABLED: "true"
  JAVAMELODY_SPRING_MONITORING_ENABLED: "true"
  # No metrics / threaddump / info on the management surface in prod (#846 Christophe).
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,monitoring"
  MANAGEMENT_ENDPOINT_MONITORING_ACCESS: unrestricted

x-jm-init-admin: &jm-init-admin
  SPRING_APPLICATION_JSON: >-
    {"javamelody":{"init-parameters":{"system-actions-enabled":"false","csrf-protection-enabled":"true","update-check-disabled":"true","log":"false","http-transform-pattern":"[0-9a-fA-F]{8}-[0-9a-fA-F-]{27}|\\d+","obsolete-graphs-days":"30","obsolete-stats-days":"30","application-name":"admin-api"}}}

x-jm-init-auth: &jm-init-auth
  SPRING_APPLICATION_JSON: >-
    {"javamelody":{"init-parameters":{"system-actions-enabled":"false","csrf-protection-enabled":"true","update-check-disabled":"true","log":"false","http-transform-pattern":"[0-9a-fA-F]{8}-[0-9a-fA-F-]{27}|\\d+","obsolete-graphs-days":"30","obsolete-stats-days":"30","application-name":"auth-api"}}}

x-jm-init-integration: &jm-init-integration
  SPRING_APPLICATION_JSON: >-
    {"javamelody":{"init-parameters":{"system-actions-enabled":"false","csrf-protection-enabled":"true","update-check-disabled":"true","log":"false","http-transform-pattern":"[0-9a-fA-F]{8}-[0-9a-fA-F-]{27}|\\d+","obsolete-graphs-days":"30","obsolete-stats-days":"30","application-name":"integration-api"}}}

services:
  admin-api:
    environment:
      <<: [*javamelody-env, *jm-init-admin]

  auth-api:
    environment:
      <<: [*javamelody-env, *jm-init-auth]

  integration-api:
    environment:
      <<: [*javamelody-env, *jm-init-integration]

  javamelody-collector:
    build:
      context: ../../docker/javamelody
      dockerfile: Dockerfile
      args:
        JAVAMELODY_VERSION: "2.9.0"
    image: ezkey-javamelody-collector:2.9.0
    container_name: ezkey-exp-javamelody-collector
    # Logging options duplicated (YAML anchors do not cross compose files).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      admin-api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
      integration-api:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      # Heap under the 256m cgroup; no secrets in -D (flags only — see entrypoint.sh).
      JAVAMELODY_XMX: "160m"
    volumes:
      - ../../docker/javamelody/applications.properties:/opt/javamelody/applications.properties:ro
      - javamelody-data:/tmp/javamelody
    ports:
      # Loopback only — public exposure is forbidden (#846). Dev baseline used 0.0.0.0.
      - "127.0.0.1:8088:8080"
    networks:
      - ezkey-exp-net
    restart: unless-stopped

volumes:
  javamelody-data:
