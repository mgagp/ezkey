# Optional local companions when Admin/Auth/Integration run on Lightsail.
# Point EZKEY_* URLs at the public HTTPS endpoints from your Caddy hostnames.
# Sync /etc/ezkey from the VM into ./encryption-secrets-local before starting crypto-api (see README).

name: ezkey-experimental-local

x-container-tz: &container-tz
  TZ: ${TZ:-UTC}

services:
  crypto-api:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: crypto-api
    container_name: ezkey-exp-local-crypto-api
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    volumes:
      - ${EZKEY_ENCRYPTION_SECRETS_DIR:-./encryption-secrets-local}:/etc/ezkey:ro
    ports:
      - "${CRYPTO_API_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ezkey-exp-local-net
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  demo-device:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: demo-device
    container_name: ezkey-exp-local-demo-device
    environment:
      <<: *container-tz
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      EZKEY_AUTH_API_URL: ${EZKEY_AUTH_API_URL}
    volumes:
      - demo-device-data:/app/data
    ports:
      - "${DEMO_DEVICE_PORT:-8083}:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ezkey-exp-local-net
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  demo-login:
    build:
      context: ../..
      dockerfile: ezkey-demo-login/Dockerfile
    container_name: ezkey-exp-local-demo-login
    environment:
      <<: *container-tz
      EZKEY_INTEGRATION_API_URL: ${EZKEY_INTEGRATION_API_URL}
      EZKEY_INTEGRATION_KEY: ${EZKEY_INTEGRATION_KEY:-}
      EZKEY_SECRET_KEY: ${EZKEY_SECRET_KEY:-}
    volumes:
      - demo-login-data:/app/data
    ports:
      - "${DEMO_LOGIN_PORT:-8082}:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ezkey-exp-local-net
    restart: on-failure:3

networks:
  ezkey-exp-local-net:
    driver: bridge

volumes:
  demo-device-data:
  demo-login-data:
