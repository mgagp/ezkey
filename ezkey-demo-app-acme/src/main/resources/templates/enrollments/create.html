<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/neo-brutalism.css">
    <link rel="stylesheet" href="/css/acme-theme.css">
</head>
<div th:fragment="content">
    <div class="form-section neo-brutal-main" x-data="enrollmentForm()">
        <div class="form-header">
            <h2 class="form-title">Create Enrollment</h2>
            <p class="form-subtitle">Link a device to your integration</p>
        </div>

        <form th:action="@{/enrollments}" method="post" class="brutal-form neo-brutal-main" x-ref="form" @submit.prevent="submitForm">
            <input type="hidden" name="integrationId" th:value="${enrollmentRequest.integrationId}">

            <div class="form-group">
                <label for="enrollmentName" class="form-label">
                    <span class="label-text">Device Name</span>
                    <span class="label-required">*</span>
                </label>
                <input type="text" id="enrollmentName" name="name" class="form-input" x-model="formData.name" placeholder="e.g., My Device" maxlength="100" required>
                <div class="input-help">
                    <span class="help-text">A friendly name for the device</span>
                    <span class="char-count" x-text="`${formData.name.length}/100`">0/100</span>
                </div>
            </div>

            <div class="form-group">
                <label for="enrollmentEmail" class="form-label">
                    <span class="label-text">Email Address</span>
                    <span class="label-info">📧</span>
                </label>
                <input type="email" id="enrollmentEmail" name="email" class="form-input" x-model="formData.email" placeholder="user@example.com" maxlength="255">
                <div class="input-help">
                    <span class="help-text">Optional: Email for additional enrollment verification</span>
                </div>
            </div>

            <div class="form-group">
                <label for="challengeRequired" class="form-label">
                    <span class="label-text">Auth Attempt Challenge Required</span>
                </label>
                <select id="challengeRequired" name="authAttemptChallengeRequired" class="form-input" x-model="formData.challengeRequired">
                    <option :selected="formData.challengeRequired === true" value="true">Yes</option>
                    <option :selected="formData.challengeRequired === false" value="false">No</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="neo-brutal-button primary btn-large" :disabled="!isFormValid() || isSubmitting" :class="{ 'btn-loading': isSubmitting }">
                    <span x-show="!isSubmitting" class="btn-icon">🚀</span>
                    <span x-show="isSubmitting" class="btn-icon">⏳</span>
                    <span x-text="isSubmitting ? 'Creating Enrollment...' : 'Create Enrollment'">Create Enrollment</span>
                </button>
                <a th:href="@{'/enrollments'(integrationId=${enrollmentRequest.integrationId})}" class="neo-brutal-button secondary btn-large">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
function enrollmentForm() {
    return {
        formData: {
            name: '',
            email: '',
            challengeRequired: true
        },
        isSubmitting: false,
        isFormValid() {
            return this.formData.name && this.formData.name.trim().length >= 3;
        },
        async submitForm() {
            if (!this.isFormValid() || this.isSubmitting) return;
            this.isSubmitting = true;
            try {
                const fd = new FormData(this.$refs.form);
                fd.set('name', this.formData.name);
                fd.set('email', this.formData.email);
                fd.set('authAttemptChallengeRequired', String(this.formData.challengeRequired));
                const res = await fetch(this.$refs.form.getAttribute('action'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(fd)
                });
                if (res.redirected) {
                    window.location.href = res.url;
                } else if (res.ok) {
                    window.location.reload();
                } else {
                    alert('Failed to create enrollment');
                }
            } finally {
                this.isSubmitting = false;
            }
        }
    }
}
</script>

<style>
    .form-section { background: var(--acme-light); border: 4px solid var(--acme-dark); padding: 2rem; margin-bottom: 3rem; box-shadow: 8px 8px 0 var(--acme-dark); }
    .form-header { margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 3px solid var(--acme-primary); }
    .form-title { font-size: 2rem; color: var(--acme-primary); margin-bottom: 0.5rem; }
    .form-subtitle { color: var(--acme-dark); opacity: 0.8; margin: 0; }
    .brutal-form { max-width: 600px; }
    .form-group { margin-bottom: 2rem; }
    .form-label { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; font-weight: 700; text-transform: uppercase; color: var(--acme-dark); }
    .label-required { color: var(--acme-error); font-weight: 900; }
    .form-input { width: 100%; padding: 1rem; border: 3px solid var(--acme-dark); background: var(--acme-light); font-family: inherit; font-size: 1rem; font-weight: 500; box-shadow: 3px 3px 0 var(--acme-dark); }
    .input-help { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; font-size: 0.9rem; }
    .help-text { color: var(--acme-dark); opacity: 0.7; }
    .char-count { color: var(--acme-primary); font-weight: 700; font-size: 0.8rem; }
    .form-actions { display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }
    .btn-loading { opacity: 0.8; cursor: not-allowed !important; }
</style>
</html>
