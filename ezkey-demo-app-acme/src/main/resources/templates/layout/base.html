<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">ACME Inc - Protected Application</title>
    
    <!-- Neo Brutalism CSS -->
    <link rel="stylesheet" th:href="@{/css/neo-brutalism.css}">
    
    <!-- Custom CSS for ACME branding -->
    <link rel="stylesheet" th:href="@{/css/acme-theme.css}">
    
    <!-- WebJars dependencies -->
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
    <script th:src="@{/webjars/alpinejs/dist/cdn.min.js}" defer></script>
</head>
<body class="neo-brutal-body">
    
    <!-- Navigation Header -->
    <header class="neo-brutal-header">
        <nav class="neo-brutal-nav">
            <div class="nav-brand">
                <h1 class="brand-logo">ACME</h1>
                <span class="brand-subtitle">INC</span>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-link" th:classappend="${#httpServletRequest.requestURI == '/' ? 'active' : ''}">Home</a>
                <a href="/about" class="nav-link" th:classappend="${#httpServletRequest.requestURI == '/about' ? 'active' : ''}">About</a>
                <a href="/integrations" class="nav-link" th:classappend="${#httpServletRequest.requestURI.startsWith('/integrations') ? 'active' : ''}">Integrations</a>
                <a href="/auth-attempts" class="nav-link" th:classappend="${#httpServletRequest.requestURI.startsWith('/auth-attempts') ? 'active' : ''}">Auth Attempts</a>
            </div>
        </nav>
    </header>

    <!-- Flash Messages -->
    <div class="flash-messages" th:if="${success != null or error != null}">
        <div class="container">
            <div th:if="${success != null}" class="flash-message flash-success" x-data="{ show: true }" x-show="show" x-transition>
                <div class="flash-content">
                    <strong>Success!</strong> <span th:text="${success}">Success message</span>
                </div>
                <button type="button" class="flash-close" @click="show = false">×</button>
            </div>
            
            <div th:if="${error != null}" class="flash-message flash-error" x-data="{ show: true }" x-show="show" x-transition>
                <div class="flash-content">
                    <strong>Error!</strong> <span th:text="${error}">Error message</span>
                </div>
                <button type="button" class="flash-close" @click="show = false">×</button>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="neo-brutal-main">
        <div class="container">
            <!-- Page content will be inserted here by including templates -->
            <div th:block th:fragment="content">
                <!-- Content will be replaced by specific page templates -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="neo-brutal-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h4>ACME Inc Demo</h4>
                    <p>Powered by Ezkey MFA</p>
                </div>
                <div class="footer-section">
                    <h4>Ezkey Integration</h4>
                    <p>Open Source MFA Solution</p>
                </div>
                <div class="footer-section">
                    <h4>Demo Status</h4>
                    <p class="status-active">System Active</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 ACME Inc. Demo Application - Ezkey Integration Showcase</p>
            </div>
        </div>
    </footer>

    <!-- Additional CSS for layouts -->
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Flash Messages */
        .flash-messages {
            background-color: var(--acme-gray);
            padding: 1rem 0;
            border-bottom: 4px solid var(--acme-dark);
        }

        .flash-message {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            margin: 0.5rem 0;
            border: 4px solid var(--acme-dark);
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 4px 4px 0 var(--acme-dark);
        }

        .flash-success {
            background-color: var(--acme-success);
            color: var(--acme-dark);
        }

        .flash-error {
            background-color: var(--acme-error);
            color: var(--acme-light);
        }

        .flash-content {
            flex: 1;
        }

        .flash-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            color: inherit;
            margin-left: 1rem;
            transition: transform 0.2s ease;
        }

        .flash-close:hover {
            transform: scale(1.2);
        }

        /* Footer Styling */
        .neo-brutal-footer {
            background-color: var(--acme-dark);
            color: var(--acme-light);
            border-top: 8px solid var(--acme-primary);
            margin-top: 4rem;
            padding: 2rem 0 1rem;
        }

        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .footer-section h4 {
            color: var(--acme-primary);
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            font-weight: 900;
        }

        .footer-section p {
            font-size: 0.9rem;
            line-height: 1.4;
            margin: 0;
        }

        .status-active {
            color: var(--acme-success) !important;
            font-weight: 700 !important;
        }

        .footer-bottom {
            border-top: 2px solid var(--acme-primary);
            padding-top: 1rem;
            text-align: center;
        }

        .footer-bottom p {
            font-size: 0.8rem;
            margin: 0;
            opacity: 0.8;
        }

        /* Navigation active state */
        .nav-link.active {
            background-color: var(--acme-primary);
            color: var(--acme-light);
            box-shadow: 4px 4px 0 var(--acme-dark);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }
            
            .footer-content {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .flash-message {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .flash-close {
                align-self: flex-end;
                margin-left: 0;
                margin-top: 0.5rem;
            }
        }
    </style>

    <!-- Custom JavaScript for enhanced interactions -->
    <script>
        // Auto-hide flash messages after 5 seconds
        document.addEventListener('DOMContentLoaded', function() {
            const flashMessages = document.querySelectorAll('.flash-message[x-data]');
            flashMessages.forEach(message => {
                setTimeout(() => {
                    if (message._x_dataStack && message._x_dataStack[0].show) {
                        message._x_dataStack[0].show = false;
                    }
                }, 5000);
            });
        });

        // HTMX configuration for better UX
        document.body.addEventListener('htmx:beforeRequest', function(evt) {
            // Add loading state to forms
            const form = evt.target.closest('form');
            if (form) {
                const submitBtn = form.querySelector('button[type="submit"]');
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Processing...';
                }
            }
        });

        document.body.addEventListener('htmx:afterRequest', function(evt) {
            // Remove loading state from forms
            const form = evt.target.closest('form');
            if (form) {
                const submitBtn = form.querySelector('button[type="submit"]');
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = submitBtn.getAttribute('data-original-text') || 'Submit';
                }
            }
        });
    </script>
</body>
</html>
