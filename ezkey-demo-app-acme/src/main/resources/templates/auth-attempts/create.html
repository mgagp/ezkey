<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/neo-brutalism.css">
    <link rel="stylesheet" href="/css/acme-theme.css">
    <style>
        .create-auth-attempt-hero {
            background: linear-gradient(135deg, var(--acme-light) 0%, var(--acme-secondary) 20%, var(--acme-accent) 100%);
            border: 8px solid var(--acme-dark);
            margin: 2rem 0;
            padding: 2rem;
            box-shadow: 12px 12px 0 var(--acme-primary);
            text-align: center;
        }
        
        .create-form-container {
            background: var(--acme-light);
            border: 8px solid var(--acme-dark);
            margin: 3rem 0;
            padding: 3rem;
            box-shadow: 12px 12px 0 var(--acme-secondary);
        }
        
        .form-group {
            margin-bottom: 2rem;
        }
        
        .form-label {
            display: block;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--acme-dark);
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }
        
        .form-input,
        .form-select {
            width: 100%;
            padding: 1rem 1.5rem;
            border: 6px solid var(--acme-dark);
            background: var(--acme-light);
            color: var(--acme-dark);
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 6px 6px 0 var(--acme-primary);
            box-sizing: border-box;
        }
        
        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--acme-accent);
            box-shadow: 6px 6px 0 var(--acme-accent);
        }
        
        .form-input::placeholder {
            color: var(--acme-gray);
        }
        
        .enrollment-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
        }
        
        .enrollment-info {
            flex: 1;
        }
        
        .enrollment-name {
            font-weight: 700;
            color: var(--acme-dark);
        }
        
        .enrollment-details {
            font-size: 0.9rem;
            color: var(--acme-primary);
        }
        
        .action-buttons-row {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 3rem 0;
            flex-wrap: wrap;
        }
        
        .mega-button {
            background: linear-gradient(135deg, var(--acme-primary) 0%, var(--acme-secondary) 100%);
            color: var(--acme-dark);
            border: 6px solid var(--acme-dark);
            padding: 1rem 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
            box-shadow: 8px 8px 0 var(--acme-accent);
            cursor: pointer;
        }
        
        .mega-button.secondary {
            background: linear-gradient(135deg, var(--acme-gray) 0%, var(--acme-secondary) 100%);
            box-shadow: 8px 8px 0 var(--acme-primary);
        }
        
        .mega-button[type="submit"] {
            background: linear-gradient(135deg, var(--acme-success) 0%, var(--acme-accent) 100%);
        }
        
        .help-text {
            font-size: 0.9rem;
            color: var(--acme-primary);
            margin-top: 0.5rem;
            font-weight: 600;
        }
    </style>
</head>
<div th:fragment="content">
    <div class="create-auth-attempt-hero">
        <h1 class="integration-title" style="color: var(--acme-dark); text-shadow: 3px 3px 0 var(--acme-light), 6px 6px 0 var(--acme-primary); font-size: 2.5rem; margin-bottom: 1rem;">
            Create Authentication Attempt
        </h1>
        <p style="font-weight: 700; font-size: 1.2rem; color: var(--acme-dark);">
            Initiate a new authentication request for an enrolled device
        </p>
    </div>

    <div class="create-form-container">
        <form th:action="@{/auth-attempts/create}" method="post">
            <div class="form-group">
                <label for="enrollmentId" class="form-label">Select Enrollment</label>
                <select id="enrollmentId" name="enrollmentId" class="form-select" required>
                    <option value="">Choose an enrollment...</option>
                    <option th:each="enrollment : ${enrollments}"
                            th:value="${enrollment.enrollmentId}"
                            th:text="${enrollment.enrollmentName} + ' (' + ${integrationNames.get(enrollment.integrationId)} + ')'"
                            th:selected="${enrollment.enrollmentId == selectedEnrollmentId}">
                        Select an enrollment...
                    </option>
                </select>
                <div class="help-text">
                    Select the enrollment for which you want to create an authentication attempt
                </div>
            </div>

            <div class="form-group">
                <label for="challenge" class="form-label">Challenge Code (Optional)</label>
                <input type="text" 
                       id="challenge" 
                       name="challenge" 
                       class="form-input" 
                       placeholder="Enter challenge code (e.g., 123456)"
                       maxlength="10"
                       pattern="[0-9]*">
                <div class="help-text">
                    Optional challenge code that will be displayed to the user during authentication
                </div>
            </div>

            <div class="action-buttons-row">
                <button type="submit" class="mega-button">
                    ➕ Create Authentication Attempt
                </button>
                <a th:href="@{/auth-attempts}" class="mega-button secondary">
                    ← Cancel
                </a>
            </div>
        </form>
    </div>
</div>
</html>
