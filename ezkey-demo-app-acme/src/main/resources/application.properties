# ACME Demo Application Configuration
# Demonstrates EZKey passwordless login integration with backend authentication
server.port=8082

# Application metadata
spring.application.name=ezkey-demo-app-acme
info.app.name=ACME Inc Demo Application
info.app.description=Demo application showcasing EZKey passwordless login
info.app.version=2.0.0

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Static resources configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600

# =============================================================================
# EZKey Integration Configuration
# =============================================================================
# Admin API base URL (internal Docker network or localhost)
# For Docker: http://admin-api:9080 (internal network)
# For IDE: http://localhost:9080
ezkey.admin.api.url=http://localhost:9080

# API Key credentials for M2M authentication (created via Admin API for ACME integration)
# Integration Key: Public key (e.g., ezkey_ikey_xxx) - used as HTTP Basic Auth username
# Secret Key: Secret key (e.g., ezkey_skey_xxx) - used as HTTP Basic Auth password
# Format: Authorization: Basic base64(integrationKey:secretKey)
# These can be set via environment variables or external config file
# If not set, defaults to empty (application will start but login will fail)
ezkey.integration-key=${EZKEY_INTEGRATION_KEY:}
ezkey.secret-key=${EZKEY_SECRET_KEY:}

# =============================================================================
# Logging configuration
# =============================================================================
logging.level.org.ezkey.demo.acme=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Development configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# # spring.jackson.deserialization.ADJUST_DATES_TO_CONTEXT_TIME_ZONE=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSSSS
