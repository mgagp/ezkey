# Ezkey Sim API - Docker Configuration
spring.application.name=ezkey-sim-api
server.port=8081

# No database needed for sim API
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Flyway Migration (disabled for sim API)
spring.flyway.enabled=false

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.custom-site-title=Ezkey Simulation API Documentation

# Logging Configuration
logging.level.org.ezkey=${LOGGING_LEVEL_ORG_EZKEY:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:WARN}
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}

# Development Tools (disabled in docker)
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Performance optimizations for Docker
server.tomcat.threads.max=5
server.tomcat.threads.min-spare=2

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized